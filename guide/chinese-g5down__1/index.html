学习通过描写园中动植物或童年琐事来表达对自由的向往或对亲人的思念。\",\"difficulty\":3,\"question_types\":[\"填空\",\"简答题\",\"习作\"]},{\"name\":\"体会课文表达的思想感情\",\"description\":\"通过抓重点词句、角色代入等方法，深入体会作者怀乡、思亲、爱国的深沉情感。\",\"difficulty\":4,\"question_types\":[\"选择\",\"简答题\"]},{\"name\":\"习作：把情感写具体\",\"description\":\"通过具体的动作、神态、景物描写，将“那一刻”的成长感悟具体化。\",\"difficulty\":4,\"question_types\":[\"习作\"]}],\"examLessonId\":\"chinese-g5down-u1-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"古诗词情景想象与默写\",\"core_concept\":\"本单元选取三首表现古代儿童生活的诗作。要求通过诗中的动词（如：耘、学、弄、穿、横）想象画面，理解田园生活的质朴与诗意。重点在于体会诗人如何通过白描手法勾勒出孩童的天真浪漫与农民的辛劳。\",\"key_formula\":\"抓动词+看背景+入情境=诗画统一\",\"common_mistakes\":[\"‘昼出耘田夜绩麻’中‘绩麻’与‘耕种’含义混淆。\",\"‘浸寒漪’的‘漪’字容易写成‘椅’或‘依’。\"],\"tips\":\"可以尝试给诗句‘配画’，在脑海中构建牧童骑牛、儿童敲冰的动态画面，记忆更深刻。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/c4/c4cd49b3b1f8f5d91bb9ca71ea7ca04f49da866a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/8a/8af05a9b6b77448db64c7a86be6de00dcda18054.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/42/423feada0b5010be8ba28ffea869e42fec632434.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/c7/c7e02f143c3884a1ded2a6cab278e667f701293a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ab/ab5b0c46f2c6d001fc469a29df95dc0a64aaac72.mp3\",\"https://api.clthuanxie.cn/cc-audio/93/9376772f1f474edf0de06584221df1e6a9a5ce4a.mp3\"]}},{\"point\":\"借物/事抒情的方法\",\"core_concept\":\"通过对园子里的动植物（如倭瓜、黄瓜、蝴蝶）或具体事件（外祖父教读古诗、整理梅花图）的描写，将抽象的思想感情具体化。景物描写不再是客观呈现，而是被打上了作者情感的烙印。\",\"key_formula\":\"物/事 + 人心 = 请感外化\",\"common_mistakes\":[\"写客观景物太多，忘记点明主观感受。\",\"选取的事件太琐碎，不能支撑核心情感的表达。\"],\"tips\":\"当心情快乐时，笔下的花草仿佛也在笑；当心情忧郁时，月色也显得凄清。这就是借物抒情的秘密。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/0b/0b658e2c76ffe47ac54eb346ded1b85f0db69162.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/99/995c6770c9a40464caca4e51d6b94861abb32748.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/5b/5bd7bee460ce2d9804bcb028edc8db773492e146.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/9a/9adbe45f188e02f428def9c459f502a582d0753d.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/e2/e2400a40f303698d59a4bc62339a0ecc2955f86d.mp3\",\"https://api.clthuanxie.cn/cc-audio/ff/ff68099e4cccd17a76371ef9cc95415ea3436fb8.mp3\"]}},{\"point\":\"体会课文表达的思想感情\",\"core_concept\":\"通过品味带有抒情色彩的词句，结合段落背景，理解作者对故乡、对童年、对亲人的深厚情感。如《月是故乡明》中的对比写法，《梅花魂》中的多次落泪细节，都是情感的爆发点。\",\"key_formula\":\"找关键词 + 联生活点 + 悟中心意\",\"common_mistakes\":[\"情感表达过于空洞（如：表达了爱家乡），没有结合具体文字说明。\",\"无法区分‘怀念童年’与‘思念祖国’这类细微的情感差别。\"],\"tips\":\"把自己代入作者的角色，想象如果换做是你离家万里，看到故乡的一草一木会是什么心情。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/b8/b8dc8c652944795cfe2cd964dbe3d840f9b4201b.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/d3/d3dfd8e78a3f786726a5c15b8fa8d0e589b8a487.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/21/21d4858d2a0a3062611d1d46b522d6cf7c726715.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/cf/cf95f16a3efc6b30dcf1a633718eb83f43f4d827.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/f7/f7965e406cbf44f6dd7d5777f39f1d4211c922ff.mp3\",\"https://api.clthuanxie.cn/cc-audio/d5/d52773dd696aa290e776811a66740d639c9fbdee.mp3\"]}},{\"point\":\"习作：把情感写具体\",\"core_concept\":\"习作要求将成长过程中的某一刻情感（如惭愧、自豪、感动）放大。通过细致入微的动作捕捉、神态细节的刻画以及环境气氛的烘托，让文字具有感染力。\",\"key_formula\":\"动作分解 + 神态捕捉 + 景物衬托 = 情感具体化\",\"common_mistakes\":[\"只会用‘我非常开心’这种描述，没有具体的细节支撑。\",\"流水账式记录过程，忽略了‘那一刻’的心理特写。\"],\"tips\":\"练习‘慢动作回放’，把一个简单的开门动作拆解成转把手、推门、屏住呼吸等小细节。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/4c/4c5de1d0c366e8e8e1e4b9d55838b36bd65260e5.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/32/32d42d6f6b3604e15ffc13f033b13bd9d428845e.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/dd/ddb21ab90faf4e1230cb19ce0e2cf0c85ee87244.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/51/511f70582e2145d815aced5cbba395c97344b6b5.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ca/ca796c8dea4fcf0b845ea3d991e1844432a8ff4a.mp3\",\"https://api.clthuanxie.cn/cc-audio/3a/3a538e8fff46c7ab9c0d85405d52d9ad0744b0b0.mp3\"]}}]}]}]\n"])</script></body></html>
