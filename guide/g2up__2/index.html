":\"掌握个位不够减从十位退一作十再减的算理，熟练进行减法笔算。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"填空\",\"应用题\"]},{\"name\":\"连加、连减与加减混合运算\",\"description\":\"理解运算顺序（由左至右），掌握通过简便竖式计算多个数加减的方法。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"口算\",\"填空\"]},{\"name\":\"含小括号的加减混合运算\",\"description\":\"理解小括号的作用，掌握含有小括号算式的优先运算顺序规则。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"选择\",\"计算题\"]},{\"name\":\"解决问题：求比一个数多（或少）几的数\",\"description\":\"分析数量关系，利用加减法解决简单的比较型应用题。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"填空\"]}],\"examLessonId\":\"g2up-u2-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"两位数加两位数（不进位与进位）\",\"core_concept\":\"笔算加法时，相同数位要对齐，从个位加起。如果个位相加满十，要向十位进一。在计算十位时，千万不要忘记加上个位进上来的“1”。\",\"key_formula\":\"相同数位对齐，从个位加起，个位满十向十位进一。\",\"common_mistakes\":[\"忘记加进位1\",\"数位没有对齐，导致错误的把个位和十位上的数相加\"],\"tips\":\"写竖式时，进位的“1”建议写成小字标在十位右下方，防止漏加。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/fb/fb8d242c2c999f6d294579b6d39fa2aa689a5b61.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/32/32b12661e22dff5906a33bf110192317aba5ddf9.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ae/aed76d8ec9856125a04a4ab13c63c455d6b369c1.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ed/edb91485147e0f544d2376686877c0f6723e1345.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/cf/cf729245a3cfcd3936e324ee47965d5f65b80604.mp3\",\"https://api.clthuanxie.cn/cc-audio/05/056003676517fb118a90f6c302529ccd877751af.mp3\"]}},{\"point\":\"两位数减两位数（不退位与退位）\",\"core_concept\":\"笔算减法时，相同数位对齐，从个位减起。如果个位不够减，就从十位退一。在十位上退一后，到个位变成了十，与个位上的数合起来再减。\",\"key_formula\":\"相同数位对齐，从个位减起，个位不够减从十位退一作十。\",\"common_mistakes\":[\"计算十位时忘记减去退掉的“1”\",\"个位不够减时，直接用大数减小数（如 32-18 算出 26）\"],\"tips\":\"退位减法要记得在被减数的十位上面点一个小圆点提示自己已经退位了。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/3e/3e419d285a71c4aaf02b09e4d106b970dfdeb21f.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/39/399b6dd9e7d586e37d532f7e42b29950c18d9ecc.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/13/133bbf89314ecd40e4313e01ae38a75c9de153d8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/e8/e8581f3fbeebd0a00f997a66bc5656ef852b3a23.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/df/df59fea8ae733266c1c8e9dfa889a351e50aea5d.mp3\",\"https://api.clthuanxie.cn/cc-audio/b2/b214f10789db3d633bdd2d792a0c06c20b54ee40.mp3\"]}},{\"point\":\"连加、连减与加减混合运算\",\"core_concept\":\"连加、连减和加减混合运算，一般按照从左到右的顺序依次计算。为了书写简便，可以把两个竖式合并成一个竖式。\",\"key_formula\":\"从左往右看，谁在前面先算谁。\",\"common_mistakes\":[\"看错运算符号，把加法当成减法或反之\",\"两步计算中第一步算错导致最后结果错误\"],\"tips\":\"在计算连加时，寻找凑成整十的数（如4+6, 2+8）先加，可以提高速度。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/93/93368fcc1fdfe1d9b0c074861281cd2f9776bbdf.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/61/6171e41b95da40ea210a6f24d69217d8c49bb92f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/cf/cf7f176c4e856df08b958c61959ce10a53c94f6f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/1d/1d31aee180aab2f026d0e845f513209a964063f3.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/99/9987234da1d54154fcb2f7a864f739fa4e1a5841.mp3\",\"https://api.clthuanxie.cn/cc-audio/62/62b1a2c959e1ae7bc6e2bae463117ba812b135eb.mp3\"]}},{\"point\":\"含小括号的加减混合运算\",\"core_concept\":\"如果在算式中看到了小括号，它就像一个超级通行证，括号里的内容必须最先计算。算完括号再算括号外面的。\",\"key_formula\":\"含有小括号的，要先算括号里面的。\",\"common_mistakes\":[\"无视括号，依然从左到右计算\",\"在列竖式时，只写了括号里的算式，漏写了第二步\"],\"tips\":\"看到（ ），先圈起来，写上“先算”两个字提醒自己。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/1b/1b4ee0d6e5eca93b1f09bed4e3af9a5ee57d5399.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/77/77dee9c95ef966b3a3cb003d4a08ad9fd1178d26.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/5c/5c530fe15202c5da957d99e609a58c9c22dc34ba.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/f4/f467540872989a4598aa07aba6988ec13cd551e2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c6/c67f7dde094e639d10526abdac25daa0a281f980.mp3\",\"https://api.clthuanxie.cn/cc-audio/d9/d94c8d931a345a0d41287899e5ea809fc09bbff2.mp3\"]}},{\"point\":\"解决问题：求比一个数多（或少）几的数\",\"core_concept\":\"已知一个数，求比它多几的数，用加法计算（大数=小数+相差数）；求比它少几的数，用减法计算（小数=大数-相差数）。\",\"key_formula\":\"求多用加法（$+$），求少用减法（$-$）。\",\"common_mistakes\":[\"不理解题意，盲目根据“多”就加，“少”就减（有时题目是倒着问的）\",\"找错比较的标准量\"],\"tips\":\"可以画简单的线段图辅助分析：长的线段表示多，短的线段表示少。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/ca/ca911e4f80c5c826a9fdd184a3b9823983e79527.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ef/efdfcd9f111a35c83d79da7d0deacb3cec5fd5dc.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/d7/d7a5a26c0ca85baca7147b0e7a7d9f063fc7ea57.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/0f/0fdb7cd3cc910bccfb2862607e132ec77e00b06b.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d2/d2feb487327f912518add9f004486b3e625660f1.mp3\",\"https://api.clthuanxie.cn/cc-audio/9e/9e6e41669b4e4aa04bfed05461897572df2842cf.mp3\"]}}]}]}]\n"])</script></body></html>
