":[{\"name\":\"折扣与成数\",\"description\":\"理解打折和成数的含义，掌握其与百分数、分数的互化方法\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"应用题\"]},{\"name\":\"税率与应纳税额计算\",\"description\":\"理解纳税意义，掌握应纳税额、税率、营业额之间的数量关系\",\"difficulty\":3,\"question_types\":[\"应用题\",\"填空\"]},{\"name\":\"利率与利息计算\",\"description\":\"理解本金、利率、存期的概念，掌握利息与本息合计的计算公式\",\"difficulty\":3,\"question_types\":[\"应用题\",\"竖式计算\"]},{\"name\":\"百分数综合方案对比\",\"description\":\"综合运用折扣、满减等优惠方式解决购物最省钱方案的选择问题\",\"difficulty\":4,\"question_types\":[\"选择\",\"应用题\"]}],\"examLessonId\":\"g6down-u2-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"折扣与成数\",\"core_concept\":\"折扣表示现价是原价的百分之几十。几折就是十分之几，即百分之几十；几几折就是百分之几十几。成数表示一个数是另一个数的十分之几。常用于农业收成，“一成”即 10%，“三成五”即 35%。\",\"key_formula\":\"$$现价 = 原价 \\\\times 折扣$; $原价 = 现价 \\\\div 折扣$\",\"common_mistakes\":[\"将“几折”误解为便宜了百分之几十，例如八折误算为省了80%\",\"成数转换错误，如“三成”写成 3% 而不是 30%\"],\"tips\":\"记住“打几折”就是把原价分成10份，取其中的几份。看到成数直接联想百分数的十位。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/d6/d693b3042df00c04aad87ef1269a94733f280de1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/c3/c3308cc12470d3732a540ec7c02078490029520e.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/b3/b345555c23ec977ba970034a473173dc3ac6b6df.edge-af27daceee26.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/c6/c681131282b97477aa35f4cbd77624a4ea559679.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/03/03f0bc5f56cff7757481e2cd4357f31d3f4f418f.mp3\",\"https://api.clthuanxie.cn/cc-audio/b8/b8c0276c2700267622cbb766ad04d655f1d5ddf3.mp3\"]}},{\"point\":\"税率与应纳税额计算\",\"core_concept\":\"纳税是国家财政收入的主要来源。应纳税额是缴纳的税款。应纳税额与各种收入（销售额、营业额等）的比率叫做税率。解决此类问题需找准单位“1”即总收入。\",\"key_formula\":\"$$应纳税额 = 总收入 \\\\times 税率$\",\"common_mistakes\":[\"混淆税率和应纳税额，计算时放错位置\",\"计算个人所得税时未减去起征点（免税额）\"],\"tips\":\"税率计算就是一个求一个数的百分之几是多少的应用题，关键是对应好数据。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/d8/d83de90b423df6fb91db1e363013dc5c293fd2e3.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/1a/1a44292c8b68738b47752d151fa2fa7d6d119df0.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/9b/9b18d51c1772a96c80d3798228c3eacfed844829.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/99/999ff14a66e32aa154be1835dd0e6487bedb5420.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d1/d106b1cdecb4f96dd991f33b8772575828110870.mp3\",\"https://api.clthuanxie.cn/cc-audio/09/09fc6e873eb309373358bbb9ddf73910aedbcf24.mp3\"]}},{\"point\":\"利率与利息计算\",\"core_concept\":\"存入银行的钱叫本金，取款时银行多付的钱叫利息。单位时间内的利息与本金的比率叫利率。利息不仅取决于本金和利率，还取决于存款的时间长短。\",\"key_formula\":\"$$利息 = 本金 \\\\times 利率 \\\\times 存期$\",\"common_mistakes\":[\"忽视存款时间，直接用本金乘以利率\",\"求“一共取回多少钱”时漏加本金\"],\"tips\":\"计算本息合计时，可以用 $本金 \\\\times (1 + 利率 \\\\times 存期)$ 进行简便运算。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f7/f76676b6fa2ea2dc4695fd9fe3292084dcc3d9f2.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/5c/5ce26ef327d73c36508f527baa09b51a72785e93.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/b5/b5bae5ce9b570224fc8ac282fd58e626239774f8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/5f/5fd9778d1a331a7b786312e3b0adfdcc91ed5625.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ec/ece87602aeb88e205c3cc4d3bb489a57a9ca94b5.mp3\",\"https://api.clthuanxie.cn/cc-audio/96/96f007cab57da438288778e8af65cb3e6790998b.mp3\"]}},{\"point\":\"百分数综合方案对比\",\"core_concept\":\"在实际购物中，商家常采用多种优惠方式。如打折、满减（满多少减多少）、返券、买几送几等。对比方案需要分别算出每种方案最终的实付金额，再进行比较。\",\"key_formula\":\"$$实付款 = 总价 - 优惠金额$ (比较各方案实付款最小值)\",\"common_mistakes\":[\"满减活动中，没有考虑到未满额部分不享受减免\",\"在返券活动和打折活动对比时，忽略返券需要二次消费的限制\"],\"tips\":\"解决最省钱方案问题，最好的办法是在草稿纸上分别列出不同方案的计算式，求出最终结果再挑选。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/ac/ac5a195d230f4b1d51a67d5a3bb3dd9f79f3b6ca.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/93/933b6891d571bf4f7262b1df8b23e1d7ad9cf8bc.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ab/ab5b67d4405b5976b70e0b83219205cc1b17bd41.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/cf/cfcdb7237380d2a4535ed65d75860ab02d1c5812.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/7a/7a257ad212ee261d06855aef12fe16314235a0ff.mp3\",\"https://api.clthuanxie.cn/cc-audio/b2/b2e0d270d069cb88f1bdeb10887c2019321894b9.mp3\"]}}]}]}]\n"])</script></body></html>
