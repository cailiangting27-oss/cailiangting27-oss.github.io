将除数是小数的除法转化为除数是整数的除法进行计算。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"判断\"]},{\"name\":\"商的近似数（进一法与去尾法）\",\"description\":\"根据实际生活需要，灵活运用“进一法”或“去尾法”取商的近似值。\",\"difficulty\":3,\"question_types\":[\"应用题\",\"选择\"]},{\"name\":\"循环小数的相关概念\",\"description\":\"理解循环小数、循环节的概念，掌握循环小数的简便记法。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"判断\"]},{\"name\":\"用计算器探索规律\",\"description\":\"借助计算器发现小数除法中商的规律，并能根据规律写出相关的商。\",\"difficulty\":4,\"question_types\":[\"填空\",\"规律探索\"]}],\"examLessonId\":\"g5up-u3-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"除数是整数的小数除法\",\"core_concept\":\"计算小数除以整数时，按照整数除法的法则计算。关键是商的小数点要与被除数的小数点对齐。如果被除数的整数部分不够除，要在商的个位商0，点上小数点继续除；如果除到末尾有余数，要在余数后面添0继续除。\",\"key_formula\":\"商的小数点与被除数的小数点对齐\",\"common_mistakes\":[\"商的小数点点错位置\",\"整数部分不够商1时忘了在个位写0\"],\"tips\":\"竖式计算时，先点好商的小数点，再开始计算，防止遗漏。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/cb/cb945922a274d690c3cf6a63cf018614b114d65a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/1f/1f767cf70d7c46262db11d981d07decf42c39b08.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/31/3157ffb63eba11119aefc1ee72ad3f472f3e7bc4.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/00/00402b9b5300ebd5f531742055329356a58eb49a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/97/97c61c9567325710f8fd48e6cde2adc734f9bf0f.mp3\",\"https://api.clthuanxie.cn/cc-audio/98/982f43dc71fb6819ac16c58fe65e5fe8bda09d02.mp3\"]}},{\"point\":\"一个数除以小数的计算方法\",\"core_concept\":\"利用“商不变的性质”，将除数和被除数同时扩大相同的倍数，使除数变成整数。除数扩大几倍（看除数有几位小数），被除数的小数点就向右移动几位。位数不够时，在被除数的末尾用0补足。\",\"key_formula\":\"$$a \\bdiv b = (a \\times n) \\bdiv (b \\times n)$ ($n \\neq 0$)\",\"common_mistakes\":[\"被除数和除数扩大的倍数不一致\",\"被除数位数不够移动小数点时忘了添0\"],\"tips\":\"一看：看除数有几位小数；二移：移动除数小数点变整数，被除数跟着移；三算：按除数是整数的除法算。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/d3/d300674513181cc3642c6bb7b704b542d6a871b1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/54/54db35b7fdb3a82ec71ace5d1adf28cbf784f04c.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/9b/9b951cb4fa56f1b6a0a4d5bc0296f7138a008256.edge-f60d78e383a6.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ec/ecfa12247aa4ef9cf0f578deda7a2aa352199b9f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/19/19edf35f2c7c6aad3416e13a674d42acbda600f9.mp3\",\"https://api.clthuanxie.cn/cc-audio/15/150c80ea2b6e44c1f4c0e3c54ab023b8ee070b47.mp3\"]}},{\"point\":\"商的近似数（进一法与去尾法）\",\"core_concept\":\"在实际应用中，取商的近似值不仅可以用“四舍五入法”，还要根据实际需要使用“进一法”（如装油需要瓶子）或“去尾法”（如布料做衣服）。“进一法”是无论余数是多少都向前进一；“去尾法”是无论余数是多少都舍去。\",\"key_formula\":\"根据实际情况取近似数\",\"common_mistakes\":[\"机械使用四舍五入，忽略生活情境\",\"计算精确位数时没有多算一位便直接取值\"],\"tips\":\"分东西、做衣服用“去尾法”；装东西、载人用“进一法”。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/45/45b93c2ef347b3f7d8637a1888eca08f6e2e153d.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/b6/b6ee98ae476765c8839036b5a76bd091aa496574.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/8f/8fc3f3989b8d6f63b5ca7554ee0fbc118e59e92d.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/b8/b81ef92d5825c3f49e653bf0b98760856a8cabd2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/28/28e4824eeae704a01b730c62aa43aaf65ef7c47b.mp3\",\"https://api.clthuanxie.cn/cc-audio/c2/c2c3ec7d3416d0238ffa5118e272be9bf518b54f.mp3\"]}},{\"point\":\"循环小数的相关概念\",\"core_concept\":\"一个数的小数部分，从某一位起，一个数字或者几个数字依次不断重复出现，这样的小数叫循环小数。重复出现的数字叫循环节。可以只写一个循环节，在首位和末位数字上面点上小圆点表示。\",\"key_formula\":\"循环小数记法：$0.333... = 0.\\bdot{3}$\",\"common_mistakes\":[\"把有限小数误认为是循环小数\",\"写循环记法时点错了位置\"],\"tips\":\"循环小数必须是无限的。循环节是指最先开始重复的一段数字。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/5f/5fd904de165f2bea8ddb3b4d570b2d9f56b332d1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/00/00c5d2e89d32f26bd7401943e165d3313a82430a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/da/da17c05e23aece5dfe6ce7b72011b58ae7e20f70.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ca/caf85e79cc3149227afa20f487b95ca66323c6bf.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6c/6c08fa70cb4af152e042ab7c4b1afd52195dbc40.mp3\",\"https://api.clthuanxie.cn/cc-audio/00/00f6396529c5e547a2c13980d40d277aaf8c3d3b.mp3\"]}},{\"point\":\"用计算器探索规律\",\"core_concept\":\"利用计算器计算出一系列算式，通过观察商的位数、循环节、数字组成的变化，发现其中的数学规律，并能运用这些规律预测并写出后续复杂算式的结果。\",\"key_formula\":\"观察 $\\to$ 比较 $\\to$ 发现规律 $\\to$ 应用规律\",\"common_mistakes\":[\"观察不细致导致找错规律\",\"应用规律时数错了数字的个数\"],\"tips\":\"找出算式中变与不变的部分，通常规律与项数或数字的个数有关。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/bd/bdb4399be1d5c9fa65d517d0eea21a9b6cf44812.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/48/48f310952aceb16a8ccb9a096434fd58950b95ad.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/41/417b0a63b484b21b0a13bd65433621f6a37432e2.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/50/503463b5cb4e230af3e26902aecbd34996eb0e47.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/dd/dd629a9d7308c9fd3fccc660963e057270cba11f.mp3\",\"https://api.clthuanxie.cn/cc-audio/76/76ab1154561f26db727ee9bf92e5f64b7af7b025.mp3\"]}}]}]}]\n"])</script></body></html>
