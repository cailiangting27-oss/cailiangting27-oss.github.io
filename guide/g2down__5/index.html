式中，应按从左往右的顺序计算。\",\"difficulty\":2,\"question_types\":[\"口算\",\"排序/比较\"]},{\"name\":\"乘除法与加减法混合运算\",\"description\":\"掌握在没有括号的情况下，先算乘除法，后算加减法的优先级规则。\",\"difficulty\":3,\"question_types\":[\"口算\",\"判断\",\"选择\"]},{\"name\":\"带有小括号的混合运算\",\"description\":\"理解括号能改变运算顺序，掌握凡有括号必须先算括号内部内容的规则。\",\"difficulty\":3,\"question_types\":[\"口算\",\"填空\"]},{\"name\":\"解决两步计算的实际问题\",\"description\":\"分析数量关系，能将分步算式合并为带括号或不带括号的综合算式解决问题。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"填空\"]}],\"examLessonId\":\"g2down-u5-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"同级运算顺序\",\"core_concept\":\"在加减法或乘除法属于同一级别的算式中，没有括号时应按照从左到右的顺序依次计算。加法和减法是同级的，乘法和除法是同级的。\",\"key_formula\":\"$$a + b - c$ 或 $a \\times b \\times c$ 按顺序计算\",\"common_mistakes\":[\"在加减混合运算中先计算后面的加法，造成错误顺序。\",\"在乘除混合运算中不按顺序，先算好算的导致结果错误。\"],\"tips\":\"可以想象成排队，谁在左边谁先算。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/5f/5f8fe1c97dad4c4f8207aeaed56add064df9c2d3.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/6a/6a5aa85046d619607a4e8d3a58d36611cff5033a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/35/358de4e34ffba4c776931d94101c8a8c0735e7ac.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/97/9797a52e24322a92bad6de638dada30efb95760c.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/a6/a634bc9cc60b9d9d9a672d565a766f3a23f6caf9.mp3\",\"https://api.clthuanxie.cn/cc-audio/ea/eae3452809e2a3f9698f8a55dd0444f47b9167d5.mp3\"]}},{\"point\":\"乘除法与加减法混合运算\",\"core_concept\":\"在一个算式里，既有加、减法，又有乘、除法时，要先算乘、除法，后算加、减法。乘除法的优先级高于加减法。\",\"key_formula\":\"$$a + b \\times c$ 先算 $b \\times c$\",\"common_mistakes\":[\"习惯性从左往右算，忽略了乘除法优先的规则。\",\"抄写算式时，把没算的加减法符号漏掉。\"],\"tips\":\"记住口诀：先乘除，后加减。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/34/341632cc0272a82e81d9dc2a32b1419aa809cf5c.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/31/31a1830e00d34a65ed5c2e61d125a1e78c015922.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/02/022618dc0a990da43f1dc52cb8ef74a8c400b26d.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/20/20773161091cc0cdbdae16694687b37219c60fe0.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/60/60a953452a969bdd949232eff19bb43b4058d813.mp3\",\"https://api.clthuanxie.cn/cc-audio/1d/1d5355e4102e57d64a28a9bb8e4516a7539c3eae.mp3\"]}},{\"point\":\"带有小括号的混合运算\",\"core_concept\":\"小括号是数学中的“特权符号”。算式里有小括号，必须先算小括号里面的内容，不管里面是加减还是乘除。括号可以改变原来的运算顺序。\",\"key_formula\":\"$$(a + b) \\times c$ 先算 $a + b$\",\"common_mistakes\":[\"虽然有括号，但还是先算了括号外的乘除法。\",\"把括号内的结果算错，导致整个算式错误。\"],\"tips\":\"见到括号绕道走是不行的，必须冲进括号先完成它！\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8d/8dcd7d870a0411351a4983dc040f0eeb3e8b29f2.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/44/4441a78122b02ab8b41d4a454a666a4fa4b43c42.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/9a/9aeaa360acea56681537b6acff2bb8e2373d02f8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ee/ee8707368aee755e0298e36bd77d240f86a36e55.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/64/6413b53639a5d045091b3d323461f0885484a55f.mp3\",\"https://api.clthuanxie.cn/cc-audio/e4/e46f1bd1ad9a4b077ba7ac05fd74fb0f3f17cc98.mp3\"]}},{\"point\":\"解决两步计算的实际问题\",\"core_concept\":\"解决实际问题时，通常需要分两步思考。先求出一个中间量，再结合中间量求出最终答案。可以将分步算式合并成一个综合算式，必要时使用小括号。\",\"key_formula\":\"总数 $-$ 份数 $\\times$ 每份数 $=$ 剩余数\",\"common_mistakes\":[\"分步算式写对，但合并综合算式时忘记加必要的括号。\",\"逻辑混乱，不知道第一步应该先求什么。\"],\"tips\":\"先写分步，再合综合；合完检查，顺序对错。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a0/a077a208983b415df800f924ca702023689bca30.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/9c/9c61f44a24f56b5a3ff50594ac5be3fc81065b5f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/f3/f345affda9ac00402d275dbaf85e1a7729e14cba.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/b3/b35c3cf8100a8289e5d25edbe488001c26aba286.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/9e/9e1b65e06a02b0516e38aa23bb75ca342c5a260c.mp3\",\"https://api.clthuanxie.cn/cc-audio/b4/b47e15997fff4646dfe49e435664fbe745107a66.mp3\"]}}]}]}]\n"])</script></body></html>
