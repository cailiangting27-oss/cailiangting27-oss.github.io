":36,\"stage\":\"primary\"},\"unit\":{\"unit_number\":6,\"title\":\"分数的加法和减法\",\"knowledge_points\":[{\"name\":\"同分母分数加、减法\",\"description\":\"理解相同分数单位相加减的算理，掌握分母不变分子相加减的方法。\",\"difficulty\":2,\"question_types\":[\"口算\",\"填空\"]},{\"name\":\"异分母分数加、减法\",\"description\":\"理解通分的必要性，将异分母转化为同分母进行计算，结果要求最简。\",\"difficulty\":3,\"question_types\":[\"口算\",\"填空\",\"应用题\"]},{\"name\":\"分数加减混合运算\",\"description\":\"掌握混合运算顺序（同整数），学会灵活处理一次通分与分步通分。\",\"difficulty\":3,\"question_types\":[\"口算\",\"应用题\"]},{\"name\":\"加法运算律在分数中的应用\",\"description\":\"将加法交换律、结合律迁移至分数范畴，进行简便计算。\",\"difficulty\":4,\"question_types\":[\"填空\",\"口算\"]}],\"examLessonId\":\"g5down-u6-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"同分母分数加、减法\",\"core_concept\":\"同分母分数相加减，因为它们的计数单位（分数单位）相同，所以可以直接进行计算。只要把分子相加减，作为结果的分子，而分母保持不变。计算结果如果不是最简分数，通常需要约分成最简分数。\",\"key_formula\":\"$$\\\\frac{a}{c} \\\\pm \\\\frac{b}{c} = \\\\frac{a \\\\pm b}{c}$ ($c \\\\neq 0$)\",\"common_mistakes\":[\"计算时将分子相加的同时也把分母相加，如 $\\\\frac{1}{4} + \\\\frac{1}{4} = \\\\frac{2}{8}$。\",\"计算结果忘记约分，没有化成最简分数。\"],\"tips\":\"牢记“分母不变，分子加减”，计算完后一定要看一看能不能约分。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/fc/fc8f8e273d7c6d85877e1b5b43c56ca4888a6448.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/72/72351511290c0dab95b450882d76193076a803ad.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/47/475c3843a9a2536b3241ad12a80916d8280a4575.edge-50f5a2c15076.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/f4/f4a94e648066cf55d6f6468abc7a4c48ff5792ff.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4c/4cf9f9c9939d3c11c8cbc4303a36894629634efd.edge-07f098063809.mp3\",\"https://api.clthuanxie.cn/cc-audio/4d/4dab97daa88fcb9098e74390bba2cc815069fd0e.mp3\"]}},{\"point\":\"异分母分数加、减法\",\"core_concept\":\"异分母分数的分母不同，意味着它们的分数单位不同。就像“3个苹果”和“2个梨”不能直接说成“5个苹果”一样，必须先通过通分，把它们转化成相同分母（即相同分数单位）的分数，然后再按照同分母分数的规则计算。\",\"key_formula\":\"$$\\\\frac{a}{b} \\\\pm \\\\frac{c}{d} = \\\\frac{ad \\\\pm bc}{bd}$\",\"common_mistakes\":[\"不通分直接把分子加分子，分母加分母。\",\"通分时只把分母扩大倍数，分子忘记对应扩大倍数。\"],\"tips\":\"找公分母时，通常找分母们的最小公倍数，这样计算量最小。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/eb/eb3987e0005a752c0483e3a5e384500e8c53446a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/63/632297399a570f760e5634c961d66d715b0290ba.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/15/1500fc7273c73c2a56d8d518b3f5711c603dd05e.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/4f/4f4188ab64fa6a3d235aa5e5dbbc2ca5880b87e8.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c3/c30088273ca3eaf15e89cde2b74637400383add2.mp3\",\"https://api.clthuanxie.cn/cc-audio/78/78186b8f9402ed289cb69a3ab94b5bd87431873d.mp3\"]}},{\"point\":\"分数加减混合运算\",\"core_concept\":\"分数加减混合运算的运算顺序和整数完全一致：如果没有括号，按照从左到右的顺序计算；如果有括号，要先算括号里面的。在计算过程中，可以分步通分，也可以一次性通分，根据数据特征选择最快的方法。\",\"key_formula\":\"算式中有括号，先算括号内；无括号，按从左至右顺序。\",\"common_mistakes\":[\"计算顺序出错，先算加法后算减法（在没括号的情况下）。\",\"一次性通分时，由于公分母太大容易算错分子。\"],\"tips\":\"观察数据，如果前两个分数已经是同分母，先算前两个会更方便。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/ef/ef4372c95c5aa674f128be6646bbb16f89ec78f8.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/9d/9d790b17a4e371386b36e9349169e6a0cb036f05.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/93/93895dcb702a5af85a2bbd8de7969b6b02b50d14.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/15/15f62fc71e2d0694b291d40dd891b7076ec8ba87.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6f/6f15d387928876f47e520f7760c095731563d8c0.mp3\",\"https://api.clthuanxie.cn/cc-audio/be/be266e69bfcbc063dba9ef5c25d7d046d8bdefe8.mp3\"]}},{\"point\":\"加法运算律在分数中的应用\",\"core_concept\":\"整数加法的交换律 $a+b=b+a$ 和结合律 $(a+b)+c=a+(b+c)$ 在分数运算中同样适用。利用这些定律，我们可以把同分母的分数或者能凑成整数的分数结合在一起优先计算，从而大大提高计算速度和准确率。\",\"key_formula\":\"$$a + b + c = (a + c) + b$ (当 $a$ 和 $c$ 是同分母时)\",\"common_mistakes\":[\"在使用减法性质去括号时忘了变号，如 $a-(b+c)$ 误写为 $a-b+c$。\",\"胡乱结合，没有观察到分数分母的特征就盲目套用定律。\"],\"tips\":\"计算前先“看、想、算”：看分母，想组合，最后再动笔。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/df/df5764dd27ebeff23bbdefae06b8c068e8b31df7.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/3f/3fbad1d527dd0989b817348f5604a7ae2c0f494a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/46/4626d6dd769975e40bad063370e4becff9beefb5.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/e4/e472732ccb1b7a66bfa3deb60ee6d2c33a00a54d.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d0/d028e3761187d1fa8337d4ad43f055c736a9ee0e.mp3\",\"https://api.clthuanxie.cn/cc-audio/c7/c76aade6d1ea6417a5a149a149a277f33308c408.mp3\"]}}]}]}]\n"])</script></body></html>
