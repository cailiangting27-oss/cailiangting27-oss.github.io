ber\":3,\"title\":\"测量\",\"knowledge_points\":[{\"name\":\"毫米、分米的认识与换算\",\"description\":\"建立毫米和分米的长度观念，掌握1分米=10厘米，1厘米=10毫米。\",\"difficulty\":2,\"question_types\":[\"填空\",\"测量\",\"选择\"]},{\"name\":\"千米的认识与路程估测\",\"description\":\"建立1千米的长度观念，掌握1千米=1000米，并能估测路程。\",\"difficulty\":2,\"question_types\":[\"填空\",\"应用题\",\"排序/比较\"]},{\"name\":\"吨的认识与质量单位换算\",\"description\":\"认识质量单位“吨”，掌握1吨=1000千克，解决大宗物品运输问题。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"应用题\"]}],\"examLessonId\":\"g3up-u3-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"毫米、分米的认识与换算\",\"core_concept\":\"当测量较短物体的长度或要求测量结果更精准时，常用毫米(mm)作单位。分米(dm)是比厘米大而比米小的长度单位。1分米等于10厘米，1厘米等于10毫米。通过手势（如拇指和食指叉开约1分米，硬币厚度约1毫米）建立量感。\",\"key_formula\":\"$$1dm = 10cm$, $1cm = 10mm$, $1dm = 100mm$\",\"common_mistakes\":[\"忽视分米和毫米之间的百倍关系，误记为10。\",\"在尺子上数刻度时，错把起点划线当成1毫米而非0刻度。\"],\"tips\":\"记住“大变小，乘进率；小变大，除以进率”。可以用手指代表单位，相邻手指间距是10。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/82/8259a19a67fa3addf34e6927f54a186389ee02d5.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/38/3824b15a5e236a44f0eb60f2cc79ae088813ece3.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/a7/a7b7986896d634a8e6c24cec90f3f213576c11e2.edge-c7afc42391fe.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/05/0587bee5c42deed90fb95f5c055e597c892e168d.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d3/d3cc7b8a5fc84a0ecf5f2d4d0fd59b0785e31678.mp3\",\"https://api.clthuanxie.cn/cc-audio/2d/2d5ca66a0cd6352d3de16a9c00e1755ffe4b230d.mp3\"]}},{\"point\":\"千米的认识与路程估测\",\"core_concept\":\"千米(km)也叫公里，是计量比较长的距离时使用的单位。1千米等于1000米。我们要学会在生活中估测距离，比如标准操场跑2圈半就是1000米，步行约15分钟也是1千米。\",\"key_formula\":\"$$1km = 1000m$\",\"common_mistakes\":[\"将千米和米之间的进率误认为10或100。\",\"估算路程时，单位选择不当（如把城市距离写成米）。\"],\"tips\":\"记住“3个0”法则，千米变米要在数字后面加3个0。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/92/92caf16b94929cdc0c53e4493027325665790252.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/e8/e833a8036577dbf35aa3a53be179a127fc6657a5.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/f3/f396081585f328b77e465d830147575230ff3575.edge-04df4313048e.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/5d/5d2ec11c65fc7b4e136dfc4ea251ebae3555cce4.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/7f/7feb33caeafaaae0f354046f5486b387de2f688c.mp3\",\"https://api.clthuanxie.cn/cc-audio/24/24d5c316af26f70dc74c93fa16613bcd54f19956.mp3\"]}},{\"point\":\"吨的认识与质量单位换算\",\"core_concept\":\"吨(t)是计量沉重或大宗物品质量的单位。1吨等于1000千克。40个体重25千克的小朋友大约就是1吨。在解决实际问题时，要先统一单位再计算，特别是在涉及载重和剩余问题时。\",\"key_formula\":\"$$1t = 1000kg$\",\"common_mistakes\":[\"字母单位拼写错误（如把吨写成g）。\",\"解决货车过桥或载重问题时，忘记加上汽车自身的重量。\"],\"tips\":\"吨是“很大”的单位，通常用来形容鲸鱼、大象、卡车载重或一年的粮食产量。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/31/31ff6faf7958e0ecca6b6a1fdf52d768500785d3.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/b2/b20800b88bf39a7ff2ba5d3a7a506fdf6c4fa93e.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/da/da61b726f10947f69e0076ffad86c4dd5db5070a.edge-80e383166f34.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/83/8348424c602dacbbbfeb3c241a85724036e7c57c.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/64/64400dd657b435e49277708e35980fbd7a42df07.mp3\",\"https://api.clthuanxie.cn/cc-audio/74/74a09908c12a05413619f04b572d733115a8aa0a.mp3\"]}}]}]}]\n"])</script></body></html>
