unt\":36,\"stage\":\"primary\"},\"unit\":{\"unit_number\":4,\"title\":\"分数的意义和性质\",\"knowledge_points\":[{\"name\":\"分数的产生、意义与单位“1”\",\"description\":\"理解分数产生的背景，掌握单位“1”和分数单位的概念。\",\"difficulty\":2,\"question_types\":[\"填空\",\"判断\",\"画图\"]},{\"name\":\"分数与除法的关系\",\"description\":\"掌握a÷b=a/b(b≠0)的关系，并利用其进行单位换算和解决比例问题。\",\"difficulty\":3,\"question_types\":[\"填空\",\"应用题\"]},{\"name\":\"真分数、假分数与带分数\",\"description\":\"理解各类分数的定义，掌握假分数化为整数或带分数的方法。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"排序/比较\"]},{\"name\":\"分数的基本性质\",\"description\":\"理解分子分母同时乘/除以相同数(0除外)大小不变，用于等值分数转化。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"判断\"]},{\"name\":\"约分与最大公因数\",\"description\":\"掌握公因数、互质数概念，能利用最大公因数进行约分化简为最简分数。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"填空\",\"连线/匹配\"]},{\"name\":\"通分与最小公倍数\",\"description\":\"理解公倍数意义，掌握通分方法以比较异分母分数的大小。\",\"difficulty\":3,\"question_types\":[\"排序/比较\",\"填空\",\"应用题\"]},{\"name\":\"分数和小数的互化\",\"description\":\"掌握小数化分数及分数化小数（除法取近似值）的相互转化技巧。\",\"difficulty\":3,\"question_types\":[\"填空\",\"选择\",\"排序/比较\"]}],\"examLessonId\":\"g5down-u4-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"分数的产生、意义与单位“1”\",\"core_concept\":\"分数源于测量的需要。一个物体、一些物体都可以看作一个整体，用自然数 1 来表示，通常把它叫做单位“1”。把单位“1”平均分成若干份，表示这样的一份或几份的数叫做分数。其中表示一份的数叫做分数单位。\",\"key_formula\":\"分数 = $\\\\frac{表示的份数}{平均分的总份数}$\",\"common_mistakes\":[\"忽视“平均分”这一前提条件直接写分数\",\"不理解单位“1”可以表示多个物体组成的整体（如一筐苹果）\"],\"tips\":\"确定单位“1”是解题关键，通常在“的”字前面或比字后面。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/d9/d9ba289e1274dfaf25186d5bc1a20026d96be30e.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/48/48a66762df20febd03d402210da8a4d7e8102e8b.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/61/616c5a96ff58de4b625a72a4efc69f6b298d50e3.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/89/89c4d66c414c0de9e9e78b345cb2e3d1e32b0888.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ed/ede61f1862d0072c6500849af6a1f51bd5e6b124.mp3\",\"https://api.clthuanxie.cn/cc-audio/bf/bf7e9a02c1cc2f5d69b6f03eecea2fe903b65de7.mp3\"]}},{\"point\":\"分数与除法的关系\",\"core_concept\":\"分数的分子相当于除法中的被除数，分母相当于除数，分数线相当于除号。这种关系可以表示为 $a \\\\div b = \\\\frac{a}{b}$（$b \\\\neq 0$）。要注意分数是一种数，而除法是一种运算。\",\"key_formula\":\"$$被除数 \\\\div 除数 = \\\\frac{被除数}{除数}$\",\"common_mistakes\":[\"颠倒被除数和除数的位置，例如 2 除以 5 写成 5/2\",\"忘记除数（分母）不能为 0\"],\"tips\":\"求“每份是多少”带单位，求“占全长的几分之几”不带单位。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/16/162d598d18be7358d44ea64043fce4d82758b4ec.edge-99e6c16a943d.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/58/5892fc5369b005b6e16707098d74f75839e4bde9.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/d0/d0a2ccd8814af80debb089f2c22564dc3a49edc7.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/0d/0d1d6ed3d0c3766ecf8ed22db61e6c74d8317d7c.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/06/06a6af739096188fa3e75f00b04ffc8144df6a0a.mp3\",\"https://api.clthuanxie.cn/cc-audio/f8/f88ce929d0238eae28ed56d2dcfc8ae4f6d28901.mp3\"]}},{\"point\":\"真分数、假分数与带分数\",\"core_concept\":\"分子比分母小的分数叫做真分数（小于 1）；分子比分母大或分子和分母相等的分数叫做假分数（大于或等于 1）。由整数和真分数合成的数叫做带分数。\",\"key_formula\":\"假分数 $\\\\rightarrow$ 带分数：分子 $\\\\div$ 分母，商为整数部分，余数为分子\",\"common_mistakes\":[\"认为假分数一定大于 1，忽略了等于 1 的情况\",\"将假分数化成带分数时，余数忘记写在分子位置\"],\"tips\":\"分子是分母倍数的假分数可以化成整数。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/88/883218f12dbdd3d13329849da67c2c99189d175f.edge-b30105581d09.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/4a/4a315b53414e3232dc231adda0c72b79a60748c3.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/84/84688684727fcf7d2f7d34ba2f083e6224ed9d8e.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/3b/3b5a8fe1b8e53d28f9a680f4d97d2b7742348852.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d1/d1cc3b24200931dab5c59e475dbc90091a63fc2f.mp3\",\"https://api.clthuanxie.cn/cc-audio/db/db0a660737336d2198f99c278b8881756b30d0b4.mp3\"]}},{\"point\":\"分数的基本性质\",\"core_concept\":\"分数的分子和分母同时乘或除以相同的数（0 除外），分数的大小不变。它是约分和通分的理论依据。\",\"key_formula\":\"$$\\\\frac{a}{b} = \\\\frac{a \\\\times c}{b \\\\times c} = \\\\frac{a \\\\div c}{b \\\\div c}$ ($c \\\\neq 0$)\",\"common_mistakes\":[\"分子加（减）一个数，分母也跟着加（减）相同的数\",\"同时乘或除以的数中包含了 0\"],\"tips\":\"记忆口诀：同乘同除不带零，大小不变理最明。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/24/244b5c74bae93abd2ca55b28c9fb7731cba30223.edge-91a7646f9fea.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/8f/8f72eb11350c33295238aa09984ea81e21cf95d8.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/60/60787ea0b791cdeea9d753fc375f351f96df80e2.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/5e/5e148e8af92ea5dad09dd73ccd9acd2f87a96638.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/22/229c95ddd2134cad2741ae84203c31fbdfff566c.mp3\",\"https://api.clthuanxie.cn/cc-audio/66/66e79d1d31841831581b5dc8f129be1f7beef3d6.mp3\"]}},{\"point\":\"约分与最大公因数\",\"core_concept\":\"两个数公有的因数叫公因数，其中最大的一个叫最大公因数。把一个分数化成和它相等，但分子分母都比较小的分数叫约分。分子分母互质的分数叫最简分数。\",\"key_formula\":\"约分：$\\\\frac{a}{b} = \\\\frac{a \\\\div 最大公因数}{b \\\\div 最大公因数}$\",\"common_mistakes\":[\"约分没约到最简分数就停止了\",\"找两个数最大公因数时漏掉最大的，只找了小的公因数\"],\"tips\":\"互质数的特征要记牢，如两个连续自然数（0除外）必定互质。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/2a/2afe1eb66c9acc673e5290a97291e60aee260e16.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/51/51be10c7b1a24e49a2d66fb2db28c364f75a4a8d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/82/82a233c59db7fda9c98229c482d03719af65ad5f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d8/d8f6ebf2b94fa96258aa9af4ebb7a458876d24d3.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/7c/7c6912a30951b209dbe0c419fb32d831f1e1835f.mp3\",\"https://api.clthuanxie.cn/cc-audio/25/2510b02baef7156797545bedac3f3cdc73eb2fb5.mp3\"]}},{\"point\":\"通分与最小公倍数\",\"core_concept\":\"两个数公有的倍数叫公倍数，其中最小的一个叫最小公倍数。把异分母分数分别化成和原来分数相等的同分母分数，叫做通分。通常取分母的最小公倍数作为公分母。\",\"key_formula\":\"通分：找分母的最小公倍数 $\\\\rightarrow$ 利用基本性质转化\",\"common_mistakes\":[\"通分时只把分母变了，分子忘了根据扩大倍数进行计算\",\"求最小公倍数时与最大公因数的计算方法弄混\"],\"tips\":\"通分主要用于比较大小和异分母分数加减法。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/80/8057181a193d92a6488e893295b8b18bfecdad72.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/79/791408409b7bc85e3861a044be4a1d451e169bdc.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/2c/2caf8ba5d54df6b726cc78a2197b4085d884796d.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/3b/3ba15671e3ed0f9ca2260e9ec8621a438b50c8e7.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4e/4e6a13f81382b87cee2e0d8374fa2372fe6282a3.mp3\",\"https://api.clthuanxie.cn/cc-audio/92/92d5aaf59fba5bef824ef687e75079fb0cd1d898.mp3\"]}},{\"point\":\"分数和小数的互化\",\"core_concept\":\"小数化分数：原来有几位小数，就在 1 后面写几个 0 作分母。分数化小数：利用分数与除法的关系，用分子除以分母，除不尽的按要求保留位数。\",\"key_formula\":\"$$\\\\frac{a}{b} = a \\\\div b$\",\"common_mistakes\":[\"分数化小数时分子分母位置颠倒\",\"小数化分数后没有约分成最简分数\"],\"tips\":\"熟记常用分数如 1/2=0.5, 1/4=0.25, 1/8=0.125 等可以提高计算速度。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/23/2379ef9e7a1d539fa534e5a1a8520f44ed1a0244.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/4f/4f29c265d3b1c56315dacbdca6d47e6c6a70855d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/52/522a91b3d6de4f314642ffaa8575c103ed453197.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/44/44197c8f641a75ac7c3fa7caf5187647dfbb28c0.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/9c/9c243dddefa61a95cb53b742c6c1f90e2642c2f5.mp3\",\"https://api.clthuanxie.cn/cc-audio/5a/5ae49b20dbb78fab9ffa2280a84c27ecd39390ac.mp3\"]}}]}]}]\n"])</script></body></html>
