_types\":[\"简答题\",\"阅读理解\"]},{\"name\":\"形声字的构字规律\",\"description\":\"理解虫字旁、鱼字旁等偏旁与字义的关系，掌握分类识字的方法。\",\"difficulty\":1,\"question_types\":[\"连线/匹配\",\"填空\"]}],\"examLessonId\":\"chinese-g3up-u6-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"围绕中心意思写作\",\"core_concept\":\"这是小学中年级习作的核心。要求一段话或一篇文章必须由一个明确的中心句导出。中心句通常位于句首，起到总领全文的作用。后续的内容必须紧紧围绕这个“中心”展开，通过颜色、形状、声音、动作等多个细节，将中心意思（如：美丽、整洁、富饶）写具体、写生动。\",\"key_formula\":\"中心句（总）+ 细节描写A + 细节描写B + 细节描写C（分）\",\"common_mistakes\":[\"所选素材脱离中心句，如写操场热闹却写在教室学习\",\"中心句概括不准确或缺失\"],\"tips\":\"写作前先想好一个最核心的形容词，然后围绕这个词从不同角度举例子。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/15/15042c6acc43e478e813c4b8c371452ccc955d7a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/3c/3c2cb8d5b60bd23aa3da99955fce0dbd122b227a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/3e/3ee769eaf47c2ee5bf673061d9d5d82418e50df5.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/00/006e790dab2591efd929c9ed6a1f7ffd213f01b0.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6a/6a52df7533aec444c7ed131a5f6a0bb7c50500b6.mp3\",\"https://api.clthuanxie.cn/cc-audio/75/7537f04ea821adcd62e6e44743b9d39ab39acdbd.mp3\"]}},{\"point\":\"古诗名句的画面还原\",\"core_concept\":\"学习古诗不仅仅是背诵，更重要的是通过诗中的关键字眼展开想象，在脑海中形成画面。例如通过“乱”、“穿”、“惊”等动词感受海边的澎湃，通过“翠”、“青”等颜色感受江南的润泽。通过翻译和扩词，将凝练的诗句转化为细腻的现代景物描写。\",\"key_formula\":\"关键词提取 + 联想色彩/动作 + 场景扩充描述\",\"common_mistakes\":[\"只翻译字面意思，缺乏联想想象\",\"对诗中的多义字理解错误，如“相宜”理解为“方便”\"],\"tips\":\"可以闭上眼睛，试着像看电影一样在脑海里给诗句画面“上色”。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/55/558fb8bdd5e85c73d1fd2e985f630372fe28bdf7.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/77/77cd359c1dd0ed0f66ba626068601b92187bec4d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/38/387d42f73e5fc6972e1cd05aa7a28abcfbc330e7.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/18/181f63ed88a534146fc37ceacb9f6c14d444fbd8.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/b4/b4b7d82d04c972d46c172d1831163b3a625574df.mp3\",\"https://api.clthuanxie.cn/cc-audio/96/96605149b6e0a4fd8a972d7acb96688b4b4503ff.mp3\"]}},{\"point\":\"形声字的构字规律\",\"core_concept\":\"形声字由形旁和声旁组成。形旁代表汉字的意义范畴，声旁代表汉字的读音。掌握了这一规律，可以帮助学生在阅读时“见词知意”，通过偏旁快速判断字的意思。例如，“虫”字旁的往往是昆虫或节肢动物，“鱼”字旁的多是水生动物。\",\"key_formula\":\"形旁（表义）+ 声旁（表音）= 形声字\",\"common_mistakes\":[\"将偏旁与实际生物分类混淆，如认为虫字旁的都是昆虫\",\"忽视声旁对读音的提示作用\"],\"tips\":\"编一个偏旁分类小口诀，如：‘虫’字边虫子多，‘鱼’字边游水间。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/55/55763be086887cccc5cbb06093dbd4ba2d51481d.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/32/32b679a1d2ac094408a7c4dda336cfb6b4d248f5.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c3/c3a357e1b6a07e237a9e80dce9306af303e58411.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/35/359922b8cbd0fab1747ad7317ce3aad698fe91a2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/09/09bbaa20cb97f2f74b52d79b91a8d035ad54188f.mp3\",\"https://api.clthuanxie.cn/cc-audio/33/33fba421d481a3ef676c1cccada0aa50a8ae80ee.mp3\"]}}]}]}]\n"])</script></body></html>
