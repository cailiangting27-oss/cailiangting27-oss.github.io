方厘米、平方分米、平方米，建立具体单位的大小观念。\",\"difficulty\":1,\"question_types\":[\"填空\",\"选择\"]},{\"name\":\"长方形与正方形面积公式\",\"description\":\"理解并熟练运用‘长×宽’和‘边长×边长’计算图形面积。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"计算题\",\"填空\"]},{\"name\":\"面积单位间的进率与换算\",\"description\":\"掌握相邻两个积累单位间的进率是100（1平方米=100平方分米=10000平方厘米）。\",\"difficulty\":2,\"question_types\":[\"排序/比较\",\"填空\"]},{\"name\":\"面积与周长的对比应用\",\"description\":\"区分长度单位与面积单位，解决剪拼图形中关于周长和面积变化的综合问题。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"画图\",\"判断\"]}],\"examLessonId\":\"g3down-u5-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"面积的含义与比较\",\"core_concept\":\"面积是指物体表面或封闭平面图形的大小。比较面积大小常用观察法、重叠法和度量法。度量时需要使用统一的形状（如正方形）作为单位进行铺摆计数。\",\"key_formula\":\"物体的表面或封闭图形的大小就是面积。\",\"common_mistakes\":[\"混淆面积和周长的概念，认为围成图形线条越长面积就越大\",\"在比较面积时没有采用统一规格的测量小格\"],\"tips\":\"可以通过‘摸一摸’和‘涂一涂’来感知，面积是整块色块的大小，周长仅仅是边沿线条。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8d/8d2c526c321c156794a0479e8bea8c304bebc309.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/5f/5fc7e002bb1b22fc05a9d93732ffacf0f73bce22.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/75/758577f90a194592628256cb140ebb0d76af7624.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/65/652f28e9f5c9a28d2ff2806bc8931cfdd622c118.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/f3/f30c4b4c672869c56af7168fac818a600f82e7ca.mp3\",\"https://api.clthuanxie.cn/cc-audio/3f/3fcf587a3e6cacea177966648c5bab5f331e8583.mp3\"]}},{\"point\":\"认识面积单位\",\"core_concept\":\"为了准确计量面积，需要统一面积单位。常用的有：平方厘米（cm²，边长1cm的正方形）、平方分米（dm²，边长1dm的正方形）、平方米（m²，边长1m的正方形）。\",\"key_formula\":\"1 平方厘米 $\\\\approx$ 指甲盖；1 平方分米 $\\\\approx$ 手掌；1 平方米 $\\\\approx$ 展开后的餐桌面积。\",\"common_mistakes\":[\"忘记带‘平方’二字，把面积单位写成长途单位（米、厘米）\",\"单位感知错误，如给教室地面选‘平方分米’\"],\"tips\":\"寻找身边的参照物记忆：大拇指指甲约1平方厘米，成人手掌约1平方分米。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/b6/b6c64d730d1fba3cdfe0f287ad994f0eb5723d90.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ed/edc8486cffa5109bd158c60a963ef1f04e69282a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/a5/a5bf6522590dd86a904cd8a045dfd7bff125b0de.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/c2/c205513ac76b50a65ad5eb44744b022b5704d324.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/3e/3e3b49d58247038930258ab72f515ea56bd68756.mp3\",\"https://api.clthuanxie.cn/cc-audio/7a/7af003bbddf274b326737e26b6733976c54e6682.mp3\"]}},{\"point\":\"长方形与正方形面积公式\",\"core_concept\":\"面积计算的本质是数出包含多少个单位面积。长方形包含的个数恰好是每行个数（长）乘以行数（宽）。正方形是特殊的长方形，边长相等。\",\"key_formula\":\"$$S = a \\\\times b$（长 $\\\\times$ 宽）；$S = a \\\\times a$（边长 $\\\\times$ 边长）\",\"common_mistakes\":[\"计算时长宽单位不统一就直接相乘\",\"错误地将长方形面积记为（长+宽）× 2（那是周长公式）\"],\"tips\":\"做题时先画图并标注数据，核对单位后再代入公式计算。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/2c/2c228f65f364117fd38e106043556828a7de7372.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ce/ce53434077545ca0616b7598138c731daff4c413.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/5a/5a3117bd3bf416a5c79a2e12a4dbc2404320e0b0.edge-fcc7ec7ce9d1.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/7c/7c5bcf281a1089475343b92d77a1ffbe204ae11f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/00/00cc4d6005bf7d1e24418f755f52d3d5f298f6b7.mp3\",\"https://api.clthuanxie.cn/cc-audio/05/05a44c4ca120affa807ffba84040741f9f15a2f0.mp3\"]}},{\"point\":\"面积单位间的进率与换算\",\"core_concept\":\"相邻两个面积单位之间的进率是100。1平方米可划分为10*10个1平方分米，1平方分米可划分为10*10个1平方厘米。\",\"key_formula\":\"$$1 m^2 = 100 dm^2$, $1 dm^2 = 100 cm^2$\",\"common_mistakes\":[\"受长度单位影响，错记进率为 10\",\"在大单位化小单位时错用除法\"],\"tips\":\"口诀：大变小，加两零；小变大，去两零（针对相邻单位）。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/bf/bf0ee93d97780b5fa68b5809854f34a50790648f.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/38/38c5dafcab57b66208fe41fd8582f075091cc837.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/d1/d1f75e710b7fd52e0bd97fa07bac2ae34f6e75be.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/95/953bd88b666cc56d81d1488b62a54a794cac57f1.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/66/66cb7a273108a4fe2df2acc55579c69ad9e58db7.mp3\",\"https://api.clthuanxie.cn/cc-audio/a9/a9f555d414f7b6554a22b0ffbd757f68217e850a.mp3\"]}},{\"point\":\"面积与周长的对比应用\",\"core_concept\":\"周长是线性长度，面积是平面铺满。当周长相等时，越接近正方形的图形面积越大；当面积相等时，长方形的长宽差异越大周长越长。\",\"key_formula\":\"周长 $C = (a+b) \\\\times 2$；面积 $S = a \\\\times b$\",\"common_mistakes\":[\"混淆两者的计算方法（加法与乘法混用）\",\"分不清两个量在图形剪切或拼合中的变化情况\"],\"tips\":\"列表对比区分：周长要‘围’、用线围；面积要‘铺’、用纸盖。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/6d/6db307403db4ba37584b6cef20d1549d39a4ecc9.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/84/84bb9d6e56e2fa72e52da33c11227307d9da8d9d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/69/69bf53ab36660ca532aec62ad30588471913bf98.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/55/5565f9537bae7a42a9fac52a10bd43d8e6d13ae2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/9d/9d39913406204eec620b277c3527bfcb0e14c9a1.mp3\",\"https://api.clthuanxie.cn/cc-audio/22/2271d39859735210dfa2375b35e1d3228410be65.mp3\"]}}]}]}]\n"])</script></body></html>
