{\"name\":\"地质化石与地理变迁的科普认知\",\"description\":\"通过岩石中的雨痕、矿物理解“陆海变换”的科学过程。\",\"difficulty\":3,\"question_types\":[\"判断\",\"应用题\"]}],\"examLessonId\":\"chinese-g2down-u6-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"天然指南针的科学原理辨析\",\"core_concept\":\"课文介绍了大自然中四种天然的指南针：太阳（中午正南）、北极星（夜晚指北）、大树（枝叶稠南稀北）和积雪（沟渠中化得快的是北面，化得慢的是南面）。这些原理在野外探险中非常实用。\",\"key_formula\":\"观察光影位置，对应地理南北方向。\",\"common_mistakes\":[\"容易混淆沟渠积雪消融速度所代表的方向\",\"把北极星记成在南方\"],\"tips\":\"可以通过口诀记忆：太阳中午在南边，北极星永远指南方（纠正为北方），树叶稠的面儿是南方。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/b9/b97060e5934cf842637d7d2ff698b5eb940f0fef.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/c7/c7f80e7d2535248e969515aec0b2cb7f3a9cb713.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/9e/9e6a3ac123b4eee729a3074128018ec4004d5505.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/8f/8f7d64063afdb1b66ab27bf8ae8d72d398e2d733.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/92/925af90671eb4efe94b1423f5a1cfa18bee1ae01.mp3\",\"https://api.clthuanxie.cn/cc-audio/17/17e5d6046ec622d343fb0a402d301e827174ce8e.mp3\"]}},{\"point\":\"太空生活失重现象的因果推论\",\"core_concept\":\"在太空中，由于远离地球产生失重状态，导致一切物体都会飘浮。这使得宇航员吃饭、喝水、睡觉和走路都需要特殊的方式，如用吸管、钻睡袋、穿特制鞋子等，防止到处飘动。\",\"key_formula\":\"失重导致飘浮，固定产生稳定。\",\"common_mistakes\":[\"将失重的原因误解为缺少空气\",\"认为在太空走路和地面一样\"],\"tips\":\"想象自己是一颗在水里没沉底的气球，所以一切都需要“抓手”。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/cf/cf4936092459c0741125dc510101ee0ab91bed0f.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/19/19786d450a1c3f2ce43e96580cbcea577bacef6d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c7/c780c233d0eebb2ec43df975d763aa2d984fb0a6.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/c5/c5366c11480f3e335a1374464c60dcf1d47d69bf.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/79/79ab0b616ef503a96277dd09fff9ce4fb884a8b0.mp3\",\"https://api.clthuanxie.cn/cc-audio/98/98daff376c68fd185f93b64d68ad3d1e90a0ab7f.mp3\"]}},{\"point\":\"地质化石与地理变迁的科普认知\",\"core_concept\":\"岩石是大自然的“百科全书”。通过观察其中的化石（如鱼印记、树叶印记）以及雨痕、波痕，可以推断出现在的陆地在很久以前可能是海洋或丛林。这种现象被称为“地壳运动”。\",\"key_formula\":\"岩石化石遗迹 = 环境历史缩影。\",\"common_mistakes\":[\"不理解鱼化石为什么会出现在高山上\",\"分不清什么是“印记”和“实物”\"],\"tips\":\"把岩石想象成一本厚厚的日记，上面的花纹就是大自然写下的文字。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/e2/e2dc1cf885ded37786e8ec25eb0d37842f8051fd.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/45/45f317bd74062566394d7ea42f92d84fdf520bfe.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c0/c0bff6677122dc0eaf6b8f4c947123a6ac5cd1e3.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/2e/2e36706ebc5b4767f4f762a269dc14a62304c933.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d3/d3ad8580f638359af2035be649c47a1f7f8ba36c.mp3\",\"https://api.clthuanxie.cn/cc-audio/e1/e139235431a7072f2c30f5a14e28cc696e561297.mp3\"]}}]}]}]\n"])</script></body></html>
