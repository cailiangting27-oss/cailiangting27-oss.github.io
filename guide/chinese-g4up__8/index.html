on\":\"学习题目提示法、起因经过结果法、分段归纳法等不同策略概括文章大意。\",\"difficulty\":4,\"question_types\":[\"选择\",\"排序/比较\",\"应用题\"]},{\"name\":\"书信的基本格式\",\"description\":\"掌握称呼、问候语、正文、祝福语、署名及日期六部分的规范写法。\",\"difficulty\":2,\"question_types\":[\"填空\",\"操作题\"]},{\"name\":\"人物外貌描写词汇辨析\",\"description\":\"积累并区分眉清目秀、文质彬彬、相貌堂堂、威风凛凛等赞美性与形态性词语。\",\"difficulty\":1,\"question_types\":[\"填空\",\"连线/匹配\"]}],\"examLessonId\":\"chinese-g4up-u8-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"文言文疏通与智慧领悟\",\"core_concept\":\"本单元通过《王戎不取道旁李》，学习文言文的基本翻译技巧。核心在于掌握古今异义词（如“走”在古文中指“跑”）和代词“之”的指代对象。通过王戎观察树在路边而多果实推断果子必苦的逻辑，学习他在日常生活中勤于思考、不随大流、善于观察和冷静分析的优良品质。\",\"key_formula\":\"注释辅助+情境联想=读懂古文意图\",\"common_mistakes\":[\"误认为‘竞走’是现代运动中的竞走项目\",\"分不清‘之’到底是指代王戎还是李子\"],\"tips\":\"朗读时注意停顿，如‘树/在道边/而多子’，并想象王戎站在路边的神态。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/61/6197316f6f902d5d205cb6050da17da8c14e5e77.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/d9/d91d573a8028e324fabec01e195a266694b1bf31.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/74/7489a0984493f9f9cd5463306a92dbb838a54a77.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/75/7538059a24a0812a110461b5a5f4bc7296f235bb.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/b0/b05fcfa3e3241d8f8ad613ee1a402689c6afaec1.mp3\",\"https://api.clthuanxie.cn/cc-audio/41/4111f5f56bd25ac6d7f48f3ec6c212cb53a47931.mp3\"]}},{\"point\":\"把握文章主要内容的方法\",\"core_concept\":\"掌握“六要素法”（起因、经过、结果）来概括记叙文。对于历史故事，可以先理清人物关系，再通过关键动词串联情节。长文章可以采用“意义段合并法”，即先给文章分段并总结段意，再将各段大意合并成简洁的句子。\",\"key_formula\":\"主要人物+核心事件+最终结果=文章大意\",\"common_mistakes\":[\"概括时过于啰嗦，变成了‘复述’所有细节\",\"遗漏故事的关键起因，导致读者不理解结局\"],\"tips\":\"试着用一两句话告诉别人‘谁发生了什么事，最后一共怎么样’。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/c7/c7cb9eb6bfce3f24ddb1d980ec78e42f5e4c0c62.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/f3/f38554c492153e5daf4a08a6492f0689351d992d.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ce/ce11cb1082c2d587dcefa9735b9f4d135ae4916e.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/e9/e979ca7113fcbe368b53df206c7206d8d6ed7c10.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ea/eae80d5f5f501b4080015365e52e3f54c488cd0d.mp3\",\"https://api.clthuanxie.cn/cc-audio/38/38994ad605fd6876fe34ac2e33e4ae07de419281.mp3\"]}},{\"point\":\"书信的基本格式\",\"core_concept\":\"书信由称呼、问候语、正文、祝福语、署名、日期六部分组成。称呼顶格写，加冒号；问候语另起一行空两格；正文分段写；祝福语分两行写（‘祝你’空两格，‘万事如意’等顶格）；署名和日期写在右下方，署名在上，日期在下。\",\"key_formula\":\"顶格称呼加冒号，落款右下名接时\",\"common_mistakes\":[\"把署名和日期写反了位置\",\"在称呼后面漏写了冒号\"],\"tips\":\"可以记一个口诀：头顶称呼冒号跟，问候祝福不能省，名字日期右下沉。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/48/48ee7166d67566a4aaafb2af1c67e149c096c363.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/89/895e396dbe964c5c97eae421dc158dbfaafab8b8.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/bc/bc91965293a2d13783807c8921fa364f83c2bc5c.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/76/7647fd0e73f269870d4ef9a169ea379af3728741.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/90/90148c56505529274af8940d532dc716f9b2ed5b.mp3\",\"https://api.clthuanxie.cn/cc-audio/9b/9bcf6a431a088d61117bc7d7c402ffecc241a6dc.mp3\"]}},{\"point\":\"人物外貌描写词汇辨析\",\"core_concept\":\"积累描写人物外貌和气质的四字成语。学生需要根据职业、年龄、性格精准使用词汇。如‘威风凛凛’多用于将领兵士，‘文质彬彬’用于书生学者，‘相貌堂堂’用于形容仪表不凡的男子。通过刻画外表，能更好地衬托人物的内心世界。\",\"key_formula\":\"身份地位+外貌特征=精准用词\",\"common_mistakes\":[\"把形容女生的词语（如眉清目秀）误用到粗犷的将军身上\",\"将神态描写（目不转睛）与外貌描写词语混淆\"],\"tips\":\"在脑海中为每个成语匹配一张明星或书本人物的‘脸’进行关联记忆。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a9/a915053dc6a1451f713bfe738c775d7f435ec31e.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/53/532d62ec471db69f438fc77af907190c88892363.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c0/c054861fab41f33d18d9d7f06017f9ffc7a615c8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/1c/1c73e6c6e1af57c39dda1923a247f88f3b9d7f07.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/7b/7b5394614a518cc2da14b6cdbbb979
