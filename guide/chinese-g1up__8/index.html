me\":\"口语交际：场景音量控制\",\"description\":\"能在不同环境下（如教室、图书馆）自主调节说话音量大小。\",\"difficulty\":3,\"question_types\":[\"判断\",\"应用题\"]}],\"examLessonId\":\"chinese-g1up-u8-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"汉字结构分类与辨析\",\"core_concept\":\"汉字由部件组成，按照部件位置不同可分为左右结构（如：林、好）、上下结构（如：全、爸）、半包围结构（如：还、同）、全包围结构（如：回、国）以及独体字（如：人口）。一年级学生需初步建立空间感，学会观察字在田字格中的占位。\",\"key_formula\":\"看笔画分布，定间架结构。\",\"common_mistakes\":[\"将“尖、尘”误认为左右结构\",\"全包围结构的字（如“国”）封口时间掌握不对\"],\"tips\":\"书写时，掌握“左窄右宽”或“上小下大”的比例原则，有助于把字写美观。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/c9/c90387408cb75621d39ca5df70f3ced063c6c18f.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/8e/8e74828398b1b22d3bd871ed8fe9cc698acb8384.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/a3/a353f336bd97a245e575dbc0aed036c42b727d8f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/56/56d82bcf6514b73c298d38c649fb448eddcc4e5a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/3f/3f298b013dc020805452c37f901733c0344e7ac9.mp3\",\"https://api.clthuanxie.cn/cc-audio/10/10355db2c07bd0cb30911d167e47b5912cf423a9.mp3\"]}},{\"point\":\"常用偏旁与部首对应规律\",\"core_concept\":\"汉字大多是形声字，偏旁（部首）往往提示了字的意思范畴。如草字头（艹）多与植物相关，三点水（氵）多与水相关，单人旁（亻）多与人相关，足字旁（⻊）多与脚部动作相关。这有助于归类识字和理解字义。\",\"key_formula\":\"形旁表义，声旁表音。\",\"common_mistakes\":[\"混淆三点水（氵）和两点水（冫）\",\"分辨不清提手旁（扌）和木字旁（木）的动作特征\"],\"tips\":\"看到不认识的字，观察左边偏旁，往往能猜出这个字大概讲的是什么内容。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/85/85b1da0ccf0ab16dccd6ea54d5d8268c471e8c51.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/42/426c4aab748af76301d319517cea08a432e96782.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/94/94900b00799899e93999f5c8e50a5b72de47b063.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/a5/a50dc7deb92bb948d945d6e4d1958fc10966d064.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/73/737fbd1c3e8982bf04e6a918b2251482a1620236.mp3\",\"https://api.clthuanxie.cn/cc-audio/c8/c887e7e2182cfce93374b88d772557d13dc69713.mp3\"]}},{\"point\":\"口语交际：场景音量控制\",\"core_concept\":\"良好的口语交际不仅是说话，更包含礼仪。学生应当理解在不同生活场景中需要调节音量：在图书馆、医院、办公室、电影院应使用“转头音”（极小声）或保持沉默；在操场、升旗仪式时可以大声；在日常互动中采用适中音量。\",\"key_formula\":\"看场合，分大小，保持安静懂礼貌。\",\"common_mistakes\":[\"在图书馆由于兴奋大声喊叫他人\",\"分不清“小声说话”和“不说话”的区别\"],\"tips\":\"可以总结顺口溜：人多公共处，轻声不吵闹；课堂发言时，响亮也要到。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8c/8cf6be38bb8795ba810a25f1e4bc5de126908c1f.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/66/66dace46c8d024a60d13506f4a2fc07fdc061571.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/d4/d4d5396501be47e8d39e617b793fbd620cda220f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/c0/c0121ca2e6365b9e6ae3264a2cba374fe5606664.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/52/52b2dd20727abd56a0a997407ecced768137053e.mp3\",\"https://api.clthuanxie.cn/cc-audio/99/99c13db5909a2bba7bcf2081ea2635be28365401.mp3\"]}}]}]}]\n"])</script></body></html>
