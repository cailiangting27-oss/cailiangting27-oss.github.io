义与比值\",\"description\":\"理解比是两个数相除的关系，掌握比的前项、后项及比值的求法。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"规律探索\"]},{\"name\":\"比的基本性质与化简\",\"description\":\"运用比的前项和后项同时乘或除以相同的数（0除外）性质化简为最简单的整数比。\",\"difficulty\":3,\"question_types\":[\"化简比\",\"选择\",\"填空\"]},{\"name\":\"按比例分配问题\",\"description\":\"将总量按给定的比进行分配，通过总份数求出各部分的实际数值。\",\"difficulty\":3,\"question_types\":[\"应用题\",\"填空\"]}],\"examLessonId\":\"g6up-u4-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"比的意义与比值\",\"core_concept\":\"两个数相除又叫做两个数的比。比号前面的数叫前项，后面的叫后项。前项除以后项所得的商叫做比值。例如 $3:2 = 3 \\\\div 2 = 1.5$。\",\"key_formula\":\"$$a:b = a \\\\div b = \\\\frac{a}{b}$ ($b \\ne 0$)\",\"common_mistakes\":[\"将比的后项写为0（比的后项相当于除数，不能为0）\",\"将比值与比的化简混淆（比值是一个数，可以是整数、分数、小数；而比必须带比号）\"],\"tips\":\"记忆口诀：比的前项像分子，比的后项像分母，比值就是那个值。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/cd/cda209b58db02c10365f8ce97c75bf63d69e2ba5.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/c5/c56bd767008ea643e070ccb71b5bf4ce16b33db2.edge-4344f6f3c067.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/91/9154ee816420268c988fd280adbd27d4348a4ef5.edge-e4cec0cb494e.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/48/48846b36fd9b66aeed105bccf3e1f92599517f57.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/42/426d0c0e641ccdab4e9a69accfdca4d2d5418c87.mp3\",\"https://api.clthuanxie.cn/cc-audio/51/5174fe9fa4d63f5571e61bb655c16b6fb96d473a.mp3\"]}},{\"point\":\"比的基本性质与化简\",\"core_concept\":\"比的前项和后项同时乘或除以相同的数（0除外），比值不变。化简比就是把一个比变成最简单的整数比（前项和后项互质的整数）。\",\"key_formula\":\"$$a:b = (a \\\\times n):(b \\\\times n) = (a \\\\div n):(b \\\\div n)$ ($n \\ne 0$)\",\"common_mistakes\":[\"化简时只在前项乘，后项忘记乘\",\"化简结果写成一个孤立的数字（结果必须保留比的形式，如 2:1）\"],\"tips\":\"遇到分数比，先通分去分母；遇到小数比，先扩位变整数，再求最大公因数约分。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/6a/6a0e194c9e9883332a95e6c5654c7b499304bac9.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/75/75c0a1e1a615f59f9e917812f6f2e108fac5f2e6.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/78/78b39477a62d35da710da0fe5731745f09e8c533.edge-bbf020ba5718.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/70/70251654780766a1f6a01c48c87fd08f466c9985.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/a9/a9823e8c9a612c14aebc4e82271e5e6955b0bed6.mp3\",\"https://api.clthuanxie.cn/cc-audio/53/539e0878c26af2b52f675b85c4eaa37d4b8ee5df.mp3\"]}},{\"point\":\"按比例分配问题\",\"core_concept\":\"在工业生产和日常生活中，常常需要把一个数量按照一定的比来进行分配。通常做法是先算出总份数，再求出各部分占总量的几分之几，最后计算实际值。\",\"key_formula\":\"某部分量 = 总量 $\\\\times \\\\frac{该部分份数}{总份数}$\",\"common_mistakes\":[\"计算各部分占比时，分母没有用各份数之和\",\"围篱笆或求面积题中，误将周长直接按比分配（应先求长与宽的和）\"],\"tips\":\"做题三部曲：求总份数、求分率、求部分量。最后别忘了把各部分加起来看看是不是等于总量。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a4/a4c6a5b2acaf0936dbd0726469763b52ef624de1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/cc/ccf6375937473366ae4984805ae535c9803ce594.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c3/c351d43b532dde86430c93d5b0f65452aefdb108.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/7d/7d1d701775e85fa99d9bf5d71b031fcf5820535e.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/7d/7dad9d2e1933016c14b5c3bb16acb3bff2dae054.mp3\",\"https://api.clthuanxie.cn/cc-audio/b0/b06dec1d2f9c70eba956e83f1eb1650b57e1370e.mp3\"]}}]}]}]\n"])</script></body></html>
