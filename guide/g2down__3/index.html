]},{\"name\":\"旋转现象的辨析\",\"description\":\"认识物体绕固定点或轴做圆周运动的现象，如钟表指针、风扇转动等。\",\"difficulty\":2,\"question_types\":[\"选择\",\"判断\",\"连线/匹配\"]}],\"examLessonId\":\"g2down-u3-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"轴对称图形的认识\",\"core_concept\":\"如果一个图形沿着一条直线对折，两侧的部分能够完全重合，这个图形就叫轴对称图形。折痕所在的直线叫对称轴。识别轴对称图形的关键是“找对折能重合”，例如蝴蝶、爱心、汉字“田”等都是典型的轴对称图形。\",\"key_formula\":\"对折后两侧完全重合 = 轴对称图形\",\"common_mistakes\":[\"认为只要能分成两半就是对称，忽略了必须“完全重合”。\",\"找不到对称轴的确切位置或数量，例如认为圆只有一条对称轴。\"],\"tips\":\"可以通过剪纸试验来理解：先将纸对折再剪出一半，展开后的图形一定是轴对称图形。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/43/4350f19bf9f8002a7bf3355f388ec0c6445ee546.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/7f/7fada82f6dec71de8dd9ab2f1f0cfbf4d02e3a49.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/51/514c622bcbb6399f20a4d08436fbb4e2e1c6d285.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d4/d49ef903d82a7be33bf49007e219f3e66a99291e.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/1e/1e8bbeaea5dfbffc7537c144188b47e2f9d2c250.mp3\",\"https://api.clthuanxie.cn/cc-audio/21/21610d1971932b6e051e15a58b90e55228d4e160.mp3\"]}},{\"point\":\"平移现象的辨析\",\"core_concept\":\"物体在平坦地移动，且不改变自己的方向、形状和大小，这种运动叫平移。平移是沿着直线进行的，可以上下移、左右移或斜着移。生活中常见的平移有：推拉抽屉、电梯升降、滑滑梯等。\",\"key_formula\":\"沿直线运动 + 形状方向不变 = 平移\",\"common_mistakes\":[\"误把车轮滚动（旋转+直线位移）纯粹当成平移。\",\"认为平移会改变图形的指向，例如箭头向右平移后变成向下。\"],\"tips\":\"记住平移就像在轨道上滑动的火车，车头指向哪里，平移后依然指向哪里。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/80/8097cad4171732a9c990f6829116515b4516257e.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/3d/3dae053e14b4ea1ee206c6991ce7c03d417b6fe1.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/21/21ed0aebae035de2ca0e616239dd1452bfe2809f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d2/d2fde70951c6a787d6629bff4d2e76786c1f630a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/11/11aff685fb1ecc4af357181b990629524757104d.mp3\",\"https://api.clthuanxie.cn/cc-audio/d5/d53259427b5917cb2f36dfb1dd05e8f009520847.mp3\"]}},{\"point\":\"旋转现象的辨析\",\"core_concept\":\"物体绕着一个固定的点或轴做圆周运动，这种现象叫旋转。旋转时，物体的大小和形状虽然不变，但它的指向（方向）会随着转动而发生改变。生活中常见的旋转有：风扇转动、钟表指针挪动、开锁等。\",\"key_formula\":\"绕中心点运动 + 改变指向 = 旋转\",\"common_mistakes\":[\"分不清旋转中心，认为只要在动就是平移。\",\"将钟表指针的摆动误认为平移。\"],\"tips\":\"寻找有没有那个“不动的中心点”。如果有东西绕着那个点在转圈，那就是旋转。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/15/15683cce6d6581dea899632fbbca789e9df0781e.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/82/829e50162c72da09b9b36b4c6294945f0a499290.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/0a/0ad81648cd73ca1c5969865b94047863c73fc750.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/a6/a66eac1130d95c4ccac1ddb8ffc9aa46a883292a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/a3/a3da5563e08c6296ada4da5cc641e594be2e7d5e.mp3\",\"https://api.clthuanxie.cn/cc-audio/ae/ae2084496438ed91ba994dbd6c999984187acafd.mp3\"]}}]}]}]\n"])</script></body></html>
