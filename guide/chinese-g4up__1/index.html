、夸张等修辞手法描写声音和样子，如闷雷滚动、山崩地裂等感官体验。\",\"difficulty\":3,\"question_types\":[\"填空\",\"选择\",\"应用题\"]},{\"name\":\"边读边想象画面\",\"description\":\"通过文字联想生活经验，在脑海中转化色彩、声音、气味等具体可感的意象。\",\"difficulty\":3,\"question_types\":[\"应用题\",\"填空\"]},{\"name\":\"声音词语的分类与积累\",\"description\":\"掌握人声鼎沸、窃窃私语、鸦雀无声等描写不同音量和环境的词语。\",\"difficulty\":1,\"question_types\":[\"连线/匹配\",\"填空\"]}],\"examLessonId\":\"chinese-g4up-u1-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"按时间顺序描写景物\",\"core_concept\":\"在记叙自然奇观或游覽活动中，通常采用由早到晚、由浅入深的逻辑。例如《观潮》一文，作者抓住了潮水到来过程中声音和景象的不同特点，通过“潮来前、潮来时、倒潮去后”三个时间节点，使读者如临其境。\",\"key_formula\":\"使用固定的时间关联词作为段落开端的衔接，如“午后一点”、“瞬间”、“很久”。\",\"common_mistakes\":[\"时间跨度跳跃太大，没有过渡。\",\"在潮来时的段落里插入了潮后的描写，逻辑混乱。\"],\"tips\":\"写作前先列出时间轴，标注每个时刻最有特点的声音或景物。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a0/a0d41ea40901a357d0300bb6afdfd9c607fbe3ee.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/a0/a03eea882adaa7cdfe7e177cf1491fc75dd8280a.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/46/468717c8c30fa57fef7b16bb48c15c1d858f5ccd.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/6b/6b6802f6e3fbc5b4e956ee7823e54c741bcfb0cd.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4b/4b4d0e2151fbad3937cea744c8da337aef1b5aab.mp3\",\"https://api.clthuanxie.cn/cc-audio/8a/8a4b63ab12242ad7f71fadea66e584dbc5e5abd6.mp3\"]}},{\"point\":\"动态描写与修辞赏析\",\"core_concept\":\"动态描写能赋予死板的文字灵动的生命。通过比喻（将浪潮比作战马）、拟人（钱塘江横卧）等修辞方式，将抽象的力度和规模具象化。这种方法能让学生理解文字背后的“力量感”。\",\"key_formula\":\"画面感 = 具体名词 + 形容词/动词 + 恰当的修辞。\",\"common_mistakes\":[\"形容词使用单调，只会写“很大”、“很响”。\",\"比喻不恰当，如将壮观的浪潮比作微小的物体。\"],\"tips\":\"多背诵积累优美的比喻句，模仿其结构进行口头训练。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/e6/e606d5ba50f0b687ca595490a466492755344479.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/56/56eec7f1d26f885d2c395e3b96c871562d7914e6.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/46/46604bf2d9ed51262ad343e5338ce85979c244f1.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/37/3707b3466ab71f4edd2bcc0e7cd0bb02b945085d.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c8/c8e1c85d9913f29e7494788f0ee730af3b116fa5.mp3\",\"https://api.clthuanxie.cn/cc-audio/d3/d35c11d0c4b324121c727dd1dd0724dbb6e81765.mp3\"]}},{\"point\":\"边读边想象画面\",\"core_concept\":\"这是阅读写景类文章最核心的策略。要求学生在朗读时，不仅看到汉字，还要在大脑中完成“数字化建模”。不仅有视觉的颜色（白浪），还有听觉的高低（隆隆声），甚至有气味（泥土芬芳）。\",\"key_formula\":\"视觉 + 听觉 + 嗅觉 + 想象 = 完整的画面。\",\"common_mistakes\":[\"只识字不入心，读完后无法描述文字描述的景象。\",\"想象太随意，脱离了文本提供的关键词。\"],\"tips\":\"闭上眼睛听老师朗读，尝试用自己的话描绘出脑海中出现的颜色和声音。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/6a/6a6857e299269dd0dfc21555f47092a9cef27326.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/31/316b68c3277993ae250d69942a8c6159d5569d6b.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/2d/2dfc237c446dee834a97870f280848c72258954c.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/27/27fad3b955efb3201b5bf7ddee33840137f62a7f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c2/c24c1d9409503cceef8f3b12e9775a72c910bf26.mp3\",\"https://api.clthuanxie.cn/cc-audio/52/522d7e4aedacded61239192968e6ef1c4fe3a8ff.mp3\"]}},{\"point\":\"声音词语的分类与积累\",\"core_concept\":\"描写声音时，词语的选择决定了文章的韵律感。本单元积累了从“鸦雀无声”到“震耳欲聋”这种音量跨度极大的词语，分清人声（人声鼎沸）和大自然声（风号浪吼）的区别。\",\"key_formula\":\"识记四字成语中蕴含的声音动态感，区分褒义和贬义用法。\",\"common_mistakes\":[\"混淆词意，如在描写静寂时用了“人声鼎沸”。\",\"书写笔画错误，尤其是“鼎”、“震”等生字。\"],\"tips\":\"采用对比法记忆，如将“窃窃私语”与“响彻云霄”配套对比记忆。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/2f/2fdba3ff0c0e9075ef04e023eea5cf792d187114.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/1d/1d58d6789c71ac5a6a6681c3a3d294c560619e94.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/81/81e2d50bc96a9457693d8496037505fc72dca8e4.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/00/0025f23dbd6c079ba77b14a6242875b6b384caf2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4f/4f1a99551779815bfcaccecabb3d7a7f7f660f48.mp3\",\"https://api.clthuanxie.cn/cc-audio/59/5960b99a7bf57f60b581e8487e7b973b042b299a.mp3\"]}}]}]}]\n"])</script></body></html>
