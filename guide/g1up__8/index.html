{\"href\":\"/book/g1up/\",\"className\":\"btn-chunky-primary mt-6 px-8\",\"children\":\"返回教材\"}]]}],\"children\":[\"$\",\"$L20\",null,{\"book\":{\"id\":\"g1up\",\"grade\":1,\"semester\":\"up\",\"subject\":\"math\",\"gradeName\":\"一年级\",\"semesterName\":\"上册\",\"subjectName\":\"数学\",\"textbookName\":\"一年级上册\",\"fullName\":\"人教版小学数学一年级上册\",\"publisher\":\"renjiao\",\"publisherName\":\"人教版\",\"unitsCount\":9,\"lessonsCount\":32,\"stage\":\"primary\"},\"unit\":{\"unit_number\":8,\"title\":\"20以内的进位加法\",\"knowledge_points\":[{\"name\":\"凑十法的算法与应用\",\"description\":\"能运用“拆小数凑大数”的方法高效计算进位加法。\",\"difficulty\":3,\"question_types\":[\"口算\",\"填空\",\"操作题\"]},{\"name\":\"9、8、7、6加几的计算\",\"description\":\"熟练掌握各基数的进位加法算理，并体会算法多样化。\",\"difficulty\":3,\"question_types\":[\"口算\",\"填空\"]},{\"name\":\"5、4、3、2加几（交换法）\",\"description\":\"通过交换加数位置，利用已学的进位加法规律进行计算。\",\"difficulty\":3,\"question_types\":[\"口算\",\"排序/比较\"]}],\"examLessonId\":\"g1up-u8-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"凑十法的算法与应用\",\"core_concept\":\"凑十法是将两个加数中的一个拆开，使得其中一部分与另一个加数合并后正好等于10，再用10加上剩下的部分。这种方法通过转化，把复杂的进位加法变成了简单的10加几，极大地提高了计算速度和准确率。\",\"key_formula\":\"$$\\text{大数} + \\text{小数} = \\text{大数} + (\\text{10的补数} + \\text{剩余数}) = 10 + \\text{剩余数}$\",\"common_mistakes\":[\"拆数错误：例如算 $9+5$ 时，把 $5$ 拆成了 $2$ 和 $3$，导致无法凑成 $10$。\",\"忘记最后一步：只算出了 $9+1=10$，忘记了还要加剩下的数。\"],\"tips\":\"‘看大数，分小数，凑成十，加剩数’。一定要熟练掌握‘凑十歌’，如‘9要1，8要2，7要3，6要4’。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/5d/5d689382a14e9f31ae4e71b05f8619428e583017.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/84/845a7be76c8d4ecf9831e2764b5761ea696abed5.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ea/eac93c15d6bfd1997cfd8c667eb365b882bb2bab.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/07/074254486fcf13ae795e3986547d62204f85274f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/5b/5bac0914850c8fd443ddece6626eb914a44af497.mp3\",\"https://api.clthuanxie.cn/cc-audio/fb/fb72c753ac66c304868285ca8f73cced6470800e.mp3\"]}},{\"point\":\"9、8、7、6加几的计算\",\"core_concept\":\"这部分是20以内进位加法的核心。根据加数的大小，灵活运用凑十法。当9、8、7、6作为大加数时，分别通过拆分另一个加数找它们的‘补数’（1、2、3、4）来凑十。\",\"key_formula\":\"$$9+2=11, 8+3=11, 7+4=11, 6+5=11$\",\"common_mistakes\":[\"计算结果偏差1：如 $8+5$ 算成 $12$（少加了一）。\",\"相同加数相加混淆：如把 $6+6$ 结果算成 $11$。\"],\"tips\":\"熟记基础题组，例如看到 $9$ 就要想到‘退一进十’，即和的个位比加数少 $1$。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/9e/9eb9baba5a05b8cba78a0d5ae6f912536eac304a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/37/37d7e4cefe75ab9d47896700d5cd238661f2dce3.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/2c/2c8c5263e011d6eba2ecc65fb7709083edae8277.edge-da3e52301118.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/64/6480ac81df746e6e1576a75449be8fbd50809065.edge-f8b575d0fa30.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4e/4e1851dabc9086bf00363d22f1ec661b1b104cd1.edge-3a8306c3e837.mp3\",\"https://api.clthuanxie.cn/cc-audio/74/7451ef041b122e09649c758842f65ac25ac1b2f0.edge-e19158242137.mp3\"]}},{\"point\":\"5、4、3、2加几（交换法）\",\"core_concept\":\"当较小的数（如5、4、3、2）在前，较大的数在后时，可以利用加法交换律，将题目转化为我们熟练的大数加小数（如9、8、7、6加几）。这种‘移位思考’能减少记忆负担。\",\"key_formula\":\"$$a + b = b + a$\",\"common_mistakes\":[\"不愿交换硬算：从小往大数数，容易出错且速度慢。\",\"理解偏差：认为 $3+8$ 和 $8+3$ 代表的情境必须完全不同而不敢转换。\"],\"tips\":\"‘小数加大数，交换位置变大数加小数’。看到 $3+9$，马上想 $9+3=12$。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f8/f8a3a6bd35589bff56cc4d921a10afce7af864af.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/29/297dbb7eea717f5f3ab4479de0da05ce68ec5a66.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/48/487eee80f7216495b56a2d164f6ed0173819e3d1.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ca/ca70b763c09e6da1eeafa326205e40ba2536c50b.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/80/80beb6c4b400d30262eb8ec2b8915a8d35ce6f49.mp3\",\"https://api.clthuanxie.cn/cc-audio/1d/1d69a6b0db1080f833184e7e0cf8fac6b0e7d6e3.mp3\"]}}]}]}]\n"])</script></body></html>
