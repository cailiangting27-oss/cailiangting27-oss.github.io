三边’，并能据此判断给定的三条线段能否围成三角形。\",\"difficulty\":3,\"question_types\":[\"选择\",\"操作题\",\"填空\"]},{\"name\":\"三角形的分类\",\"description\":\"按角分类（锐角、直角、钝角）及按边分类（等腰、等边），掌握各特殊三角形的特征。\",\"difficulty\":2,\"question_types\":[\"连线/匹配\",\"填空\",\"选择\"]},{\"name\":\"三角形的内角和\",\"description\":\"掌握三角形内角和为180度，并能计算未知角的度数。\",\"difficulty\":3,\"question_types\":[\"填空\",\"计算题\",\"判断\"]},{\"name\":\"多边形的内角和探索\",\"description\":\"运用转化思想，通过分割三角形的方法求四边形及多边形的内角和。\",\"difficulty\":4,\"question_types\":[\"填空\",\"规律探索\"]}],\"examLessonId\":\"g4down-u5-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"三角形的定义、高与稳定性\",\"core_concept\":\"由三条线段围成（每相邻两条线段的端点相连）的图形叫做三角形。三角形具有稳定性。从三角形的一个顶点到它的对边作一条垂线，顶点和垂足之间的线段叫做三角形的高。\",\"key_formula\":\"三角形具有稳定性，不可变性。\",\"common_mistakes\":[\"画高时没有使用虚线或忘记标垂直符号。\",\"误认为三角形的高只有一条。\"],\"tips\":\"画高要用三角尺的直角边，一条贴着底，另一条对准顶点。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/dc/dc3b3b1f50e93cfdd6da3cab925f5081c1d14f8b.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/e2/e2c004310a88213b0465b7f5294bf7d0a25b3eff.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/89/89f5ff576f82414928da633f1ac0a4b990136c0f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/68/6884dfc7b1a8ee4a4b9e9d89f29e78dc5ab871af.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/8f/8ff7e491ed1506c19913ee01ff01d3feb931e22c.mp3\",\"https://api.clthuanxie.cn/cc-audio/13/13e76390ea55e1fb8fe17beb83d2b2a2e035c79c.mp3\"]}},{\"point\":\"三角形三边关系定理\",\"core_concept\":\"三角形任意两边的和大于第三边。利用这个定理可以判断三条线段能否组成三角形，也可以求第三边的范围（大于两边之差，小于两边之和）。\",\"key_formula\":\"$$a + b \u003e c, a + c \u003e b, b + c \u003e a$\",\"common_mistakes\":[\"只检查一组边，不注意‘任意’两字。\",\"遇到等腰三角形周长问题时，忽略三边关系判断是否成立。\"],\"tips\":\"快捷方法：找出较短的两条边，只要它们的和大于最长的那条边即可围成。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/21/21eb7129e2a716cc31e2a73f8684afece4cc2968.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ca/ca8db84818b0aab750b82564e3cbb1cbb973036b.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/9f/9fbba78258cb04f1b190b8116b9e6b3527e9ebdf.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/19/190930a6423cbb24b7f17504e001f55dd5db4321.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/22/224dfccfd1d8b554363ace3c3c7f0149a0ac570d.mp3\",\"https://api.clthuanxie.cn/cc-audio/4f/4fe33dff2cc3bea9e52d69b3485aa503b2d004f1.mp3\"]}},{\"point\":\"三角形的分类\",\"core_concept\":\"按角分：锐角三角形（3个锐角）、直角三角形（1个直角）、钝角三角形（1个钝角）。按边分：不等边三角形、等腰三角形（两腰相等）、等边三角形（三边相等，即正三角形）。\",\"key_formula\":\"等边三角形 \\\\subset 等腰三角形\",\"common_mistakes\":[\"认为等腰三角形不可能是直角三角形。\",\"把等边三角形和等腰三角形的概念混淆。\"],\"tips\":\"记住等边三角形是“三好学生”，三条边相等，三个角也相等（都是60度）。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8a/8a87a9de2e281a2b23de10ec30dd51293e3eb526.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/a8/a8237d90957e977ac7a52f79579900151344a972.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/fb/fb728daa425c214246928979ff64fb5303653dd8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/e3/e37a5acc4f75305b7d6b06cc585e36631d7485a7.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/31/319caad5fa91388e7806039aa8b2730c698ee041.mp3\",\"https://api.clthuanxie.cn/cc-audio/85/856d8a9460e6760f8cbe6ab431f2f9bb05337b13.mp3\"]}},{\"point\":\"三角形的内角和\",\"core_concept\":\"任意一个三角形的三个内角之和都是180度。利用这个结论可以计算三角形中未知角的度数。\",\"key_formula\":\"三角形内角和 = 180^\\\\circ\",\"common_mistakes\":[\"认为大的三角形内角和大，小的三角形内角和小。\",\"等腰三角形计算角度时，忘记有两个底角相等。\"],\"tips\":\"等腰三角形求角：已知顶角求底角用 $(180 - 顶角) \\\\div 2$；已知底角求顶角用 $180 - 底角 \\\\times 2$。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/35/35bafdcddd6125c88685ab3cfb07c09df54c53d1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/74/749faf4246e5d94e7733dcacaac77f7b902f0764.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/35/35c1f914224242b8ce7940cab1bb0ce26a55fad9.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/9c/9c49a2bce98d84eaafb891eae684d3aa5f61c452.edge-a9ce13fb42de.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/fd/fdc0df0c277b502ea68873ac4a87ae891dac6fa5.mp3\",\"https://api.clthuanxie.cn/cc-audio/8c/8c82aefdc2de7f720e518710ec488f362871fc76.mp3\"]}},{\"point\":\"多边形的内角和探索\",\"core_concept\":\"通过从多边形的一个顶点引出对角线，可以将多边形分割成若干个三角形。多边形内角和等于（边数-2）个三角形内角和的总和。\",\"key_formula\":\"n 边形内角和 = (n - 2) \\\\times 180^\\\\circ\",\"common_mistakes\":[\"公式记错，误记为 $(n-1) \\\\times 180$。\",\"计算较大度数时发生进位或乘法错误。\"],\"tips\":\"记住转化的思想，把不认识的多边形拆成认识的三角形。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/fb/fb99c0e184d1d11002461c6f1bb46ecc03793b69.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/e1/e11b7e5e323d4e2b66404462dc7faa5d59eaeaa0.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/8f/8f760d6bcd93c4ef22055d92e76ec1e97b5e612b.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/af/af9a5d172d85f02bd09255b003bdfa329810e125.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/e8/e83720e049d5a01d0d853d8d038f14b9ff0fc2aa.mp3\",\"https://api.clthuanxie.cn/cc-audio/4e/4e87087cbf6599a889d64e2a901a5899a6168c53.mp3\"]}}]}]}]\n"])</script></body></html>
