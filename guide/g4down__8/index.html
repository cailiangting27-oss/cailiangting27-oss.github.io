"应用题\"]},{\"name\":\"根据统计图进行决策预测\",\"description\":\"根据统计图的变化趋势提取信息，分析并解决简单的实际推断问题。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"选择\"]}],\"examLessonId\":\"g4down-u8-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"平均数的求法与意义\",\"core_concept\":\"平均数是一个统计学概念，通过将一组数据的总和除以数据的个数得到。它能够反映出一组数据的集中趋势和整体水平，但并不代表这组数据中的每一个具体数值。平均数极其敏感，任何一个数据的变化都会引起平均数的变化。\",\"key_formula\":\"平均数 = 总数量 \\\\div 总份数\",\"common_mistakes\":[\"误以为平均数就是这组数中间的那个数。\",\"计算总数时漏加某个数据，或者除以份数时数错个数。\"],\"tips\":\"计算完平均数后，记得检查平均数是否介于这组数的最大值和最小值之间，如果超出这个范围，计算一定有误。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f7/f76e8b4fb7eb13efe48468778db8d203ec11c632.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/04/040e777a8f4c0bcf47e1862c3a386905a6e16053.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/6e/6eced229bcf78f6e3ba54ee266adf33bff229983.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/22/22cefea6b70ad6e02fb4183e8f108302aa8f157b.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/53/5300bd50cb2deeffd65ae062374d87c2485af6c8.mp3\",\"https://api.clthuanxie.cn/cc-audio/ab/ab706dda0b6868edc2583aa7c36c75c562f7d65c.mp3\"]}},{\"point\":\"复式条形统计图的绘制与分析\",\"core_concept\":\"复式条形统计图是在一个统计图中用两种（或多种）颜色或底纹的直条来表示两组（或多组）相关联的数据。它的特点是能更清楚地表示多组数据之间的对比关系。绘制时必须包含图例，且同一类别的直条间距和宽度应保持一致。\",\"key_formula\":\"复式直条 + 图例 = 对比分析\",\"common_mistakes\":[\"忘记在图中画出图例，导致别人看不懂不同颜色代表什么。\",\"不同类别的直条宽度不统一，导致视觉上的大小误导。\"],\"tips\":\"先确定1格代表多少数量，画图时要对齐刻度，并用不同标记区分各组。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/51/513480abec180a592d8b41ae08024406a4de7618.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/d0/d0caa4527fe764ef716652a19974e5a16a993388.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/10/10c2c8100d91a6588f19d20568294bc0c1838a85.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/94/942988977040046063917df44072adc1b2510677.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/54/540575940b20ad762b45dbaae63f389556ea08b3.mp3\",\"https://api.clthuanxie.cn/cc-audio/f5/f5d0df8260266ffd4f3cd7799bbc9f421b6a3d95.mp3\"]}},{\"point\":\"根据统计图进行决策预测\",\"core_concept\":\"统计的最终目的是为了通过数据发现规律。通过观察统计图中直条的高低起伏趋势（如上升、下降或平稳），我们可以推断未来的可能变化。这在商业、气象调查和学校成绩分析中非常有用。\",\"key_formula\":\"趋势分析 → 科学预测\",\"common_mistakes\":[\"预测时说话太绝对，使用“一定”而不是“可能”。\",\"脱离实际生活背景，只看数字不看具体情境。\"],\"tips\":\"观察最高和最低的数据，分析它们出现的原因，能帮你做出更准确的判断。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/7e/7e032441687587567073e9e29b98dd4a7c1fb032.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/27/27e5780ea57747ecfc0bc742d179195c507e6f1f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/af/af667a71658e30fd88568ed30c7051b4e3fb774b.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/48/483a3e66d52149d456c06ddebf075327da709296.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/aa/aaa0e06bf28b2622591f49f611b579b16c59172c.mp3\",\"https://api.clthuanxie.cn/cc-audio/11/11fe10f4bf37fe6dd5ef76920d8b56746375777b.mp3\"]}}]}]}]\n"])</script></body></html>
