ame\":\"人教版小学数学三年级上册\",\"publisher\":\"renjiao\",\"publisherName\":\"人教版\",\"unitsCount\":10,\"lessonsCount\":32,\"stage\":\"primary\"},\"unit\":{\"unit_number\":6,\"title\":\"多位数乘一位数\",\"knowledge_points\":[{\"name\":\"口算乘法与算理转化\",\"description\":\"掌握整十、整百数乘一位数的口算，将大数乘法转化为表内乘法。\",\"difficulty\":2,\"question_types\":[\"口算\",\"填空\"]},{\"name\":\"笔算乘法（一般进位与连续进位）\",\"description\":\"掌握多位数乘一位数的竖式书写，理解从个位乘起的顺序及进位规则。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"应用题\"]},{\"name\":\"乘数中间或末尾有0的乘法\",\"description\":\"掌握含0乘法的特殊处理：中间有0需相乘，末尾有0可先移位计算。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"比较/排序\"]},{\"name\":\"乘法估算与归一问题解决\",\"description\":\"掌握多步计算应用题，尤其是“先求一份是多少”的归一逻辑。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"选择\"]}],\"examLessonId\":\"g3up-u6-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"口算乘法与算理转化\",\"core_concept\":\"口算整十、整百数乘一位数时，可以将因数看作几个十、几个百。例如 $40 \\times 3$ 就是 4 个十乘 3 等于 12 个十，即 120。本质是利用乘法分配律将大数拆解回表内乘法。\",\"key_formula\":\"$$a00 \\times b = (a \\times b)00$\",\"common_mistakes\":[\"计算时少写末尾的0，如 $500 \\times 3 = 1500$ 错写成 150\",\"口算表内乘法不熟练，如 $60 \\times 7$ 算成 480\"],\"tips\":\"先用盖住“0”的方法计算表内乘法，算出积后，看因数末尾有几个0，就在积的末尾添上几个0。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/61/61d1a3dd15b5e681840bb9fff837e28baddd20af.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/c6/c64802b013d6c6574426eed6ea7f1b1692bb6f38.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/77/772b784ac6860d6b61d3d4f1bb57482a7ff083ff.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/05/05fae45728637bf662cef5182b624f2aaa897294.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/33/338fceb22ae4d8fcd46e7199bfbad8607746fdf5.mp3\",\"https://api.clthuanxie.cn/cc-audio/5a/5a35e2a05abedb9047006b87313649912579d2b7.mp3\"]}},{\"point\":\"笔算乘法（一般进位与连续进位）\",\"core_concept\":\"笔算多位数乘一位数时，相同数位对齐，从个位乘起。用一位数依次去乘多位数每一个数位上的数。哪一位上乘得的积满几十，就要向前一位进几。\",\"key_formula\":\"积 = 因数 \\times 因数（从个位乘起，满十进一）\",\"common_mistakes\":[\"忘记加进位上的数，导致结果偏小\",\"错将进位数与下一位相乘，而不是相加\"],\"tips\":\"进位的数字要写小一点，写在对应数位的左下角，计算完下一位后立刻把它加进去。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/9d/9d135b27b72994b13a5df7483ef43f75129dd742.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/6e/6ee13154aaebaf62c8b10e8f40b3998585868d29.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/0c/0c9e5ec72795e3c2f930afe577fe6c08cca1a93f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ca/cab824c4dd092509a3d6ccd3288f699ae783c0c4.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c3/c3965a413da477cba810cc0756fc0244763c56c3.mp3\",\"https://api.clthuanxie.cn/cc-audio/4e/4e28803792b3673eb024d32ecd1eb5b495ed659a.mp3\"]}},{\"point\":\"乘数中间或末尾有0的乘法\",\"core_concept\":\"0乘任何数都得0。中间有0的乘法，如果个位不进位，十位积就是0；如果进位则积是进位数。末尾有0可以先算0前面的数，再补0。\",\"key_formula\":\"$$0 \\times n = 0$ 或 $n \\times 0 = 0$\",\"common_mistakes\":[\"看到因数中间有0，漏算这一位，直接跳过\",\"把 $0 \\times 5$ 算成了 5\"],\"tips\":\"即使某位是0也要按顺序相乘，并注意是否有低位传上来的进位。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/b8/b8d27abafc9e3aa15bd19ab86fd1f28b78291019.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/01/0136e85ccf262477477f35b5a9d6d963d69005ae.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/60/60a71d5b490a65195b645fbfdb804d067d301822.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ff/ff08d63612c4238e5edaf45c8bfe5cbcca5ceacc.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6f/6f4ca8ca14591737c67cbde6ffc13d0f162bca54.mp3\",\"https://api.clthuanxie.cn/cc-audio/7a/7a8bf2fa9efd0766d3721b5153161ddbd85cd96a.mp3\"]}},{\"point\":\"乘法估算与归一问题解决\",\"core_concept\":\"遇到“大约”字样时需估算，将多位数看作最接近的整十、整百数。解决“归一问题”时，关键是先通过除法求出单一量（一份是多少），再根据要求进行乘法计算。\",\"key_formula\":\"总数 \\text{  } / \\text{  } 数量 = 单一份数\",\"common_mistakes\":[\"估算时找不对近似数，误差过大\",\"两步计算题找不准中间量，运算顺序错误\"],\"tips\":\"先读题确定是“求总数”还是“求每份数”，画简单的线段图可以帮助理清思路。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/b3/b3170ea9f5cb1be6dbcd2b8b3cd543ff226c3f91.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/69/69e8b038e3da33da1cf235a7ed4d75f3bf557360.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/82/82ee81f3c2cf3fa86751f43c485a143c6059d8f6.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/6d/6d1a30951f06ae2975042c045f7a2e99a0cfc702.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ea/eac7d55f583271a2685802cd4b48bb976558ecfa.mp3\",\"https://api.clthuanxie.cn/cc-audio/6e/6e8e0ff85157f63d403b1d09c3bcbec845ea83c1.mp3\"]}}]}]}]\n"])</script></body></html>
