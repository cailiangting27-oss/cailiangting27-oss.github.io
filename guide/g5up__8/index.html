":3,\"question_types\":[\"填空\",\"画图\",\"计算题\"]},{\"name\":\"数代合一与方程建模总复习\",\"description\":\"综合运用字母表示数、解方程及列方程解决各类复杂数量关系。\",\"difficulty\":5,\"question_types\":[\"应用题\",\"填空\"]}],\"examLessonId\":\"g5up-u8-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"小数乘除法综合应用\",\"core_concept\":\"小数乘法先按整数乘法算，再看因数中共几位小数，从积的右边起数出几位点上小数点。小数除法要把除数转化成整数，被除数同步移动小数点。计算中注意进一法和去尾法在实际生活中的应用。\",\"key_formula\":\"$$因数小数位数之和 = 积的小数位数$\",\"common_mistakes\":[\"点小数点时数错位数，尤其是在末尾有0的情况下\",\"小数除法中商的小数点没有和被除数移动后的位置对齐\"],\"tips\":\"计算后可以用估算验证结果的合理性，比如 0.9 乘一个数积一定变小。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/c6/c6b2452338ea8a55898b87028bb22725325f77f8.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/77/77411b4433c7133fbf851113f51faa974cbff19f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/52/52c2e961a9cd128673b5c033acebbf36d08cec7f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/25/25c741956246a17d56e4bbf8ef61bb71e406c826.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/dd/dd0da8b3481d5e6ec2f8f86c5aa0fc7bcbe23460.mp3\",\"https://api.clthuanxie.cn/cc-audio/d0/d03286ad79a5a4f4152e12263eeea4766b667a8c.mp3\"]}},{\"point\":\"多边形面积与几何公式复习\",\"core_concept\":\"利用转化的思想，将平行四边形剪拼成长方形，将三角形、梯形拼成平行四边形。所有这些多边形的面积最终都与底和高有关，三角形和梯形的面积公式里千万不要忘记除以 2。\",\"key_formula\":\"$$S_{三角} = ah \\times 0.5, S_{梯} = (a+b)h \\times 0.5$\",\"common_mistakes\":[\"计算三角形或梯形面积时漏掉“除以 2”\",\"高与底不对应，随便找两个数相乘\"],\"tips\":\"记住等底等高的三角形面积是平行四边形的一半，这能帮助你快速判断面积关系。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/c1/c105599c6595bd5f389a88d5d47419c5a0331832.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/4f/4fbdcaa1e7dc87bc3602b6c292d1837b834b8d14.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/3c/3c433fb23f9bac14eea7283936f7f2f7a1eae1b2.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/bc/bc89a95c4539a2480e834a4ff033b372d772afe0.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/46/46ba49a375a9880d7847ec768fa6d54a51cae721.mp3\",\"https://api.clthuanxie.cn/cc-audio/eb/ebd2e153799da5e3bc78c790f4c427bb3406afa0.mp3\"]}},{\"point\":\"数代合一与方程建模总复习\",\"core_concept\":\"字母可以表示任意数。方程是含有未知数的等式。解方程的本质是利用等式的性质（两边同时加减乘除相同的数，0除外，等式仍然成立）。在解决实际问题时，要先找等量关系再列方程。\",\"key_formula\":\"$$ax ± b = c$ 或 $a(x ± b) = c$\",\"common_mistakes\":[\"解方程时不写“解”字或不注意上下对齐等号\",\"列方程解决实际问题时，找错等量关系导致列式错误\"],\"tips\":\"解完方程一定要把结果代入原方程验算，这是得满分的法宝。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f3/f30efe6102c5a47ec2c84411dc287f087e14ebdd.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/77/77a816f8f4c9038432216074d862fb9f24c7dc2f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ea/eafa3cadf87c91059b4d3d1c2e08cab8e7b32fbc.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/7a/7aa7bc02ccac3fb1850ceb8a0d5deb17f5da7ea4.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6b/6b5f455e7a6a8c1f26d52abe2cf921f3a9ba5e94.mp3\",\"https://api.clthuanxie.cn/cc-audio/b0/b00a0a9380fe219c85f7f5555110f9d19bc1e83c.mp3\"]}}]}]}]\n"])</script></body></html>
