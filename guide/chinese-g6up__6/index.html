写作题\"]},{\"name\":\"古诗词中的自然意境\",\"description\":\"赏析《浪淘沙》、《江南春》中的动静结合及人与自然和谐的意境。\",\"difficulty\":3,\"question_types\":[\"默写\",\"赏析题\"]}],\"examLessonId\":\"chinese-g6up-u6-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"关键句的提取与观点把握\",\"core_concept\":\"阅读写景或说明性文章时，要重点关注文章的开头、结尾以及段落的起首句。这些地方往往隐藏着作者的观点或全篇的中心。通过合并各部分的中心意思，就能准确把握作者想要传达的核心价值。在《只有一个地球》中，结论正是在层层论述后在文末点明。\",\"key_formula\":\"找中心句 = 首句（总起）+ 尾句（总结）+ 过渡句（承上启下）\",\"common_mistakes\":[\"将文中的生动描写误认为是核心观点。\",\"提取关键句时只摘录一半，导致意思不完整。\"],\"tips\":\"朗读时遇到作者发出的感叹或号召，通常就是关键句所在。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8d/8dbf9a470c6aed4716e1eb6e1e2f44d9a792e874.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/0c/0cb78da16d2886a2d75350f32d854c1109cd89f7.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/cd/cd036443298c8204c3c43932d65d75271199e98f.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/eb/eb80dd08fe62b99821363d2471f2d010110fe27d.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/eb/eb5907e835fe7092158c0c5f74e58d9e8b144519.mp3\",\"https://api.clthuanxie.cn/cc-audio/97/9726d9d6562e49ef7c967328d1178ecc77327b6a.mp3\"]}},{\"point\":\"倡议书的格式与写作\",\"core_concept\":\"倡议书是为倡导某项举措而写的应用文。其格式严谨：标题居中；称呼顶格；正文另起一行空两格，需写清倡议背景、具体措施；结尾常用号召性语句；最后在右下角分两行写出署名和日期。\",\"key_formula\":\"倡议书 = 标题 + 称呼 + 背景建议 + 号召结语 + 署名日期\",\"common_mistakes\":[\"署名和日期的位置写反，或者未右对齐。\",\"称呼后面漏掉冒号。\"],\"tips\":\"记口诀：标题中间站，称呼顶格看，正文空两格，署名日期右下方。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/00/00fa526a7cace81e8cc92dff30a291d02fc7f5e8.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/45/45f8993face8ffb47282c2a4f94239314a63a989.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/0f/0f8585125d1a18b2a3464be2503b58fa6ca6def4.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/2d/2db0f85f2e3497745a565fc0f7986783cf5651df.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/8a/8adfe3d552687c0e41d925aa12dff5c80681ed05.mp3\",\"https://api.clthuanxie.cn/cc-audio/cf/cf5408edb80bf663e6a45e358d2c4567b8a7ad1a.mp3\"]}},{\"point\":\"古诗词中的自然意境\",\"core_concept\":\"通过品味诗中的动词（如“绕”、“送”、“排”）来感受古人的拟人化表达。本单元古诗多采用动静结合的手法，如《江南春》中流动的风、飞莺与静止的寺庙。理解诗人的情感，要从景物色彩中体会其对自然的热爱。\",\"key_formula\":\"悟意境 = 辨景物（意象） + 品动词（拟人/夸张） + 联情感\",\"common_mistakes\":[\"对诗中虚指数字（如四百八十、九曲）进行生硬的字面理解。\",\"混淆不同诗人的写作风格和地域特色。\"],\"tips\":\"脑海中把古诗词转变为一幅彩色画卷，能更好理解其意境。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/2e/2e430ef08d2cd58b6a435d3e59d9b2d91f786e7c.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/68/68964f17f20dad643a3662212eac231c863bf088.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/2a/2a9024423e300dcb178d2894e04f7e2f1b8754a5.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d9/d9ca9019a199950d312d071db7f8886990ba63f2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d4/d4d934853b73abae9fc031d78f6e30a78fe3f612.mp3\",\"https://api.clthuanxie.cn/cc-audio/9d/9d5e783205daf361aacbbb054fd3ba8b6ba34269.mp3\"]}}]}]}]\n"])</script></body></html>
