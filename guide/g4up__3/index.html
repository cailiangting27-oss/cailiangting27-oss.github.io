{\\\\circ}$）、直角（$=90^{\\\\circ}$）、钝角（$90^{\\\\circ}\u003c角\u003c180^{\\\\circ}$）、平角（$=180^{\\\\circ}$）、周角（$=360^{\\\\circ}$）。画角时先定线，再定点，连线即成。\",\"key_formula\":\"$$1\\\\text{周角} = 2\\\\text{平角} = 4\\\\text{直角}$\",\"common_mistakes\":[\"认为大于 $90^{\\\\circ}$ 的角全是钝角，忽略了平角和周角\",\"分不清平角和直线、周角和射线的区别\"],\"tips\":\"口诀：小于90是锐角，等于90是直角，90至180是钝角，180是平，360是周。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/71/71b82777a20165cf395f9ee016d0146ac93f88bc.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ba/ba10930968a3aeab54cba074e91cb26e94387cfb.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/00/00a2d9cad96557200f654dba9d687c06be6509da.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/bd/bd3c34e1ee105cbc9cec16167cb5bbd45492a720.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/e7/e7e1922cf6cc94dc1548bc95dd2caa77c7452557.mp3\",\"https://api.clthuanxie.cn/cc-audio/03/030e94a3c6c6c1a708ffbcc4a77d8bdc4e91dafd.mp3\"]}}]}]}]\n"])</script></body></html>
