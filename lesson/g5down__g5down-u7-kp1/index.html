ptions\":[\"https://api.clthuanxie.cn/cc-audio/49/49aca24dfc3829c36d73b640a672c48e273aad59.mp3\",\"https://api.clthuanxie.cn/cc-audio/c9/c9f6086823563e6e9d482c5ce7c5b09895dc84da.mp3\",\"https://api.clthuanxie.cn/cc-audio/79/799accce24d2e1a0791563ec23633c1dd3c44d55.mp3\",\"https://api.clthuanxie.cn/cc-audio/37/378c15e2d68cb4b60cae9a5b8699674531702e4a.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/5c/5ca0156e0033420d01eaf33a5f2a0c3abeba741d.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"单式折线统计图的认识与分析\",\"question\":\"小红5月1日的体温是37度，5月2日降到了36度。在折线统计图中，这两天间的折线是___（填“上升”或“下降”）。如果是选择题请选下降，此处填空请输入数字：下降对应数字1，上升对应数字2。\",\"options\":[],\"answer\":\"1\",\"explanation\":\"为了符合纯整数输入要求：36 \u003c 37，趋势为下降。题目要求填对应数字1。验算：趋势下降即1。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/59/5909f57c48a2934ab7c3a248b9643b2a4dc6d203.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/84/84e7287afb3a236a9705d1983dfb849966a2f793.mp3\"}},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"单式折线统计图的认识与分析\",\"question\":\"某地一月降水量为10毫米，二月为15毫米，三月为25毫米。这三个月降水总量是多少毫米？\",\"options\":[],\"answer\":\"50\",\"explanation\":\"求总量用加法：$10 + 15 + 25 = 50$（毫米）。验算：$50 - 25 - 15 = 10$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/a7/a7b9a5a43e3f17b212ad2e961fb6ad0a8348cebf.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/4b/4bfc18c6e0a8e371b0ca32f7d894669dcda01436.edge-b79e9a061d91.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"单式折线统计图的认识与分析\",\"question\":\"$$12 + 18 + 24 + 16 = ?$\",\"options\":[],\"answer\":\"70\",\"explanation\":\"$$12 + 18 = 30$，$30 + 24 = 54$，$54 + 16 = 70$。验算：$70 - 16 - 24 - 18 = 12$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/44/4454012ed097ca16bf5474f35f8d46390527f866.edge-517f575346cb.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/cd/cdee08151d28039aceae72f3202630c1d9c83374.edge-8b1adf0fc872.mp3\"}}],\"knowledge\":{\"point\":\"单式折线统计图的认识与分析\",\"core_concept\":\"折线统计图是在统计表的基础上，用点来表示数据的多少，并用线段将这些点按顺序连接起来。它最大的优势在于能够清晰、直观地反映出一组数据随着时间或其他变量而产生的增减变化趋势。\",\"key_formula\":\"数据点(x,y) \\\\rightarrow 线段连接 \\\\rightarrow 趋势分析\",\"common_mistakes\":[\"只看折线的形状而忽略了纵轴刻度的实际数值。\",\"在描点时，点的位置在水平方向或垂直方向上与数据对不准。\"],\"tips\":\"观察折线图时，可以总结为：点看大小，线看趋势，坡度看快慢。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/76/7614d8d7adc7e2a1ae137ee11302d9c8112c18a1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/09/095c42fd3c1719bab921c0bbaf4f3aba1478407f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/44/44ed118283090fc322c88597a98130b3468661b2.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/a4/a48c9d9639698e503e39cf5e2d6de4066eaaf79b.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/c3/c3b0dd66104a4fa733873109ce834ed12881179f.mp3\",\"https://api.clthuanxie.cn/cc-audio/0b/0b3cc6e7aa30119ab628391c889d2b7538556b43.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
