fficulty\":2,\"knowledge_point\":\"观察不同立体图形的视图比较\",\"question\":\"如果不改变正方体的个数，把它们排成一排，从前面看到的正方形个数最多。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"横向一字排开时，前面投影不重合，看到的正方形个数等于正方体总数。✓\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"从不同方向观察同一立体图形\",\"question\":\"从前面看是2个正方形横排，从上面看是3个正方形L形排列，最少要用几个小正方体？\",\"options\":[\"3个\",\"4个\",\"5个\",\"6个\"],\"answer\":\"3个\",\"explanation\":\"L形在底面占3个位置，且高度皆为1，前面看过去正好是2个宽。$3 \\times 1 = 3$。✓\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"观察不同立体图形的视图比较\",\"question\":\"下面哪个物体从前面和左面看到的形状完全一样？\",\"options\":[\"长方体\",\"正方体\",\"三棱柱\",\"圆柱\"],\"answer\":\"正方体\",\"explanation\":\"正方体的六个面完全相同，所有方向视图均为相同正方形。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"根据三视图还原几何体结构\",\"question\":\"一个小几何体，从正面看是4个正方形（分两层，下3上1居中），搭成它最少需要几个小正方体？\",\"options\":[\"4个\",\"5个\",\"6个\",\"7个\"],\"answer\":\"4个\",\"explanation\":\"只要按正面的位置直接摆放一排即可，最少就是视图显示的4个。✓\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"从不同方向观察同一立体图形\",\"question\":\"亮亮观察一个几何体，从上面看到是一个长方形。这个几何体不可能是？\",\"options\":[\"平放的长方体\",\"平放的圆柱\",\"正方体\",\"横放的单层5个正方体\"],\"answer\":\"正方体\",\"explanation\":\"正方体从上面看一定是正方形，不可能是长方形。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"从不同方向观察同一立体图形\",\"question\":\"站在一个位置观察一个大长方体包装盒，最多能看到多少个面？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"3个\",\"explanation\":\"观察物体时，在同一位置最多只能看到相交于一个顶点的三个面。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"根据三视图还原几何体结构\",\"question\":\"从前面看是2个横向正方形，从左面看也是2个横向正方形，从上面看也是2个。最少需要几个正方体？\",\"options\":[\"2个\",\"3个\",\"4个\",\"5个\"],\"answer\":\"2个\",\"explanation\":\"两个小正方体斜着放（如阶梯状但在平面同层），可满足各向视图。最简单的2个对角放即可。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"观察不同立体图形的视图比较\",\"question\":\"从同一个方向观察不同的物体，看到的形状？\",\"options\":[\"一定不同\",\"一定相同\",\"可能相同\",\"都不对\"],\"answer\":
