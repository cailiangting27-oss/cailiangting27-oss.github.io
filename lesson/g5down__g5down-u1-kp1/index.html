图还原几何体\",\"question\":\"从正面看是3个横排正方形，从左面看是2个横排正方形，从上面看是4个正方形（2x2分布），最少用几个小正方体？\",\"options\":[\"4个\",\"5个\",\"6个\",\"7个\"],\"answer\":\"4个\",\"explanation\":\"根据俯视图确定底层4个（2x2排列），调整高度满足正视图和左视图，最少4个。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/cf/cfb45d567d16b3ca501e1521bf242b5cee0af8c2.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/75/758a56d5716f4d8e1d861502cfcd16dbc25804fd.mp3\",\"https://api.clthuanxie.cn/cc-audio/ff/ffa8b6b6fde3469aa0ae682cbe6d6da438d2df6b.mp3\",\"https://api.clthuanxie.cn/cc-audio/6e/6e3704390da83fc5d2205b7a93146aa84235cf62.mp3\",\"https://api.clthuanxie.cn/cc-audio/07/07f5eee6c1c2a31d50f8be149981f8088f5254df.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/9e/9e027ef3f650adc87ee747014b85596c8846a269.mp3\"}},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"根据三视图还原几何体\",\"question\":\"一个几何体从正面看是3个横排正方形，从左面看也是3个横排正方形，它最多由几个小正方体组成？\",\"options\":[\"3个\",\"6个\",\"9个\",\"12个\"],\"answer\":\"9个\",\"explanation\":\"相当于底层摆满一个 $3 \\\\times 3$ 的正方形阵列，最多 $3 \\\\times 3 = 9$ 个。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/61/61b0270831fcbcf0f2ab9b92fbc0f62a09c90133.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/f1/f1ffe4166e57e63bb4469906335e6cbb7c2e222d.mp3\",\"https://api.clthuanxie.cn/cc-audio/6e/6e3704390da83fc5d2205b7a93146aa84235cf62.mp3\",\"https://api.clthuanxie.cn/cc-audio/b5/b52983ae949b7c7b071aced1a77e53ec93e056ee.mp3\",\"https://api.clthuanxie.cn/cc-audio/95/9556931c8d4c93652be6343c2a9573bb00df6528.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/47/47d194b5f5528ca7c7c95d8ce3c5da7b3e59bab8.edge-b8d8a132b057.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据三视图还原几何体\",\"question\":\"要搭成一个长方体，至少需要几个完全相同的小正方体？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"2个\",\"explanation\":\"长方体要求长宽高不全相等。2个正方体并排即可构成一个 $2 \\\\times 1 \\\\times 1$ 的长方体。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/95/95ce556335adcb0f9b9415b3d65337ca344fd490.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/71/71395d6e5bac49b83c2cb14f56ab1a4ac23b7808.mp3\",\"https://api.clthuanxie.cn/cc-audio/df/df6125300823711d7502ea7501c0ee660855c7c9.mp3\",\"https://api.clthuanxie.cn/cc-audio/f1/f1ffe4166e57e63bb4469906335e6cbb7c2e222d.mp3\",\"https://api.clthuanxie.cn/cc-audio/75/758a56d5716f4d8e1d861502cfcd16dbc25804fd.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/72/72fe716d9d469887e76ccddd05a0487d0738c12e.edge-0a11d55c04cb.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"根据三视图还原几何体\",\"question\":\"一个由小正方体搭成的几何体，从正面看有3个小正方形，从左面看有2个小正方形，搭建这个几何体最少需要 ___ 个小正方体。\",\"options\":[],\"answer\":\"3\",\"explanation\":\"正面3个要求横向跨度3个，左面2个要求纵向跨度2个。交错放置最少只需3个。验算：$3 \\\\ge 3$ 且满足投影。 ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/99/99159bcad4b2fffbd7bbefd019799371dd0d2feb.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/33/3355d99192e18430c1c2092c119dd10dd8d082f3.edge-62adc343f4d2.mp3\"}},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据三视图还原几何体\",\"question\":\"计算：$5 \\\\times 3 - 6 = ?$\",\"options\":[],\"answer\":\"9\",\"explanation\":\"$$5 \\\\times 3 = 15$，$15 - 6 = 9$。验算：$(9 + 6) \\\\div 3 = 5$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/99/9905b8d9993d7e703b3bd45c0a3b25284a006c8c.edge-5977c96389ee.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/20/20c86e0e53272c51cb60c4f36c7dba1aa814efb6.edge-3d41011e7c62.mp3\"}}],\"knowledge\":{\"point\":\"根据三视图还原几何体\",\"core_concept\":\"物体在空间中是由长宽高三个维度决定的。通过正面、上面、左面三个不平行的视角观察，我们可以获得物体的二维平面投影。将这三个投影结合起来，利用“长对正、宽相等、高平齐”的原则，可以像拼图一样在脑海中还原出物体的立体形状。这是发展空间观念的核心过程。\",\"key_formula\":\"三视图还原规则：投影一致性原则\",\"common_mistakes\":[\"混淆左视图和右视图，导致左右位置颠倒。\",\"忽略了隐藏在后面的小正方体，只数出了肉眼可见的个数。\"],\"tips\":\"动手操作是最好的方法！先用积木按图形摆一摆，对比三视图，慢慢建立起从平面到空间的转换习惯。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio
