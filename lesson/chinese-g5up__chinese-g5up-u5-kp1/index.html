鸟相比显得很矮。\",\"比如松鼠，它很乖巧。\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"A列数字-2十亩；B打比方-1绿伞；C举例子-4比如；D作比较-3相比。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/41/4144fd767987c521e7230f1067c8cfb43c4e590c.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/af/af2f709edb1699008b0015294973c1db7af52339.mp3\",\"https://api.clthuanxie.cn/cc-audio/d7/d7c53a0e123a05cea187c233b0829222aaf727aa.mp3\",\"https://api.clthuanxie.cn/cc-audio/f1/f1f8095ed829cbdd43ff03209e2590491e02d56f.mp3\",\"https://api.clthuanxie.cn/cc-audio/24/241d9edaf6a343a8009472eac44e6904a1ad4e2b.mp3\",\"https://api.clthuanxie.cn/cc-audio/0d/0dcba6d824a7997da5f0e0440aa45e2dd67f2bea.mp3\",\"https://api.clthuanxie.cn/cc-audio/9f/9f5e7b68c8ed6ad6a734b7b217c88caadec19a1a.mp3\",\"https://api.clthuanxie.cn/cc-audio/f0/f0cd8171596f54611f719c40b3ffbb0cc0dfc81e.mp3\",\"https://api.clthuanxie.cn/cc-audio/50/50cebdf96b8fe06543d02e8effa290e39ef55376.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/a9/a933bb4872d1f96fee1d5c70dc902d959cf4ce87.mp3\"}},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"常用说明方法的辨析与运用\",\"question\":\"请将下列词语排成一个关于说明文作用的句子：\",\"options\":[\"我们要\",\"说明方法\",\"正确使用\",\"介绍事物时\"],\"answer\":\"介绍事物时,我们要,正确使用,说明方法\",\"explanation\":\"根据主谓宾结构排列句子。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/e2/e2a38bd1a534fd1f0f7df826fa03e051717351cd.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/a3/a336013c6e4ef91974d7e6cd12f52eeed0b592e8.mp3\",\"https://api.clthuanxie.cn/cc-audio/bc/bc690ef21c3cc689ca2c4379bc1ae2dd2ae610af.mp3\",\"https://api.clthuanxie.cn/cc-audio/d1/d1bed75b5a27abfc6ade1719db730b1a05169788.mp3\",\"https://api.clthuanxie.cn/cc-audio/43/43898142eb3aed1623b5992569c7cea2d44388cc.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/7e/7ec956d9b773f813be3c6344cb90e3d225fc171c.mp3\"}}],\"knowledge\":{\"point\":\"常用说明方法的辨析与运用\",\"core_concept\":\"说明方法是说明文中用来介绍事物特征、解释事理的手段。五年级重点掌握四种：列数字（用确数或概数增强说服力）、打比方（用熟悉事物比喻陌生事物，增加形象性）、作比较（通过对比突出被说明对象的特点）、举例子（用代表性事例让说明更具体）。\",\"key_formula\":\"找关键词：有数字看“列数字”，有比喻词看“打比方”，有对比看“作比较”。\",\"common_mistakes\":[\"将‘打比方’练习成修辞中的‘比喻’而忽略其说明意图\",\"混淆‘作比较’与‘打比方’，看到‘像’就认为是打比方，而忽略了是否是两个事物在比大小优劣\"],\"tips\":\"通过‘数字感、画面感、对比感、事例感’四个维度来快速区分。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/70/70e36fae1dc4b326d36ac1b000d1cf2415af96b1.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/14/14919f585c1ef593a12bc798cf4afedc261a1e18.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/5a/5acf761d1fa722dba3249812c99e41a0c68c1362.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/42/423f7f4a4984f7046b8b0282e04e854c3b211c0a.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/09/09e6f322d663ec03f3ec87c3c01ca467e429ada5.mp3\",\"https://api.clthuanxie.cn/cc-audio/f9/f935efd6fce5398644c6860c8841e3b69108cac9.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
