cc-audio/b3/b3e73f6cd2f628c3fdd05e9d1182b828703c64c9.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/53/53a4860e05e63c8297ba3c4de6ee42c41405f080.mp3\"}},{\"id\":4,\"type\":\"true_false\",\"score\":2,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"如果被减数增加 0.3，减数不变，那么差也增加 0.3。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"差 = 被减数 - 减数，被减数+0.3，差必然+0.3。验算：$1.5-1.0=0.5$，$(1.5+0.3)-1.0=0.8$，$0.8-0.5=0.3$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/b2/b2bdbf1aa64d4da5fe6ae8cbf16fc559cc4022b7.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f0/f0ff0b9dc328de0f737051e6e45de83c22a55124.mp3\"}},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"计算 $3.08 + 1.2$，结果是：\",\"options\":[\"4.28\",\"4.1\",\"3.2\",\"4.10\"],\"answer\":\"4.28\",\"explanation\":\"小数点对齐，百分位 $8+0=8$，十分位 $0+2=2$，整数部分 $3+1=4$，得 4.28。验算：$4.28 - 1.2 = 3.08$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/38/3842b003c83ca76acc51820e3d3e9714ae57660f.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/6d/6d1f31f2c363a2d6203d51be0772d8367215324b.mp3\",\"https://api.clthuanxie.cn/cc-audio/78/782650dad14a47661ff5170fb27c2a5610214cf9.mp3\",\"https://api.clthuanxie.cn/cc-audio/47/47ffd93865bc60f6431831db2605565dffbb7509.mp3\",\"https://api.clthuanxie.cn/cc-audio/3b/3b44a2c2e9575e638d2722e4a2df06d8f007bbc9.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/dc/dc4366fd04e6f7f68923605241db99df0bc15c92.mp3\"}},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"一个小数由三位小数减去两位小数，所得的差是：\",\"options\":[\"一位小数\",\"两位小数\",\"三位小数\",\"四位小数\"],\"answer\":\"三位小数\",\"explanation\":\"三位小数减两位小数，末位千分位保持不变（减0），差仍是三位小数。验算：$0.123 - 0.11 = 0.013$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/ab/abbf400556f6d26f35502152ef2244d6f4ecc848.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/61/61ea29d62b6f 3489e060d3ff5a1ab6c59341fa450c.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/9d/9d46aef7964861c65250727457f89e437691e7be.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"已知一个加数是 12.54，和是 20.54，另一个加数是 ___。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"另一个加数 $= 20.54 - 12.54 = 8$。因为后台只接受整数及题干要求，答案为 8。验算：$8 + 12.54 = 20.54$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/06/06bcd43850081929b668558d0155a120289ba6dc.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/32/3216896bf4d9fc2648f360ac52ccfac31fdb9ffc.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"小明身高 1 米 4 分米，写成小数是 1.4 米。小明比 1 米 5 厘米的弟弟高 ___ 厘米。（注：1米5厘米=1.05米）\",\"options\":[],\"answer\":\"35\",\"explanation\":\"1.4 米 = 140 厘米，1.05 米 = 105 厘米。$140 - 105 = 35$ 厘米。验算：$105 + 35 = 140$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/12/12ec237c4c80cb3b43f06f597786a010bdca9664.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/b6/b6e2fc40cc141c09ba53c3106261774793cc563a.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"计算：$18.5 - 6.5 = ?$\",\"options\":[],\"answer\":\"12\",\"explanation\":\"$$18.5 - 6.5 = 12.0 = 12$。验算：$12 + 6.5 = 18.5$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/d9/d9f85464c51e47803ad9988685f82ce89d2356f9.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/1f/1f01bca44859d8864e449665eee21dda149c0750.mp3\"}}],\"knowledge\":{\"point\":\"小数加减法的基础竖式计算\",\"core_concept\":\"小数加、减法的计算关键在于小数点对齐。只要小数点对齐了，相同数位也就对齐了。计算时从低位算起，按照整数加减法的法则进行计算，最后在得数里对齐横线上的小数点点上小数点。如果得数的小数部分末尾有0，通常要根据小数的性质化简。\",\"key_formula\":\"小数点对齐，相同数位加减，满十进一，退一当十。\",\"common_mistakes\":[\"数位对齐错误：将小数的末尾对齐而非小数点对齐。\",\"漏点小数点：计算完成后忘记在和或差中点上小数点。\"],\"tips\":\"竖式计算时，如果被减数的小数位数比减数少，可以在被减数的末尾补0后再减。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a0/a02e09eee662d1f3fa6706e5aa7368708de574b6.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/af/afce1953845e496cb9995a8e86487c8556644ab5.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/6d/6dc464859755502b07a31c9ecafe53f5f85602fa.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/cf/cf51ea36da8f74b3a049cf6d19c19688d012682e.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/58/58f628c14db5071e9d1e482f2ea1510cd9d4097f.mp3\",\"https://api.clthuanxie.cn/cc-audio/61/616c1b1517e4d72570aa0e5b2c94cc0c0d70967b.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
