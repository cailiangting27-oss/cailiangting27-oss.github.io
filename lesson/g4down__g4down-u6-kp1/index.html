-0.5=0.3$ ✓。\"},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"计算 $3.08 + 1.2$，结果是：\",\"options\":[\"4.28\",\"4.1\",\"3.2\",\"4.10\"],\"answer\":\"4.28\",\"explanation\":\"小数点对齐，百分位 $8+0=8$，十分位 $0+2=2$，整数部分 $3+1=4$，得 4.28。验算：$4.28 - 1.2 = 3.08$ ✓。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"一个小数由三位小数减去两位小数，所得的差是：\",\"options\":[\"一位小数\",\"两位小数\",\"三位小数\",\"四位小数\"],\"answer\":\"三位小数\",\"explanation\":\"三位小数减两位小数，末位千分位保持不变（减0），差仍是三位小数。验算：$0.123 - 0.11 = 0.013$ ✓。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"在比较 $10$ 与 $9.99$ 的大小时，下列符号正确的是：\",\"options\":[\"\u003e\",\"\u003c\",\"＝\",\"≈\"],\"answer\":\"\u003e\",\"explanation\":\"10 的整数部分是 10，9.99 的整数部分是 9，10 \u003e 9。验算：$10 - 9.99 = 0.01 \u003e 0$ ✓。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"把 2 米长的绳子剪成三段。已知第一段长 0.5 米，第二段长 0.8 米，第三段长多少米？\",\"options\":[\"0.7 米\",\"1.3 米\",\"0.3 米\",\"1.7 米\"],\"answer\":\"0.7 米\",\"explanation\":\"第三段 $= 2 - 0.5 - 0.8 = 0.7$（米）。验算：$0.7 + 0.5 + 0.8 = 2$ ✓。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"5.6 加上多少结果是 10？\",\"options\":[\"4.4\",\"5.4\",\"15.6\",\"4.6\"],\"answer\":\"4.4\",\"explanation\":\"$$10 - 5.6 = 4.4$。验算：$4.4 + 5.6 = 10.0$ ✓。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"某人身高 1.45 米，他站在 0.5 米高的木凳上，此时最高处离地：\",\"options\":[\"1.95 米\",\"0.95 米\",\"2 米\",\"2.05 米\"],\"answer\":\"1.95 米\",\"explanation\":\"$$1.45 + 0.5 = 1.95$（米）。验算：$1.95 - 0.5 = 1.45$ ✓。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"一个两位小数，十分位上的数字是 5，百分位上的数字是 4，减去 0.5 后得：\",\"options\":[\"0.4\",\"0.04\",\"0.54\",\"5.4\"],\"answer\":\"0.04\",\"explanation\":\"原数是 $0.54$，$0.54 - 0.5 = 0.04$。验算：$0.04 + 0.5 = 0.54$ ✓。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"下列哪个数最小？\",\"options\":[\"1.01\",\"0.99\",\"1.1\",\"0.909\"],\"answer\":\"0.909\",\"explanation\":\"比较整数部分：1 \u003e 0；比较百分位：0.99 与 0.909，9 \u003e 0，故 0.909 最小。验算：$0.909 \u003c 0.99 \u003c 1.01 \u003c 1.1$ ✓。\"},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"小数部分最大的计数单位与 0.1 相比，结果：\",\"options\":[\"相等\",\"0.1 大\",\"0.2 大\",\"计数单位大\"],\"answer\":\"相等\",\"explanation\":\"小数部分最大的计数单位是十分之一，即 0.1。验算：无。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"已知一个加数是 12.54，和是 20.54，另一个加数是 ___。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"另一个加数 $= 20.54 - 12.54 = 8$。因为后台只接受整数及题干要求，答案为 8。验算：$8 + 12.54 = 20.54$ ✓。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"小明身高 1 米 4 分米，写成小数是 1.4 米。小明比 1 米 5 厘米的弟弟高 ___ 厘米。（注：1米5厘米=1.05米）\",\"options\":[],\"answer\":\"35\",\"explanation\":\"1.4 米 = 140 厘米，1.05 米 = 105 厘米。$140 - 105 = 35$ 厘米。验算：$105 + 35 = 140$ ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"小数加减法的基础竖式计算\",\"question\":\"计算：$18.5 - 6.5 = ?$\",\"options\":[],\"answer\":\"12\",\"explanation\":\"$$18.5 - 6.5 = 12.0 = 12$。验算：$12 + 6.5 = 18.5$ ✓。\"}],\"knowledge\":{\"point\":\"小数加减法的基础竖式计算\",\"core_concept\":\"小数加、减法的计算关键在于小数点对齐。只要小数点对齐了，相同数位也就对齐了。计算时从低位算起，按照整数加减法的法则进行计算，最后在得数里对齐横线上的小数点点上小数点。如果得数的小数部分末尾有0，通常要根据小数的性质化简。\",\"key_formula\":\"小数点对齐，相同数位加减，满十进一，退一当十。\",\"common_mistakes\":[\"数位对齐错误：将小数的末尾对齐而非小数点对齐。\",\"漏点小数点：计算完成后忘记在和或差中点上小数点。\"],\"tips\":\"竖式计算时，如果被减数的小数位数比减数少，可以在被减数的末尾补0后再减。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
