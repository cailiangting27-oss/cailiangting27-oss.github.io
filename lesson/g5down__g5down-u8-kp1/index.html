下沉。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/e6/e63eb3265e858bdc10f3065322536c81ea3c78f5.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/8a/8a2efed11ffb679c1676e7588a8a6a832228526d.mp3\"}},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"找次品的逻辑推理基础\",\"question\":\"在 3 个零件中找一个较轻的次品，至少称几次就一定能找出来？\",\"options\":[\"1 次\",\"2 次\",\"3 次\",\"不能确定\"],\"answer\":\"1 次\",\"explanation\":\"将 3 个零件分为（1,1,1）。称量其中两个，若平衡，第三个是次品；若不平衡，轻的是次品。只需 1 次。验算：$3^1=3$，1次可以解决3个。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/11/115673467264b82afd09b680c8fa5d5f963b7348.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/04/04cdc24e7bcea5cc5162a5bb635c369dcd058147.mp3\",\"https://api.clthuanxie.cn/cc-audio/e5/e5b0d41cefdec876fe5fa75ea1a3f0f2c6d1cc33.mp3\",\"https://api.clthuanxie.cn/cc-audio/04/04b7aad9650cb3562bc0e84ffa7381a9996bd833.mp3\",\"https://api.clthuanxie.cn/cc-audio/61/6132bff1dd9ca168d880e62b1b9323dd8fead4e8.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f6/f6a385c47a0ca76f915c711bf8084c7838c8d153.mp3\"}},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"找次品的逻辑推理基础\",\"question\":\"用天平找次品时，天平两端放置的物体数量必须（ ）。\",\"options\":[\"相等\",\"左边多\",\"右边多\",\"不确定\"],\"answer\":\"相等\",\"explanation\":\"根据天平平衡原理，只有两端放置数量相等的合格品，天平才会平衡。否则无法判断。验算：等量代换前提是基数相等。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/67/672462ebc5c00ce6c891f492acd77337533d30d0.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/6a/6a69fd718415d2c27a3b49df05e5741b095f05cd.mp3\",\"https://api.clthuanxie.cn/cc-audio/eb/eb57d6826d193e934bb44be7eb8bc4f4b71a838e.mp3\",\"https://api.clthuanxie.cn/cc-audio/ed/ed7541326f82e81c64ef69541390aa151220a6fc.mp3\",\"https://api.clthuanxie.cn/cc-audio/aa/aa253a83a8428de46699c638f37c817c175b2db5.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/0c/0cbcaf7ab90d58ca6d2ff285f0d88f0b6353e053.mp3\"}},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"找次品的逻辑推理基础\",\"question\":\"已知次品比合格品轻，天平平衡说明次品在（ ）。\",\"options\":[\"左面\",\"右面\",\"外面\",\"无法判断\"],\"answer\":\"外面\",\"explanation\":\"平衡表示天平上的都是合格品，次品被排除在天平之外。验算：排除法逻辑。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/c7/c7680cf47e6035f2d79286b6f64a84c3d46d3bfb.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/02/0261030cd30bb4def6bb0fdc7d3cdf0f93d33c83.mp3\",\"https://api.clthuanxie.cn/cc-audio/f7/f7750394fbd88cbe0c6a73adc21ca13aa164cc66.mp3\",\"https://api.clthuanxie.cn/cc-audio/0f/0f595cb1020c6acbd8c0790cbbab7293147f7ef6.mp3\",\"https://api.clthuanxie.cn/cc-audio/b9/b9ef74ca6dab44744703d6268939592ba582953b.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/33/3304b86a3bb4d5d71beacf303c5ffda88f19c4a0.mp3\"}},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"找次品的逻辑推理基础\",\"question\":\"有 4 颗珍珠，其中一颗是假的，比真的重。至少称几次保证能找到？\",\"options\":[\"1 次\",\"2 次\",\"3 次\",\"4 次\"],\"answer\":\"2 次\",\"explanation\":\"4个珍珠（2,2）称，不平衡取重的那堆（1,1）再称。共2次。验算：$3^1 \u003c 4 \u003c 3^2$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/dd/ddedc1a7d16fe5f859e2e77c24da5d3b0cbf6eac.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/04/04cdc24e7bcea5cc5162a5bb635c369dcd058147.mp3\",\"https://api.clthuanxie.cn/cc-audio/e5/e5b0d41cefdec876fe5fa75ea1a3f0f2c6d1cc33.mp3\",\"https://api.clthuanxie.cn/cc-audio/04/04b7aad9650cb3562bc0e84ffa7381a9996bd833.mp3\",\"https://api.clthuanxie.cn/cc-audio/b6/b6350c687bd070d040073c2eebe980ba3ee7e070.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/c3/c3f7449af7a4d3d326a6fd83c3ed8de3c5d4b5ca.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"找次品的逻辑推理基础\",\"question\":\"从 2 个零件中寻找一个较重的次品，至少称 ___ 次能保证找出来。\",\"options\":[],\"answer\":\"1\",\"explanation\":\"直接在天平两侧各放 1 个，下沉的就是次品。列式：$3^{1} = 3 \\times 2$。验算：1 次足矣 ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/ad/ad16f49c88827f005298cb12f51ca4fedb979661.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/50/5030fa04092b12c3fba9fc3a2e7da54ba1270d4b.mp3\"}}],\"knowledge\":{\"point\":\"找次品的逻辑推理基础\",\"core_concept\":\"利用天平平衡的原理。将物体分成两组（或三组）放在天平两端对比。若天平平衡，次品在剩下的物体中；若不平衡，次品在倾斜或上扬的那一端（取决于次品是重还是轻）。\",\"key_formula\":\"天平平衡 $\\rightarrow$ 次品在外面；天平倾斜 $\\rightarrow$ 次品在里面。\",\"common_mistakes\":[\"不考虑题目中次品是“重”还是“轻”，导致推理方向错误。\",\"认为天平不平衡时，次品一定在重的那一端（忽略了次品可能较轻的情况）。\"],\"tips\":\"做题前先圈出关键词“轻”或“重”，并在草稿纸上模拟天平左右两端的平衡情况。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/15/15775ee0a9ab6d8e3696f45fa11e006f19357fbd.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/20/20d1d2d83b02598865a5da4ea2ca597bff25ce27.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/a0/a0eb7cd75e37ce2c8bb95009f804d4f50da41bf1.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/8a/8abac87cf9c63371717d78e6f7d1f219a15eead2.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/d3/d36bf62f2dae0e7432653a199d7609962ec5bc7e.mp3\",\"https://api.clthuanxie.cn/cc-audio/a1/a1b95e606086672e18f880c7a76e36fc0edf5645.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
