n\":\"https://api.clthuanxie.cn/cc-audio/66/6653f099467275e4753bb2065f0154776f20ec10.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/93/93fe95579d70af4221466ccb4d47edabfcf98446.mp3\"}},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"小红从家出发向正东走 200 米到达超市。如果她从超市回航，应该向哪个方向走？\",\"options\":[\"正东\",\"正南\",\"正西\",\"正北\"],\"answer\":\"正西\",\"explanation\":\"东的相反方向是西。返回原点需要走完全相反的方向。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/f0/f00d9906c6745e2d538dcd9d908ff99a90a3326c.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/e2/e2395668de4d0bc1e14d7d05a5c6895c7e8b3125.mp3\",\"https://api.clthuanxie.cn/cc-audio/32/3209a674da5747f48be8339ca2770f8f83f323a9.mp3\",\"https://api.clthuanxie.cn/cc-audio/2a/2ac54ba667e8f9179dc568ad3162f6fedb7e8252.mp3\",\"https://api.clthuanxie.cn/cc-audio/13/13c45f6db4dd378b5d3c6266dc9d3987276ae605.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/82/821eb0b86f6fdd0e87a417e82e811e1b752fb99d.mp3\"}},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"从车站出发，先向东偏北 20 度走 3 站，再向北走 2 站。这段路程一共有几个观测点变化？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"2个\",\"explanation\":\"第一个观测点是车站，第二个观测点是转弯处（东偏北 3 站后的位置）。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/84/84c633cb4ad8d89c8be3578087dced7dc33104a2.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/71/71395d6e5bac49b83c2cb14f56ab1a4ac23b7808.mp3\",\"https://api.clthuanxie.cn/cc-audio/df/df6125300823711d7502ea7501c0ee660855c7c9.mp3\",\"https://api.clthuanxie.cn/cc-audio/f1/f1ffe4166e57e63bb4469906335e6cbb7c2e222d.mp3\",\"https://api.clthuanxie.cn/cc-audio/75/758a56d5716f4d8e1d861502cfcd16dbc25804fd.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/de/dedf1d0027969fc1c87279b6defe887c9e7f9c74.mp3\"}},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"小明跑步路线：起点向 "explanation\":\"https://api.clthuanxie.cn/cc-audio/6f/6fcd2f1becd93e9a9cda71dfd57641e3b00b75b6.edge-59789ddc0616.mp3\"}},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"小强跑步，从家出发向南跑了 800 米，休息后再向北跑 1000 米。此时他家在小强南面 ___ 米处。\",\"options\":[],\"answer\":\"200\",\"explanation\":\"小强跑出的总位移：向北 $1000 - 800 = 200$ 米。所以此时小强在家北面 200 米处。家就在小强的正南 200 米处。验算：$1000 - 200 = 800$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/21/21293c611ce53960041b9f523c5dca0a6bec8c9a.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/fc/fcbc7de9d156f0206611883b83f57f1edc4638ca.edge-3750cba50b86.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"计算：$45 + 45 = ?$\",\"options\":[],\"answer\":\"90\",\"explanation\":\"$$45 + 45 = 90$。验算：$90 - 45 = 45$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/3a/3ac438586e324cdad0438e4509f5279eb436792b.edge-8526306496dc.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/79/792b7592ee2911335591dadd595359849de3413b.edge-918ac1a5bc70.mp3\"}}],\"knowledge\":{\"point\":\"描述简单的行走路线\",\"core_concept\":\"描述行走路线要把全过程分成若干段，每段都要说清是从哪里出发、向什么方向、走多远。当到达一个新点时，要把这个新点看作新的观测点来描述下一段。\",\"key_formula\":\"$$行走路线描述：点 A \\\\xrightarrow{方向+距离} 点 B \\\\xrightarrow{方向+距离} 点 C$\",\"common_mistakes\":[\"返回时方向没变：没意识到回程的方向应与去程完全相反。\",\"观测点混淆：在描述第二段路程时，仍然以第一段的起点为参考物。\"],\"tips\":\"可以口诀记忆：‘找起点，看方向，量角度，算距离’。返回描述时，逆推路线，方向取反。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/34/34dc45e239b96dc7e3422aa6fb1d74143bbdf382.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/59/5930da9df45f9407a4cff650a19df7114af6df3f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/25/252dcceecb13cec0607fc33a5a9f315fd2f07718.edge-02a32bb5359c.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/98/98cf7651a0bc35c11f367d0ce407c2d5803675f6.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/88/889
