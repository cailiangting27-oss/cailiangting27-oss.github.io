},{\"id\":5,\"type\":\"true_false\",\"score\":2,\"difficulty\":3,\"knowledge_point\":\"借助背景资料理解鲁迅作品\",\"question\":\"鲁迅先生说“救救孩子”，反映了他对旧封建礼教的强烈抗争。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"这是他在《狂人日记》结尾发出的历史最强音。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"文中写少年闰土“心里有无穷无尽的稀奇的事”，这反观出“我”当时的什么处境？\",\"options\":[\"我也很博学\",\"“我”处在封闭的院子里，见识短浅\",\"“我”不喜欢读书\",\"“我”和闰土关系不好\"],\"answer\":\"“我”处在封闭的院子里，见识短浅\",\"explanation\":\"通过闰土的广博见识，对比映衬出底层少爷生活的枯燥与局限。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"借助背景资料理解鲁迅作品\",\"question\":\"当鲁迅在《好的故事》中描写到“无数美的人和美的事，错综起来像一天云锦”，表达了：\",\"options\":[\"对大自然的热爱\",\"对黑暗现实的妥协\",\"对光明未来的执着追求\",\"对编织技术的赞赏\"],\"answer\":\"对光明未来的执着追求\",\"explanation\":\"鲁迅通过优美的意象寄托在黑暗中不灭的理想。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"借助背景资料理解鲁迅作品\",\"question\":\"为什么《我的伯父鲁迅先生》中，伯父要给那拉脚的敷药后，还要给两个硬币？\",\"options\":[\"因为伯父很有钱\",\"因为伯父怕他麻烦\",\"为了维持他的生活，体现真正的无私关怀\",\"为了打发他快走\"],\"answer\":\"为了维持他的生活，体现真正的无私关怀\",\"explanation\":\"敷药是治标，给钱是治本，体现了鲁迅对底层人生活的深层次同情。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"书法的赏析与评价\",\"question\":\"柳公权在书法上的成功秘诀被称为“心正者笔正”，这告诉我们：\",\"options\":[\"写字姿势必须端正\",\"只有心地纯正的人才能写好字\",\"人品与艺品是统一的\",\"铅笔必须削尖\"],\"answer\":\"人品与艺品是统一的\",\"explanation\":\"这是柳公权著名的关于书法的谏言，强调修身对艺术的重要性。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"借助背景资料理解鲁迅作品\",\"question\":\"鲁迅的散文集《野草》中不包含哪篇文章？\",\"options\":[\"《好的故事》\",\"《雪》\",\"《少年闰土》\",\"《秋夜》\"],\"answer\":\"《少年闰土》\",\"explanation\":\"《少年闰土》选自小说集《故乡》，非散文集。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"下列关于“对比”手法的说法，错误的一项是：\",\"options\":[\"对比能使人物形象更鲜明\",\"只有相反的事物才能对比\",\"《有的人》全诗贯穿对比\",\"对比可以产生强烈的讽刺效果\"],\"answer\":\"只有相反的事物才能对比\",\"explanation\":\"对比不仅可以是完全相反的事物，也可以是同一事物的不同方面或不同时期。\"},{\"id\":16,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"“深蓝的天空中挂着一轮金黄的（___）。”\",\"options\":[],\"answer\":\"圆月\",\"explanation\":\"这是课文《少年闰土》第一自然段的经典名句。\"},{\"id\":17,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"借助背景资料理解鲁迅作品\",\"question\":\"巴金在《永远不能忘记的事情》中写鲁迅去世时，灵柩上覆盖的一块白布上写着“（___）”。\",\"options\":[],\"answer\":\"民族魂\",\"explanation\":\"这三字不仅是评价，更是鲁迅精神的象征。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"请将闰土童年生活中的趣事进行搭配。\",\"options\":[\"雪地\",\"海边\",\"潮汛\",\"沙地\",\"拾贝壳\",\"捕鸟\",\"刺猹\",\"看跳鱼\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"雪地捕鸟、海边拾贝壳、潮汛看跳鱼、沙地刺猹是《少年闰土》的核心情节。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"书法的赏析与评价\",\"question\":\"请将书法评价术语与其特征连线。\",\"options\":[\"颜筋\",\"柳骨\",\"笔势\",\"布局\",\"瘦硬有力\",\"丰满有力\",\"章法安排\",\"书写气势\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"颜筋指丰满，柳骨指瘦硬，笔势指动势，布局指章法。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"根据课文思想，排列出鲁迅对待敌人的态度：\",\"options\":[\"他\",\"横眉冷对\",\"千夫指\",\"哪怕\",\"千难万险\"],\"answer\":\"他,横眉冷对,千夫指,哪怕,千难万险\",\"explanation\":\"突出鲁迅坚定的立场。\"}],\"knowledge\":null},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
