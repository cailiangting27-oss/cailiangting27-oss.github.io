和形状特征进行分类。球可以向任何方向滚动；圆柱横放可以滚动，竖放只能滑动；长方体和正方体只能滑动，堆叠时最稳定。这有助于培养学生的空间观测能力。\",\"key_formula\":\"能滚动（含曲面）：圆柱、球；不能滚动（全平面）：长方体、正方体。\",\"common_mistakes\":[\"误认为圆柱只能滚动，忘记了它竖着放时是可以平稳滑动的。\",\"认为所有圆圆的图形都能向四面八方滚动（其实圆柱只能向两个方向滚动）。\"],\"tips\":\"记忆口诀：球儿圆圆滚得快，圆柱柱子站得稳，长方正方平平脸，堆高不倒最合群。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/31/31b4177bb3fe09ab220407fc33b30b9e3ea653ac.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/2e/2e897e2e14be438a4b94c2597c627311587e0753.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/80/80f32fc82ca2cc862c6b346b4cef1bc23faa6295.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/5c/5c94a18394ab419523b4313a51ca5bc7f2d0755f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/0c/0cc1b75b7f589322df7f8f8db254c881f100eda7.mp3\",\"https://api.clthuanxie.cn/cc-audio/1e/1e62609147d73333adec8dfdaa2d408f6f997cd6.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
