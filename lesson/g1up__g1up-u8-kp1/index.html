explanation\":\"$$9$ 凑十需要 $1$，所以 $6$ 应分成 $1$ 和 $5$。$9+1=10, 10+5=15$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/04/04870fde648ed1429e03d20ce090092b1c772d99.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/f4/f49d648ee86023cbecf62014170681a8a902b763.mp3\",\"https://api.clthuanxie.cn/cc-audio/e3/e39d12080c8fe4d09c0ffc519e954d2b1313eece.mp3\",\"https://api.clthuanxie.cn/cc-audio/99/99e080491c9d3cbc98774ff7a943f52b72e3373f.mp3\",\"https://api.clthuanxie.cn/cc-audio/a3/a386780d13b284df0c01430670d83204d97ba1b5.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/d0/d0167a04a08e2700149cd19198215b72e0d37048.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"凑十法的算法与应用\",\"question\":\"有 2 盒粉笔，第一盒 9 支，第二盒 8 支，用了 5 支，还剩多少支？\",\"options\":[\"10\",\"11\",\"12\",\"13\"],\"answer\":\"12\",\"explanation\":\"先算一共：$9+8=17$，再算剩下：$17-5=12$。验算：$12+5=17$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/40/40906dd901e63fe189b673e7527cbd4bd98c97a1.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/b1/b1d5781111d84f7b3fe45a0852e59758cd7a87e5.mp3\",\"https://api.clthuanxie.cn/cc-audio/17/17ba0791499db908433b80f37c5fbc89b870084b.mp3\",\"https://api.clthuanxie.cn/cc-audio/7b/7b52009b64fd0a2a49e6d8a939753077792b0554.mp3\",\"https://api.clthuanxie.cn/cc-audio/bd/bd307a3ec329e10a2cff8fb87480823da114f8f4.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/52/529f4593f307c505daa51ec19e26543dc8261a13.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"凑十法的算法与应用\",\"question\":\"一排小朋友，从小红开始数，前面有 8 人，后面有 4 人，这一排一共有 ___ 人。\",\"options\":[],\"answer\":\"13\",\"explanation\":\"前面 $8$ 人 + 小红 $1$ 人 + 后面 $4$ 人。列式：$8+1+4=13$。验算：$13-4-1=8$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/50/50037778165914b4bcb3dfec48a11ed14df22827.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/b1/b1ba374f4983c7cbb174f76d6e1ba5f59f4a7d45.mp3\"}},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"凑十法的算法与应用\",\"question\":\"$$9 + 9 = ?$\",\"options\":[],\"answer\":\"18\",\"explanation\":\"$$9 + 9 = 18$。凑十：把第二个 $9$ 分成 $1$ 和 $8$，$9+1=10, 10+8=18$。验算：$18 - 9 = 9$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/ad/adb3b99dcbc4407ed37fff08d9a1d334be9fbbc6.edge-bf8efa7f1807.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/b8/b87d6cf667401ee966cb508dd0b6f972f95b904c.mp3\"}}],\"knowledge\":{\"point\":\"凑十法的算法与应用\",\"core_concept\":\"凑十法是将两个加数中的一个拆开，使得其中一部分与另一个加数合并后正好等于10，再用10加上剩下的部分。这种方法通过转化，把复杂的进位加法变成了简单的10加几，极大地提高了计算速度和准确率。\",\"key_formula\":\"$$\\text{大数} + \\text{小数} = \\text{大数} + (\\text{10的补数} + \\text{剩余数}) = 10 + \\text{剩余数}$\",\"common_mistakes\":[\"拆数错误：例如算 $9+5$ 时，把 $5$ 拆成了 $2$ 和 $3$，导致无法凑成 $10$。\",\"忘记最后一步：只算出了 $9+1=10$，忘记了还要加剩下的数。\"],\"tips\":\"‘看大数，分小数，凑成十，加剩数’。一定要熟练掌握‘凑十歌’，如‘9要1，8要2，7要3，6要4’。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/5d/5d689382a14e9f31ae4e71b05f8619428e583017.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/84/845a7be76c8d4ecf9831e2764b5761ea696abed5.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/ea/eac93c15d6bfd1997cfd8c667eb365b882bb2bab.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/07/074254486fcf13ae795e3986547d62204f85274f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/5b/5bac0914850c8fd443ddece6626eb914a44af497.mp3\",\"https://api.clthuanxie.cn/cc-audio/fb/fb72c753ac66c304868285ca8f73cced6470800e.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
