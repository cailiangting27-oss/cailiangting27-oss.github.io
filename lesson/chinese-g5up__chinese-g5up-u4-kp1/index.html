n)\",\"explanation\":\"喑读yīn，擞读sǒu。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"‘我劝天公重抖擞，不拘一格降（jiàng）人材’中‘抖擞’的意思是？\",\"options\":[\"身体颤抖\",\"精神振作\",\"大声呼喊\",\"严肃认真\"],\"answer\":\"精神振作\",\"explanation\":\"‘抖擞’在诗中指振作精神，希望清政府能重整朝气。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"陆游在《示儿》中最大的遗憾是？\",\"options\":[\"自己老了\",\"见不到儿子\",\"不见九州同\",\"万事皆空\"],\"answer\":\"不见九州同\",\"explanation\":\"诗中明确表达‘但悲不见九州同’，指还没看到国家统一。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"《题临安邸》中‘暖风熏得游人醉’中的‘暖风’不仅指春风，还暗指？\",\"options\":[\"寒冷的风\",\"迷人的花香\",\"娇淫腐败的社会风气\",\"自然的微风\"],\"answer\":\"娇淫腐败的社会风气\",\"explanation\":\"‘暖风’讽刺了南宋统治者的纵情声色、苟且偷安。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"‘九州’在《己亥杂诗》中指代的是什么？\",\"options\":[\"九个州\",\"中国\",\"长江\",\"天空\"],\"answer\":\"中国\",\"explanation\":\"古代中国分为九州，因此九州作为中国的代称。\"},{\"id\":16,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"王师北定中原日，家祭无忘告（___）。\",\"options\":[],\"answer\":\"乃翁\",\"explanation\":\"‘乃翁’指你的父亲，在此诗中陆游指代自己。\"},{\"id\":18,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"林升在《题临安邸》中用‘西湖歌舞（___）’表达对权贵只顾享乐的愤慨。\",\"options\":[],\"answer\":\"几时休\",\"explanation\":\"休意为停止，整句表达了什么时候才能停止这靡靡之音的质疑。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"将下列诗人和对应的诗作进行连线。\",\"options\":[\"陆游\",\"林升\",\"龚自珍\",\"梁启超\",\"《己亥杂诗》\",\"《示儿》\",\"《少年中国说》\",\"《题临安邸》\"],\"answer\":\"A-2,B-4,C-1,D-3\",\"explanation\":\"陆游《示儿》，林升《题临安邸》，龚自珍《己亥杂诗》，梁启超《少年中国说》。\"},{\"id\":21,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"古诗意象与爱国情感赏析\",\"question\":\"将下列词语与其在古诗文中的正确解释连线。\",\"options\":[\"元知\",\"九州\",\"万马齐喑\",\"不拘一格\",\"全国意思\",\"原本知道\",\"沉闷局面\",\"打破常规\"],\"answer\":\"A-2,B-1,C-3,D-4\",\"explanation\":\"元通原；九州代中国；喑指沉默不语；一格指固定模式。\"}],\"knowledge\":{\"point\":\"古诗意象与爱国情感赏析\",\"core_concept\":\"理解古诗中的爱国情怀需要抓住核心意象。如《示儿》中的‘中原’、‘九州’表达了对国土完整的渴望；《己亥杂诗》通过‘风雷’比喻社会的大变革。学习时应了解陆游、林升、龚自珍所处的不同时代背景，体会他们或是悲剧性的遗嘱，或是辛辣的讽刺，或是充满期待的呼唤。\",\"key_formula\":\"诗人+特定意象（如风雷/暖风）+时代背景=诗人所寄托的家国之志\",\"common_mistakes\":[\"容易将‘九州’、‘元知’等古汉语词汇理解为现代汉语意思\",\"忽视诗歌背景，无法体会《题临安邸》中的讽刺口吻\"],\"tips\":\"朗读时应注意情感变化：如《示儿》应沉郁但坚定，《己亥杂诗》应充满振奋之情。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
