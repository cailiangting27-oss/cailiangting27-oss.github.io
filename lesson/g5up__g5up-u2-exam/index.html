ty\":3,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"如果一个三角形向左平移 4 格，它的三个顶点的数对中的第一个数都要减去 4。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"图形向左平移，所有点对应的列数（第一个数）都会减去平移的格数。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"在方格纸上用数对确定点的位置\",\"question\":\"下列数对中，表示的位置与 $(3, 5)$ 最接近的是：\",\"options\":[\"(3, 8)\",\"(1, 5)\",\"(3, 6)\",\"(6, 5)\"],\"answer\":\"(3, 6)\",\"explanation\":\"比较坐标差距，$(3, 6)$ 与 $(3, 5)$ 仅相差 1 行，距离最近。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"用数对表示具体情境中的位置\",\"question\":\"三(1)班教室里，小明的位置是 $(2, 3)$，小红的位置是 $(2, 5)$，小刚的位置是 $(4, 3)$。谁与小明在同一列？\",\"options\":[\"小红\",\"小刚\",\"小明自己\",\"都不在\"],\"answer\":\"小红\",\"explanation\":\"同一列代表数对第一个数字相同。小明和小红第一个数字都是 2。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"点 A $(3, 4)$ 先向右平移 2 格，再向下平移 1 格，新坐标是：\",\"options\":[\"(5, 3)\",\"(1, 5)\",\"(5, 5)\",\"(1, 3)\"],\"answer\":\"(5, 3)\",\"explanation\":\"列：$3+2=5$；行：$4-1=3$。结果 $(5, 3)$。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"如果三角形两个顶点的坐标分别是 $(1, 1)$ 和 $(4, 1)$。整个三角形向上平移 2 格后，这两个点变为：\",\"options\":[\"(1, 3)和(4, 3)\",\"(3, 1)和(6, 1)\",\"(1, 1)和(4, 1)\",\"(3, 3)和(6, 3)\"],\"answer\":\"(1, 3)和(4, 3)\",\"explanation\":\"向上平移只改变行坐标（加 2）。$1+2=3$。坐标变为 $(1, 3)$ 和 $(4, 3)$。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"点 M $(a, b)$ 向左平移 3 格，再向上平移 4 格后的位置是：\",\"options\":[\"(a-3, b+4)\",\"(a+3, b-4)\",\"(a-4, b+3)\",\"(a+4, b-3)\"],\"answer\":\"(a-3, b+4)\",\"explanation\":\"向左列减，向上行加。故为 $(a-3, b+4)$。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"用数对表示具体情境中的位置\",\"question\":\"在方格练习本上，(3, 4) 到 (3, 7) 的距离是几格？\",\"options\":[\"3\",\"4\",\"7\",\"11\"],\"answer\":\"3\",\"explanation\":\"列数相同，行数差为 $7 - 4 = 3$。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\
