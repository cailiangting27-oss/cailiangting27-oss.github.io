\"answer\":\"机智果断\",\"explanation\":\"面对敌人，雨来反应迅速，说明他非常机智果断。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"英雄人物的精神品质分析\",\"question\":\"阅读语段：“雨来仰着脸，望着妈妈。妈妈还在打。雨来一矮身，钻到妈妈的双臂下面。”这段话体现了：\",\"options\":[\"雨来不怕妈妈\",\"雨来顽皮灵活\",\"雨来胆大妄为\",\"雨来心情很难过\"],\"answer\":\"雨来顽皮灵活\",\"explanation\":\"通过动作描写，展现了孩子天真、调皮、机灵的一面。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"英雄人物的精神品质分析\",\"question\":\"根据课文内容，将人物与其特点准确连线。\",\"options\":[\"雨来\",\"青铜\",\"车胤\",\"李白\",\"机智勇敢\",\"勤勉克苦\",\"持之以恒\",\"坚韧淳朴\"],\"answer\":\"A-1,B-4,C-2,D-3\",\"explanation\":\"雨来机智，青铜通过卖鞋体现坚韧，车胤勤勉学习，李白学铁杵精神后的持之以恒。\"},{\"id\":21,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"英雄人物的精神品质分析\",\"question\":\"根据情节将《芦花鞋》中的内容进行连线。\",\"options\":[\"辛苦编鞋\",\"冒雪卖鞋\",\"最后的一双\",\"为了家人\",\"执着等待\",\"赤脚回家\",\"精心准备\",\"无私纯良\"],\"answer\":\"A-3,B-2,C-1,D-4\",\"explanation\":\"编鞋是精心准备；卖鞋是雪中等待；卖掉最后那一双意味着赤脚回家；这一切都是因为他照顾家人。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"英雄人物的精神品质分析\",\"question\":\"将下列词语排列成一句赞美雨来的话。\",\"options\":[\"雨来\",\"抗日\",\"是\",\"爱国的\",\"一个小英雄\"],\"answer\":\"雨来,是,一个小英雄,爱国的,抗日\",\"explanation\":\"语序应为：雨来是一个爱国的抗日小英雄。但在选项逻辑中应表述为：雨来是抗日爱国的一个小英雄。根据给出的词语排列为“雨来是爱国的抗日一个小英雄”。\"},{\"id\":23,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"英雄人物的精神品质分析\",\"question\":\"将词语排列成通顺的句子描述青铜的行为。\",\"options\":[\"青铜\",\"在雪地里\",\"那双\",\"卖掉了\",\"最后一双鞋\"],\"answer\":\"青铜,在雪地里,卖掉了,那双,最后一双鞋\",\"explanation\":\"句子逻辑为：青铜在雪地里卖掉了那双最后一双鞋。\"}],\"knowledge\":{\"point\":\"英雄人物的精神品质分析\",\"core_concept\":\"阅读《小英雄雨来》和《芦花鞋》，学习通过人物的言行、举止尤其是心理活动和细节描写来感受人物性格。雨来的机智果断、青铜的坚韧无私，都是通过一个个具体的生活细节塑造出来的。\",\"key_formula\":\"抓描写（动作/语言）+ 联想背景 = 概括性格特征\",\"common_mistakes\":[\"概括性格只用‘好’、‘坏’等简单词汇\",\"分析人物时脱离课文具体情节，主观臆断\"],\"tips\":\"关注反复出现的句子（如“我们是中国人”），那往往是人物精神的支柱。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
