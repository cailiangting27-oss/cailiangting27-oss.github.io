atching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"连续细致的观察\",\"question\":\"请根据课文内容，将动物与它们的“住处”连接起来。\",\"options\":[\"蟋蟀\",\"爬山虎\",\"蚕\",\"燕子\",\"墙上的脚\",\"土中的住宅\",\"泥做的窝\",\"软绵绵的房\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"考验学生对课文中事物关联的细致了解。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/53/5352d13ef9c34813699c26c6dfe70d752dea47f6.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/49/49bcd391d53adee50dec3f1424495c9f8df0b7f5.mp3\",\"https://api.clthuanxie.cn/cc-audio/53/534544e3483dc4d8cd80af9dc89255a4438493cc.mp3\",\"https://api.clthuanxie.cn/cc-audio/73/73eb9ba0a005505b50075489ab80909666316690.mp3\",\"https://api.clthuanxie.cn/cc-audio/0a/0a6196e7629e76799b11f5b2d4cef690db54a764.mp3\",\"https://api.clthuanxie.cn/cc-audio/01/01f93561c63156b57f33c4818018519b99b6b2c7.mp3\",\"https://api.clthuanxie.cn/cc-audio/6d/6d13cc4dbdb2e8972d6f80402ea28ec79ad934f6.mp3\",\"https://api.clthuanxie.cn/cc-audio/99/999d30a7f5f7b6817e0a030efb3a13d02b5e7897.mp3\",\"https://api.clthuanxie.cn/cc-audio/25/25a9074d95d572b81adb18077516c8f52bbc5547.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/5b/5b79f0c6c7f0b0280a90317a9c6f70d8584efaf6.mp3\"}},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"连续细致的观察\",\"question\":\"请按句子逻辑排列爬山虎爬墙的过程：\",\"options\":[\"细丝\",\"触着墙\",\"变成小圆片\",\"巴住墙\"],\"answer\":\"细丝,触着墙,变成小圆片,巴住墙\",\"explanation\":\"体现动作发生的先后顺序：触、变、巴。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/17/1767c4b85eeea1e3a896b39200b7dfb01926386d.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/e0/e02d882882330bae854ba55f513bc22859cf1de0.mp3\",\"https://api.clthuanxie.cn/cc-audio/0f/0fc9d3ac4cd9e48cf004e1d330c8c326fe7922cb.mp3\",\"https://api.clthuanxie.cn/cc-audio/23/236a5f7b3676f0c926398b14cb39978fd361da50.mp3\",\"https://api.clthuanxie.cn/cc-audio/f9/f9a346c2cac2c6f5118e5e4a4e5ed1d9749484bb.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/ae/aed1d31f42f701b840135d374d120470b9447348.mp3\"}}],\"knowledge\":{\"point\":\"连续细致的观察\",\"core_concept\":\"这是观察的高级阶段，不仅要求“看清”某一时刻的静态特征，更要求“盯住”事物在一段时间内的动态演变。像叶圣陶观察爬山虎脚的变化、法布尔观察蟋蟀建房，都需要通过长期的耐心守候，捕捉到事物生、长、老、死的细微动作，并将这些变化用准确的动词（如：触、变、巴、拉、贴）记录下来。\",\"key_formula\":\"观察对象 + 持续时间 + 阶段性变化细节 = 连续细致的观察\",\"common_mistakes\":[\"只记录观察结果，忽略了变化的动态过程。\",\"用词笼统，无法通过动词区分细微的动作差别。\"],\"tips\":\"可以尝试给观察对象分阶段：第一阶段是怎样的，第二阶段发生了什么，这种‘分步法’有助于提升观察粒度。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/35/3578c70a5526c7278ad8d1256f25007d8ca46bb2.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ab/abb3d41ede714091fd32a5e27755fbfd8d8bedd9.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/32/3279056f3e2af685bb0d37eb52a86a68e83027cd.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/95/95364ac6d2d5d563c416bc7a9b8cde778060134f.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/cb/cb6f519275f49ca4a7eb6a51207b63e515420171.mp3\",\"https://api.clthuanxie.cn/cc-audio/13/1325e48f582cf0c5c0476d0b218f298d2a748ea1.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
