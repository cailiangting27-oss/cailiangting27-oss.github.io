.cn/cc-audio/3c/3c969f546e0117862efcd98d64879bd30a12db0e.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/10/1012e569ae9f8b5d197ef348f4cb0fe67a8e1fd1.mp3\"}},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"在方格纸上用数对确定点的位置\",\"question\":\"数对 $(5, 8)$，如果左边的 5 表示列，右边的 8 表示行，那么这个点所在的位置是：\",\"options\":[\"第 8 列第 5 行\",\"第 5 行第 8 列\",\"第 5 列第 8 行\",\"第 8 行第 8 列\"],\"answer\":\"第 5 列第 8 行\",\"explanation\":\"数对中的第一个数是列，第二个数是行，故为第 5 列第 8 行。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/91/914d104384fc7d3d7f6f07ceea5c6c43eda997ed.edge-62dfb8186c1f.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/f0/f0967a4e6695a288cd85e963195ed196d79aaa43.mp3\",\"https://api.clthuanxie.cn/cc-audio/53/530418130ef5a0ec60d0c8f07b6288cfbc3fafa3.mp3\",\"https://api.clthuanxie.cn/cc-audio/b2/b2f59bdd227032d328684c541f9dcdbf8db68db0.mp3\",\"https://api.clthuanxie.cn/cc-audio/47/476a9b8d215277a54ef788cb9175a7ff47cb8e25.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/24/241ca934d1238f9cd0489b223532922842c7dfcf.mp3\"}},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"在方格纸上用数对确定点的位置\",\"question\":\"在方格纸上，点 A $(3, 2)$ 向右平移 2 格后的位置是：\",\"options\":[\"(3, 4)\",\"(5, 2)\",\"(1, 2)\",\"(5, 4)\"],\"answer\":\"(5, 2)\",\"explanation\":\"向右平移 2 格，列数加 2，行数不变。$3 + 2 = 5$，所以新坐标为 $(5, 2)$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/a9/a9a4619bb824a3ed89cf49ade17b2a4c8aecc85a.edge-c8ab23a6e7de.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/63/63f7ecf985968ebb4066c2b30edde311e16ef1e3.mp3\",\"https://api.clthuanxie.cn/cc-audio/e2/e221fc5ea83d0d8a5c1cfb2d85181f293bbf4bb0.mp3\",\"https://api.clthuanxie.cn/cc-audio/90/90cdbfffd8597bef2a313ee9ecd25bfdb8e3af12.mp3\",\"https://api.clthuanxie.cn/cc-audio/70/70e64ebbb565b866c5e0f488b38f1d2ffde25eee.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/41/41a07bc6ddbcff768a47663e924df069600790c3.edge-aebae464a508.mp3\"}},{\"id\":13
