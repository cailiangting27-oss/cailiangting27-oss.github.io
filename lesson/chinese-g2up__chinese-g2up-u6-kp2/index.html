拖拉机\"],\"answer\":\"消防车\",\"explanation\":\"灭火是消防车的特殊用途。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/cb/cbcac1e8b112e84f1ca49f413bdb52bf70fbdade.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/f4/f4c15970b93976bc6d5872481fea3f4468bb6fa9.mp3\",\"https://api.clthuanxie.cn/cc-audio/87/87f4f192937dfb326cf15506fda6c7a46c9cca05.mp3\",\"https://api.clthuanxie.cn/cc-audio/8e/8ebf90fa22c42f1c1857ec1d19cf1a47bb9d0058.mp3\",\"https://api.clthuanxie.cn/cc-audio/4a/4ae6265245f56e16269e2769770f881c1a86e9de.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/4e/4e8d94bea7c2d1042fca7cb5c343554f558c937e.mp3\"}},{\"id\":16,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"交通工具分类与认知\",\"question\":\"人们在水上捕鱼使用的交通工具叫做（___）。\",\"options\":[],\"answer\":\"渔船\",\"explanation\":\"专门用于捕鱼的船被称为渔船。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/93/937a9c3d77b8f4e6a84a69d9552e53ebbbbec5aa.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/93/930d0c37454cec2f1aedf9987ff140eb536307d6.mp3\"}},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"交通工具分类与认知\",\"question\":\"请将交通工具与其对应的运行环境连线。\",\"options\":[\"救护车\",\"客轮\",\"飞机\",\"地铁\",\"天空\",\"地下铁路\",\"公路\",\"海洋\"],\"answer\":\"A-3,B-4,C-1,D-2\",\"explanation\":\"救护车在公路跑，客轮在海洋行，飞机在天空飞，地铁在地下跑。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/85/857c545d522bf43bdae7551bc91076c838b0b8d4.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/38/3807dbdc241ad61f9ed413ca6657f8a2aff3b62b.mp3\",\"https://api.clthuanxie.cn/cc-audio/b4/b455f756921a827004085dc61859e25f80f6794e.mp3\",\"https://api.clthuanxie.cn/cc-audio/0c/0cb0206b420005365d16b059ba66895a079c1860.mp3\",\"https://api.clthuanxie.cn/cc-audio/3d/3dad7790f9b47378b430f3bf2af22d8eb0614bef.mp3\",\"https://api.clthuanxie.cn/cc-audio/b1/b125e5a8da05a9008f4285ac9cb49ad6beaaf716.mp3\",\"https://api.clthuanxie.cn/cc-audio/f3/f3b87e3ce61f362c6f574a8649abe35adf2a9f51.mp3\",\"https://api.clthuanxie.cn/cc-audio/b2/b2ec820603852c65f21e4bf9d0133aec18f9794f.mp3\",\"https://api.clthuanxie.cn/cc-audio/b2/b247c3e6783b29f1772c0ba7baf9f3a454ecb97a.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/56/560405abb6d09b7a65262c5f8fcbeefae22ddefb.mp3\"}}],\"knowledge\":{\"point\":\"交通工具分类与认知\",\"core_concept\":\"语文园地中的‘识字加油站’要求学生识别并分类各种交通工具。可以从环境分（陆地：公交车、轿车、消防车；水上：油轮、渔船、客轮；空中：飞机、飞船）和用途分（运输、客运、救援、作业）。通过对这些词语的学习，丰富学生的社会常识和分类思维。\",\"key_formula\":\"环境+用途 = 交通工具名称\",\"common_mistakes\":[\"将‘油轮’、‘潜艇’等生疏词汇错认为是陆地工具\",\"量词使用不当，如把船说成“一辆船”\"],\"tips\":\"在出行时多观察马路上的标志，将书本词语与现实生活中看到的车辆一一对应。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/ee/ee57e344f935b324c7efbb621567ce0f13c5117c.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/44/44b575c10e17d33c03eef52fcd4ad6be1a03e9ce.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/86/862b94f314067c760e88447d28ef133d8c025096.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/47/470a13971968e79bf55594a290a3774703dd0faf.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/9a/9a6028abc8c5085abd290c50dd977cf19992ce18.mp3\",\"https://api.clthuanxie.cn/cc-audio/6f/6f57c589cc7745c2e09ddd689fda27c849b7fcaf.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
