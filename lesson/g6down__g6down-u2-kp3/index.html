o/98/98682e0edff06da193c5fafc21a83d67859ffef1.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/cf/cf94db48fb7aa4da74260da3f6c7e4722e913b72.mp3\",\"https://api.clthuanxie.cn/cc-audio/0c/0cf7739b8023e553aed3b13d785b38a7d2adea18.mp3\",\"https://api.clthuanxie.cn/cc-audio/b1/b124524c4b1ade45d1deecbcdef614fadb3ec205.mp3\",\"https://api.clthuanxie.cn/cc-audio/8a/8add240dd22943341e7e75e75ae781671e8cb3e1.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/23/237ce9ea3c2e69e31e3dd0b3aff8f4051ceee30e.mp3\"}}],\"knowledge\":{\"point\":\"利率与利息计算\",\"core_concept\":\"存入银行的钱叫本金，取款时银行多付的钱叫利息。单位时间内的利息与本金的比率叫利率。利息不仅取决于本金和利率，还取决于存款的时间长短。\",\"key_formula\":\"$$利息 = 本金 \\\\times 利率 \\\\times 存期$\",\"common_mistakes\":[\"忽视存款时间，直接用本金乘以利率\",\"求“一共取回多少钱”时漏加本金\"],\"tips\":\"计算本息合计时，可以用 $本金 \\\\times (1 + 利率 \\\\times 存期)$ 进行简便运算。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f7/f76676b6fa2ea2dc4695fd9fe3292084dcc3d9f2.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/5c/5ce26ef327d73c36508f527baa09b51a72785e93.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/b5/b5bae5ce9b570224fc8ac282fd58e626239774f8.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/5f/5fd9778d1a331a7b786312e3b0adfdcc91ed5625.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/ec/ece87602aeb88e205c3cc4d3bb489a57a9ca94b5.mp3\",\"https://api.clthuanxie.cn/cc-audio/96/96f007cab57da438288778e8af65cb3e6790998b.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
