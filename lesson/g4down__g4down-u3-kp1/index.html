\"],\"answer\":\"$$(48 + 52) + 165$\",\"explanation\":\"利用加法交换律和结合律，先将能凑整的 48 和 52 相加得到 100，再加 165 比较简便。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/e7/e7f41861b865d924ad23b1a6a962aefb0917cd12.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/b2/b272f794494241bae2074648deeef418a432a6c8.mp3\",\"https://api.clthuanxie.cn/cc-audio/0b/0bad8aeee61391d4776a1d7914950261ae11586a.mp3\",\"https://api.clthuanxie.cn/cc-audio/e9/e94717ee5ecf6a3bee3f66c176221688867848b8.mp3\",\"https://api.clthuanxie.cn/cc-audio/4e/4e8e5540ce8f61d43731ef460fd836b0df3f0bb2.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f8/f8fab3bafbce21319964b84ddbdc510ca16da3e5.mp3\"}},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"加法交换律与结合律\",\"question\":\"在学校图书馆，第一天借出 128 本书，第二天借出 195 本，第三天借出 72 本。这三天一共借出多少本书？\",\"options\":[\"385\",\"395\",\"400\",\"390\"],\"answer\":\"395\",\"explanation\":\"列式：$128+195+72 = (128+72)+195 = 200+195 = 395$。验算：$128+195=323, 323+72=395$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/2c/2c86eb9ce5e5bff874887ffd114b7932e7a9dc39.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/85/855679730970f8a0fca717e82e76cc93053c09c1.mp3\",\"https://api.clthuanxie.cn/cc-audio/86/86cf294a07a8aa25f6a2d82a8938f707a2d80ac3.mp3\",\"https://api.clthuanxie.cn/cc-audio/ab/ab7f7b955330dc8dcd7f8ae3d9689ffa32bf10d5.mp3\",\"https://api.clthuanxie.cn/cc-audio/f3/f369b411c5eb95ab252e1ab9de70f787fa720784.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/ff/ff40df40b93b30369f0ed205fe33fa4927f57d80.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"加法交换律与结合律\",\"question\":\"下面使用了加法结合律的是：\",\"options\":[\"$$a + b = b + a$\",\"$$(a + b) + c = a + (b + c)$\",\"$$a + 0 = a$\",\"$$a + b + c = a + c + b$\"],\"answer\":\"$$(a + b) + c = a + (b + c)$\",\"explanation\":\"加法结合律是指三个数相加，先把前两个数相加或先把后两个数相加，和不变。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/5c/5ca1ccc6ea81a6f53dc85031035af73580747be5.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/48/487eee80f7216495b56a2d164f6ed0173819e3d1.mp3\",\"https://api.clthuanxie.cn/cc-audio/ba/badae6310ff405b39c17564675e832bb40214d26.mp3\",\"https://api.clthuanxie.cn/cc-audio/1c/1c75d30093c7321c52b706999fcd75d6a1f8bf20.mp3\",\"https://api.clthuanxie.cn/cc-audio/1a/1a2cf5b8ab668c6ff65d442c80997ca00b40d647.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/70/709989e6e75e0e73155a9e3b560005f4c6bdcadb.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"加法交换律与结合律\",\"question\":\"计算 $145 + 37 + 55$ 时，把 145 和 55 先相加得到 200，最终结果是 ___。\",\"options\":[],\"answer\":\"237\",\"explanation\":\"$$145 + 55 + 37 = 200 + 37 = 237$。验算：$145+37=182, 182+55=237$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/52/52998dc75c59652987c483b4fb77836f75af04ea.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/aa/aaa29b380d41d42a97f641b60b350fe24b7c9b41.mp3\"}}],\"knowledge\":{\"point\":\"加法交换律与结合律\",\"core_concept\":\"加法交换律指两个数相加，交换加数位置，和不变；结合律指三个数相加，先把前两个数相加，或者先把后两个数相加，和不变。在计算中通过交换和结合，寻找凑成整十、整百、整千的数，可以显著提高运算速度。\",\"key_formula\":\"$$a + b = b + a$ \\r\\n $(a + b) + c = a + (b + c)$\",\"common_mistakes\":[\"在交换加数位置时，错误地改变了后面的运算符号。\",\"在使用结合律时，忘记在加括号或去括号时遵循符号变化规则（虽然加法比较简单，但在含有混合运算时易错）。\"],\"tips\":\"做题前先观察数字末尾。例如末尾是1找9，2找8，3找7，5找5，它们能凑成整十数。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/98/9842830d563a2f5d2f102738bd6af50610712180.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/8e/8ee82a3503104094b7a5f593f810c77fcd19e59e.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/81/8195d035bb774869b1514fde7d011bc70b79c9bb.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ec/ec55597c65200dc006492b8db31acdb3fa3731c0.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/2a/2a4fdae3f82b3d1cc87b0033c6fffcf4358f975c.mp3\",\"https://api.clthuanxie.cn/cc-audio/79/793ff271fa63b7c9cd5549337cea71321c7dec
