正方形特征认识\",\"question\":\"在下列图形中，哪一个是四边形？\",\"options\":[\"三角形\",\"长方形\",\"圆\",\"五边形\"],\"answer\":\"长方形\",\"explanation\":\"四边形有四条边，三角形有3条，圆没有直边，五边形有5条。长方形符合四条边特征。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"四边形及长正方形特征认识\",\"question\":\"正方形的四个角都是什么角？\",\"options\":[\"锐角\",\"钝角\",\"直角\",\"平角\"],\"answer\":\"直角\",\"explanation\":\"正方形和长方形的四个角均为 $90^{\\\\circ}$ 的直角。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"四边形及长正方形特征认识\",\"question\":\"下面哪组长度的四条线段可以围成一个长方形？\",\"options\":[\"2cm, 2cm, 3cm, 4cm\",\"2cm, 3cm, 2cm, 3cm\",\"1cm, 2cm, 3cm, 4cm\",\"5cm, 5cm, 5cm, 6cm\"],\"answer\":\"2cm, 3cm, 2cm, 3cm\",\"explanation\":\"根据长方形对边相等的特征，四条边必须两两相等且对应。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"四边形及长正方形特征认识\",\"question\":\"长方形的宽增加 2 厘米，长不变，它的周长增加多少厘米？\",\"options\":[\"2\",\"4\",\"6\",\"8\"],\"answer\":\"4\",\"explanation\":\"宽增加2厘米，由于长方形有两条宽，所以周长增加 $2 \\\\times 2 = 4$ 厘米。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"四边形及长正方形特征认识\",\"question\":\"正方形有 ___ 条边。\",\"options\":[],\"answer\":\"4\",\"explanation\":\"根据多边形定义，正方形属于四边形，共有4条边。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"四边形及长正方形特征认识\",\"question\":\"长方形的四个角都是直角，直角是 ___ 度。\",\"options\":[],\"answer\":\"90\",\"explanation\":\"数学中规定直角的大小固定为 90 度。\"}],\"knowledge\":{\"point\":\"四边形及长正方形特征认识\",\"core_concept\":\"由四条线段围成的封闭图形叫四边形。长方形的特点是对边相等，四个角都是直角；正方形的特点是四条边都相等，四个角也都是直角。正方形是长、宽都相等的特殊长方形。\",\"key_formula\":\"长方形对边相等，正方形四边相等\",\"common_mistakes\":[\"误认为只要有四条边的图形就是长方形（忽略直角要求）\",\"混淆长方形和正方形的关系，认为正方形不是长方形\"],\"tips\":\"可以通过折纸的方法验证：对折长方形看边是否重合；对折正方形看相邻边是否能重合。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
