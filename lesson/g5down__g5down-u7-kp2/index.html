式折线图\",\"explanation\":\"既要看气温的变化（折线），又要看两个城市的对比（复式）。验算：对比+趋势=复式折线。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"复式折线统计图的绘制与对比\",\"question\":\"复式折线统计图的优点不包括：\",\"options\":[\"能反映数据的多少\",\"能反映增减趋势\",\"便于对比两组数据\",\"能体现各部分的百分比\"],\"answer\":\"能体现各部分的百分比\",\"explanation\":\"体现部分与整体的百分比关系是扇形统计图的特点，不是折线图的专长。验算：折线图非部分占比图。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"复式折线统计图的绘制与对比\",\"question\":\"甲乙两地去年气温统计图中，甲地6月20度，乙地6月25度。两地气温差是多少度？\",\"options\":[\"5\",\"10\",\"45\",\"无法确定\"],\"answer\":\"5\",\"explanation\":\"气温差即两组数据的对应差值：$25 - 20 = 5$（度）。验算：$20 + 5 = 25$ ✓。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"复式折线统计图的绘制与对比\",\"question\":\"在观察复式折线统计图时，两条线相交的那一点表示：\",\"options\":[\"两组数据相等\",\"两组数据最大\",\"两组数据最小\",\"没有意义\"],\"answer\":\"两组数据相等\",\"explanation\":\"交点意味着在同一个时间点，两组数据所对应的纵轴数值是一样的。验算：重合即数值相同。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"复式折线统计图的绘制与对比\",\"question\":\"在一幅复式折线统计图中，甲折线的一段从50上升到80，乙折线的同一段从40上升到60。甲比乙多上升了多少单位？\",\"options\":[],\"answer\":\"10\",\"explanation\":\"甲上升：$80 - 50 = 30$；乙上升：$60 - 40 = 20$；甲比乙多上升：$30 - 20 = 10$。验算：$20 + 10 = 30$ ✓。\"},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"复式折线统计图的绘制与对比\",\"question\":\"$$(85 - 60) + (90 - 75) = ?$\",\"options\":[],\"answer\":\"40\",\"explanation\":\"先算括号内：$85 - 60 = 25$，$90 - 75 = 15$。再相加：$25 + 15 = 40$。验算：$40 - 15 = 25$ ✓。\"}],\"knowledge\":{\"point\":\"复式折线统计图的绘制与对比\",\"core_concept\":\"当需要同时比较两组或多组相关数据的变化趋势时，就在同一个坐标系中画出多条折线。为了区分不同对象，必须使用不同的线型（如实线、虚线）或颜色，并配以“图例”说明。\",\"key_formula\":\"多条折线 + 统一坐标系 + 图例 = 复式折线图\",\"common_mistakes\":[\"忘记标注图例，导致别人无法分清哪条折线代表哪个对象。\",\"两条折线共用纵轴时，忽略了每组数据由于基数不同带来的可比性问题。\"],\"tips\":\"画复式折线图时，建议先画好一条完整连线，再画另一条，避免点线混乱。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
