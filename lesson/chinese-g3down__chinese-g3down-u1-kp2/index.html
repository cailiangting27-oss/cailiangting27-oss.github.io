ion\":\"“掠过”体现了燕子飞行速度快且动作敏捷、轻盈。\"},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"“清香、嫩叶、花苞”这些词主要用于描写荷花的什么？\",\"options\":[\"动态景象\",\"生长过程\",\"静止状态\",\"嗅觉感受\"],\"answer\":\"静止状态\",\"explanation\":\"题目给出的词语多是对荷花样子、气味的静态观察。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"“有的还是花骨朵儿，看起来饱胀得马上要破裂似的。”这句话运用了什么修辞？\",\"options\":[\"比喻\",\"夸张\",\"拟人\",\"排比\"],\"answer\":\"夸张\",\"explanation\":\"“马上要破裂似的”运用夸张手法形容花骨朵非常饱满。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"下列哪组词语最能概括燕子的羽毛特点？\",\"options\":[\"五光十色\",\"乌黑光亮\",\"洁白无瑕\",\"枯黄暗淡\"],\"answer\":\"乌黑光亮\",\"explanation\":\"根据课文内容，燕子的羽毛是乌黑发亮的。\"},{\"id\":18,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"课文中描写小燕子飞行时的姿态，用到了“（___）”字，表现了动作的灵敏。\",\"options\":[],\"answer\":\"掠\",\"explanation\":\"“掠”字精准表现了燕子划过水面的轻快。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"请将描写动作的词语与相应的动物连线。\",\"options\":[\"燕子\",\"鸳鸯\",\"鸭子\",\"河豚\",\"滑过水面\",\"沙上安睡\",\"水中嬉戏\",\"逆流而上\"],\"answer\":\"A-1,B-2,C-3,D-4\",\"explanation\":\"根据本单元课文和古诗意境内容进行对应。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"燕子的外形与动态描写顺序\",\"question\":\"请将下列词语排成描写燕子的句子。\",\"options\":[\"小燕子\",\"带了\",\"剪刀似的\",\"从南方\",\"飞回来了\",\"尾巴\"],\"answer\":\"小燕子,带了,剪刀似的,尾巴,从南方,飞回来了\",\"explanation\":\"根据《燕子》第一自然段语序进行句式排列。\"}],\"knowledge\":{\"point\":\"燕子的外形与动态描写顺序\",\"core_concept\":\"学习一种有序观察的方法：先写整体给人的印象，再由远及近或由表及里地描写局部特征。在动态描写中，通过寻找精准的动词（如“掠”“沾”）来体现生物的灵性。同时，学习用比喻、拟人将自然物与人文审美（如五线谱）联系起来。\",\"key_formula\":\"灵动描写 = 观察顺序（外形-动作-休息）+ 精准动词 + 恰当比喻\",\"common_mistakes\":[\"描写顺序混乱，一会儿写头一会儿写尾巴又回到身体\",\"用词太平淡，无法体现“轻盈”和“快”的感觉\"],\"tips\":\"画一张燕子结构图，对着图按顺序背诵第一自然段，最能体会描写顺序。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script>
