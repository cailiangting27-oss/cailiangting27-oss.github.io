集合1 + 集合2 - 重叠部分。$10 + 12 = 22$人，但有3人算了两次，所以要减去3。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/7d/7d24f08cc736d760a97864973aaa530a4f09cd0e.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/5b/5b81b7818afc0b68308933d4f3eb337f8da98fa5.edge-be09bb395cca.mp3\",\"https://api.clthuanxie.cn/cc-audio/5f/5f60ef791cba13a2e73d409c455d671456ce4b63.edge-b124cecec279.mp3\",\"https://api.clthuanxie.cn/cc-audio/97/97806fcaf31a9e5a2151a91e6feebe0af448a926.edge-4a5a4054ed89.mp3\",\"https://api.clthuanxie.cn/cc-audio/21/21f11f9e36d35f86c1f01ca8cd7f38432fd1a28c.edge-b3de6c41e45c.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/31/311383b46ccbe9c413ede805915d3bc60890a75b.edge-b39b998376cf.mp3\"}},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"集合思想与韦恩图应用\",\"question\":\"已知全班参加体育赛跑的有15人，参加跳绳的有20人，两项都参加的有5人。仅参加赛跑的有几人？\",\"options\":[\"15\",\"10\",\"20\",\"5\"],\"answer\":\"10\",\"explanation\":\"$$15 - 5 = 10$人。验算：$10 (仅赛跑) + 5 (重叠) = 15$人 ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/4e/4e7bd22384942d7f87ef8e8e9e3fa5e2cd1d4097.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/f1/f1abd670358e036c31296e66b3b66c382ac00812.mp3\",\"https://api.clthuanxie.cn/cc-audio/b1/b1d5781111d84f7b3fe45a0852e59758cd7a87e5.mp3\",\"https://api.clthuanxie.cn/cc-audio/91/91032ad7bbcb6cf72875e8e8207dcfba80173f7c.mp3\",\"https://api.clthuanxie.cn/cc-audio/ac/ac3478d69a3c81fa62e60f5c3696165a4e5e6ac4.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/09/09528a5636fc2007ec858de4043077609e4647eb.edge-5ded05b15272.mp3\"}},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"集合思想与韦恩图应用\",\"question\":\"一个集合有5个元素，另一个集合有3个元素。如果它们没有重叠，并集有几个元素？\",\"options\":[\"8\",\"5\",\"2\",\"3\"],\"answer\":\"8\",\"explanation\":\"没有重叠则直接相加：$5 + 3 = 8$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/41/41301543666278945f17e497c5c1ef9bffe089b0.mp3\",\"options\":[\"https://api.clthuanxie.c uanxie.cn/cc-audio/9e/9e6a55b6b4563e652a23be9d623ca5055c356940.mp3\",\"https://api.clthuanxie.cn/cc-audio/12/12c6fc06c99a462375eeb3f43dfd832b08ca9e17.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/fe/fe7f248b4750b9726678da1a36e5598bb39f4403.edge-8fe571535415.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"集合思想与韦恩图应用\",\"question\":\"三(2)班学生报名参加兴趣小组，参加航模组的有 15 人，参加机器人组的有 18 人，两项都参加的有 7 人。参加兴趣小组的一共有 ___ 人。\",\"options\":[],\"answer\":\"26\",\"explanation\":\"列式：$15 + 18 - 7 = 26$。验算：$15 + 18 = 33$，$26 + 7 = 33$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/b9/b9b07eae87278b0565caf78f64c4302cedb8972c.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/68/684a804b01fc6d0024634878fc989437914f6b91.edge-31efc307df8f.mp3\"}}],\"knowledge\":{\"point\":\"集合思想与韦恩图应用\",\"core_concept\":\"集合思想是通过对具有某种共同特征的一组研究对象进行分类和研究的方法。韦恩图（Venn diagram）是利用闭合曲线（通常是圆）来展示不同集合之间重叠或包含关系的图。中间重叠的区域表示两个集合共同拥有的部分，即‘既是...又是...’的部分。\",\"key_formula\":\"左边独有 + 中间共有 + 右边独有 = 总数\",\"common_mistakes\":[\"将题目中的总数直接当成圆圈中除了重叠部分以外的部分\",\"无法正确区分‘包含重叠部分的集合’与‘不包含重叠部分的独有部分’\"],\"tips\":\"做题时可以先画两个大圆，把题目中的数字填入对应的区域，先填中间重叠的，再求两边剩下的。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/be/be92b1af153e64e9683c3d9bf8c3567a0c331afa.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/4b/4b410ccedbee16c145fa177e5b3191978d545268.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/d2/d2bab82cee82e134ee6eb13585cd0d69002b69cd.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/64/64f51c07d698f93e8399b06538c8e35e9565f3d4.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/6d/6d96915fb48d2d57236e02c9527918add4561e76.mp3\",\"https://api.clthuanxie.cn/cc-audio/7f/7f5c5c43922f90d8be5af74f0655a033c4900689.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
