61df1465708095c97f804f7fb0f9d0c.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"平行四边形与梯形的特征\",\"question\":\"平行四边形有 ___ 组对边分别平行。\",\"options\":[],\"answer\":\"2\",\"explanation\":\"平行四边形的定义是两组对边分别平行。故填 2。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/6b/6b043ed92a901a9e3530adbef44de1a59effb45f.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/5d/5d0b30c12e4756e335a6683a59d8bae7e3e5acec.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"平行四边形与梯形的特征\",\"question\":\"一个等腰梯形的上底是 5 厘米，下底是 7 厘米，腰是 6 厘米，它的周长是 ___ 厘米。\",\"options\":[],\"answer\":\"24\",\"explanation\":\"列式：$5 + 7 + 6 \\times 2 = 5 + 7 + 12 = 24$。等腰梯形两腰相等，所以两腰共 12 厘米，加上底和下底。验算：$24 - 12 - 7 = 5$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/6c/6ccf37e8bbb072c27b0bd43c3d295a0a32674b8c.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f7/f7b8e11f215da96ad19f954d2b53857304a36bce.edge-eb85e5e47440.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"平行四边形与梯形的特征\",\"question\":\"计算一个平行四边形相邻两边之和：$15 + 25 = ?$\",\"options\":[],\"answer\":\"40\",\"explanation\":\"$$15 + 25 = 40$。验算：$40 - 25 = 15$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/c8/c862a7742f3c1bfb6a4224f32aac75324f1fa208.edge-f51690f19969.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/fe/fecfd8998860587c2c4c5de298162a46023bd1e4.edge-1c3fb9149715.mp3\"}}],\"knowledge\":{\"point\":\"平行四边形与梯形的特征\",\"core_concept\":\"两组对边分别平行的四边形是平行四边形；只有一组对边平行的四边形是梯形。平行四边形容易变形，具有不稳定性。正方形和长方形都是特殊的平行四边形。\",\"key_formula\":\"平行四边形的周长 = (长边 + 短边) \\\\times 2\",\"common_mistakes\":[\"认为梯形有 2 条高（实际上有无数条）\",\"混淆平行四边形和梯形的定义，特别是对‘只有’二字的理解\"],\"tips\":\"通过‘包含关系图’记忆：四边形包含平行四边形和梯形，平行四边形包含长方形，长方形包含正方形。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/e2/e23a8f6b6e682a2426822c0ac10106c869c85fea.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/06/0605a
