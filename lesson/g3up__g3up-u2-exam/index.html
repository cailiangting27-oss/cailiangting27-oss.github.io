ore\":2,\"difficulty\":3,\"knowledge_point\":\"两位数加减两位数的口算\",\"question\":\"$$2\\text{?}$ 加上 $3\\text{?}$ 的和一定是五十多。\",\"options\":[],\"answer\":\"错\",\"explanation\":\"例如 $29 + 39 = 68$，和是六十多。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"几百几十加减几百几十的笔算\",\"question\":\"小蜜蜂采了 420 毫升花粉，又采了 280 毫升。一共采了多少毫升？\",\"options\":[\"600\",\"700\",\"680\",\"720\"],\"answer\":\"700\",\"explanation\":\"$$420 + 280 = 700$。验算：$700 - 280 = 420$。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"两位数加减两位数的口算\",\"question\":\"妈妈买了 25 个苹果，梨比苹果多 16 个。梨有多少个？\",\"options\":[\"9\",\"31\",\"41\",\"42\"],\"answer\":\"41\",\"explanation\":\"$$25 + 16 = 41$。验算：$41 - 16 = 25$。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"用估算解决实际问题\",\"question\":\"电影院共有 800 个座位。一年级有 392 人，二年级有 405 人，两个年级同时进去看电影，坐得下吗？\",\"options\":[\"坐得下\",\"坐不下\",\"正好坐满\",\"无法计算\"],\"answer\":\"坐得下\",\"explanation\":\"$$392 \\rightarrow 390$，$405 \\rightarrow 400$。$390 + 400 = 790$。因为 $790 \u003c 800$，且实际值 $392 + 405 = 797$ 仍然小于 800，所以坐得下。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"两位数加减两位数的口算\",\"question\":\"计算 $90 - 43$ 时，先把 43 分成 40 和 3。$90 - 40 = 50$，$50 - 3 = (\\text{?})$。\",\"options\":[\"47\",\"53\",\"43\",\"57\"],\"answer\":\"47\",\"explanation\":\"$$90 - 43 = 47$。验算：$47 + 43 = 90$。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"用估算解决实际问题\",\"question\":\"下面各数中最接近 600 的数是哪一个？\",\"options\":[\"512\",\"591\",\"602\",\"698\"],\"answer\":\"602\",\"explanation\":\"$$602 - 600 = 2$；$600 - 591 = 9$。2 最小，所以 602 最接近。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"几百几十加减几百几十的笔算\",\"question\":\"两个三位数相加，和是几位数？\",\"options\":[\"一定是三位数\",\"一定是四位数\",\"三位数或四位数\",\"两位数\"],\"answer\":\"三位数或四位数\",\"explanation\":\"$$100 + 100 = 200$ (三位数)，$500 + 600 = 1100$ (四位数)。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"
