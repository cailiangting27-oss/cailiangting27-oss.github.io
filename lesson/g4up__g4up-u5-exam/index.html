estion\":\"直角梯形中只有一个角是直角。\",\"options\":[],\"answer\":\"错\",\"explanation\":\"直角梯形既然有一条腰垂直于底边，那么这条腰与上底和下底的交角都是 90 度，所以至少有两个直角。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"平行与垂直的认识\",\"question\":\"要把一根木条固定在墙上，为了使其更稳固，通常用两枚钉子，这是利用了：\",\"options\":[\"两点确定一条直线\",\"垂线段最短\",\"平行线性质\",\"三角形稳定性\"],\"answer\":\"两点确定一条直线\",\"explanation\":\"两枚钉子即两个点，两点决定了木条在墙上直线的位置，使其不能旋转。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"平行线与垂线的画法\",\"question\":\"画已知直线的平行线，可以利用哪组工具最准确？\",\"options\":[\"直尺和量角器\",\"三角尺和量角器\",\"直尺和三角尺\",\"两个圆规\"],\"answer\":\"直尺和三角尺\",\"explanation\":\"课本教材标准画法是：一靠、二移、三画，需要直尺作为导轨，三角尺移动。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"平行四边形与梯形的特征\",\"question\":\"将一个长方形木框拉成平行四边形后，平行四边形的高与长方形的宽相比：\",\"options\":[\"变长了\",\"变短了\",\"长度不变\",\"无法比较\"],\"answer\":\"变短了\",\"explanation\":\"拉动时侧边倾斜，垂线段（高）必然小于斜线性段（宽）。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"平行与垂直的认识\",\"question\":\"从马路的一边到另一边，走哪条路最近？\",\"options\":[\"斜着走\",\"绕路走\",\"垂直走\",\"随意走\"],\"answer\":\"垂直走\",\"explanation\":\"马路两边视为平行线，垂线段最短，所以垂直穿过马路路程最短。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"平行四边形与梯形的特征\",\"question\":\"当梯形的上底和下底相等时，这个图形变成了：\",\"options\":[\"三角形\",\"平行四边形\",\"等腰梯形\",\"直角梯形\"],\"answer\":\"平行四边形\",\"explanation\":\"一组对边平行且相等，符合平行四边形的判定条件。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"平行线与垂线的画法\",\"question\":\"过直线外一点画已知直线的垂线，可以画几条？\",\"options\":[\"0条\",\"1条\",\"2条\",\"无数条\"],\"answer\":\"1条\",\"explanation\":\"过直线外一点只有一条直线与已知直线垂直。验算：旋转三角尺发现仅有一个位置重合。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"平行与垂直的认识\",\"question\":\"在两条平行线之间画 5 条垂直线段，第 1 条长 10 厘米，第 5 条长几厘米？\",\"options\":[\"2厘米\",\"5厘米\",\"10厘米\",\"50厘米\"],\"answer\":\"10厘米\",\"explanation\":\"平行线间的距离处处相等。既然第 1 条是 10 厘米，其他所有垂直线段一定都是 10 厘米。\"},{\"id\":17,\"type\":\
