，所以是钝角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/ca/cae677fa4fce11d12aea574bbbf2500399944ef6.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/fa/fa46c9383c238a7e8186cb189684625db7035f1d.mp3\",\"https://api.clthuanxie.cn/cc-audio/e9/e9d89bc6c8ea7bba1a97f48e83f7f4aa011406af.mp3\",\"https://api.clthuanxie.cn/cc-audio/08/08d896cb288a98e2362cf5fae5bd2283a4161d4f.mp3\",\"https://api.clthuanxie.cn/cc-audio/32/329b024b333df18ba53c7d1e7915f2d8cc7788ac.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/95/95737e0a8320a69ae286b7a31bfb661f7127978c.mp3\"}},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"画角与拼角\",\"question\":\"在一个三角形中，最多有几个直角？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"1个\",\"explanation\":\"三角形的内角和是 $180^{\\\\circ}$。如果有2个直角，和就是 $180^{\\\\circ}$，第三个角就是0度，无法组成三角形。所以最多只有1个直角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/d6/d6d40b59e0b94edea06e923a4a8c418b2703415c.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/71/71395d6e5bac49b83c2cb14f56ab1a4ac23b7808.mp3\",\"https://api.clthuanxie.cn/cc-audio/df/df6125300823711d7502ea7501c0ee660855c7c9.mp3\",\"https://api.clthuanxie.cn/cc-audio/f1/f1ffe4166e57e63bb4469906335e6cbb7c2e222d.mp3\",\"https://api.clthuanxie.cn/cc-audio/75/758a56d5716f4d8e1d861502cfcd16dbc25804fd.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/14/149760a42ff20c6f0753e4747541c2776637522d.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"画角与拼角\",\"question\":\"用尺子画角时，第一步通常是先画一个什么？\",\"options\":[\"一条边\",\"一个顶点\",\"一个圆圈\",\"两条边\"],\"answer\":\"一个顶点\",\"explanation\":\"画角的规范步骤是：先画一个点（顶点），再从这个点出发向不同的方向画出两条线（边）。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/9e/9ea6d9fb17b0b408ce40909a41d3379193f7d8d0.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/0c/0c3dc148b971537304eaadc4fec855bbba3858c0.mp3\",\"https://api.clthuanxie.cn/cc-audio/3a/3a63be43f91f633ecba74ba00d86941b0537fa57.mp3\",\"https://api.clthuanxie.cn/cc-audio/46/46b0dd860c1c7cdec3a512ea8ca000cc7a0734bc.mp3\",\"https://api.clthuanxie.cn/cc-audio/7f/7f4cb440872a92b78ad6b4fb5c2413188d167af8.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/b3/b36448e82213326ecd1030d0f0f30eb2b8f12161.mp3\"}},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"画角与拼角\",\"question\":\"用一副三角尺（一个含有 $45^{\\\\circ}$ ，另一个含有 $30^{\\\\circ}$ 和 $60^{\\\\circ}$ ），能拼出的最大角是 ___ 度。\",\"options\":[],\"answer\":\"150\",\"explanation\":\"一副三角尺中最大的两个角分别是 $90^{\\\\circ}$ 和 $60^{\\\\circ}$。拼在一起：$90 + 60 = 150$。验算：$90+45=135$，$60+45=105$，均比150小。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/44/44a07d19bb38a4be3127800d8cc9fb870fac287e.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/8e/8eb0188858717c7adbdc5890ac0118b1bf48c2d2.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"画角与拼角\",\"question\":\"计算：$45 + 45 = ?$\",\"options\":[],\"answer\":\"90\",\"explanation\":\"$$45 + 45 = 90$。验算：$90 - 45 = 45$ ✓。这代表两个 $45^{\\\\circ}$ 的角可以拼成一个直角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/36/36de513c1b0ff4429ebddef7699704de9a433fab.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/ae/ae64d6e26f1673bd69f8221650f367eabaf828db.mp3\"}}],\"knowledge\":{\"point\":\"画角与拼角\",\"core_concept\":\"画角要用尺。先点一个点，再从这一点开始往两个方向画线。拼角则是把两个三角尺上的角靠在一起，顶点对齐，边也对齐。两个锐角合起来可能是锐角、直角或者钝角。\",\"key_formula\":\"拼成的角程度 = 第一个角 + 第二个角\",\"common_mistakes\":[\"画角时边画得不直，或者没有从同一个顶点出发\",\"拼角时两个角的顶点没对齐\"],\"tips\":\"画角要‘一落笔、二画线、三标号’。拼角时，要把两个三角尺紧紧贴在一起不能留缝隙哦。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/ef/ef533ecb2ace91d3615f28b24eb45b8de3e511f4.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/8c/8cb0f0435eb66cae83baac965a3df1ac85a37ba6.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/da/daf23017e533ffd309d08b7e68f990ddd028cdcb.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/55/553751cdae
