$，取整为13。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/d5/d5791b38a6d5baf17c449d47399e303b7a2f2299.edge-89e5528b8095.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/d3/d3388c5c746d2833b9f60baabc92d24a504e09e5.edge-b71b0da14e0f.mp3\"}}],\"knowledge\":{\"point\":\"圆的面积公式推导与应用\",\"core_concept\":\"利用化曲为直的转化思想，将圆等分成若干份，拼成一个近似的长方形。长方形的长相当于圆周长的一半（$\\\\pi r$），宽相当于圆的半径（$r$）。通过长方形面积公式 $S=ab$ 推导出圆面积公式。\",\"key_formula\":\"$$S = \\\\pi r^2$\",\"common_mistakes\":[\"求面积时直接用直径平方，忘记先除以2求出半径。\",\"分不清周长和面积的单位，甚至认为数值相等时它们就相等。\"],\"tips\":\"看到直径先求半径是解决面积问题的首要习惯；理解公式来源有助于防止死记硬背出错。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/59/59021cb46b38398d0ae3f78bccf0b83e677a6c27.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/04/0421ed076c722a77ada7d57a48582d14ddb0efb2.edge-653fd9c92681.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/87/8713d1f4ea1eca4dfb801ac5d34cfbe527ad5c70.edge-2995cde07bb0.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d0/d0546527cfd55ef310d53a7b7c631501376ca985.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/2b/2b1401e67f5232211758827d37a89cd18045fa50.mp3\",\"https://api.clthuanxie.cn/cc-audio/7b/7b25ce314f9cf0c1aab41e20e4e37a26167021a1.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
