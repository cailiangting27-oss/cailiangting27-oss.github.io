anxie.cn/cc-audio/e1/e1313f455311229e5778b1a8c89a04dc464629d3.mp3\",\"https://api.clthuanxie.cn/cc-audio/03/03d1dbc26aaed47679782a0c8a86cf471a704ba2.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/d7/d76ac0304465e94e0ac0710517432dc65ad60100.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"直角、锐角、钝角的辨析\",\"question\":\"一个长方形被剪去一个角后，最多还剩 ___ 个角。\",\"options\":[],\"answer\":\"5\",\"explanation\":\"当斜着剪去一个角且不过任何顶点时，会多出两个新顶点。$4 - 1 + 2 = 5$。验算：画图可知，剩下的形状是五边形，有5个角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/c7/c7f89446a26c06b09aa0dadfc292a6a6d8c41dad.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/0a/0a76af22fd86ac9b988ec67264f18ca7e9263fc6.mp3\"}},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"直角、锐角、钝角的辨析\",\"question\":\"计算：$180 - 90 = ?$\",\"options\":[],\"answer\":\"90\",\"explanation\":\"$$180 - 90 = 90$。验算：$90 + 90 = 180$ ✓。这代表两个直角和起来是一个平角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/a3/a30c3b42585b3d655abfd31e5e9fcce10cc19579.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/81/81944d9de5cb8d39e3e89ef25ac278c17cbe4822.mp3\"}}],\"knowledge\":{\"point\":\"直角、锐角、钝角的辨析\",\"core_concept\":\"直角是角里的“标准大个子”，三角尺上最大的那个角就是直角。比直角小的（开口更小的）叫锐角，它看起来很尖锐；比直角大的（开口更大的）叫钝角，它看起来很笨笨的。我们可以用三角尺上的直角作为尺子去比一比。\",\"key_formula\":\"锐角 \u003c 直角 \u003c 钝角\",\"common_mistakes\":[\"区分不清锐角和钝角，名字记反\",\"不用三角尺测量，仅凭眼睛看近似直角的角\"],\"tips\":\"随身带个纸折的直角，不管是书本角还是桌子角，比一比就知道是什么角啦！\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/65/65eb99a4c9944eb51c092cb8ab6e65f8af64ca2b.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/58/58b0b5fac2c3604c0a40da87d269007ac3028307.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/0d/0d236a8fb8087561e1da5df1c1e4a4e2d6a59cd4.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/8e/8edb15de7308c29ba314675ed990256b4121a5bd.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/1f/1fb0abd0368
