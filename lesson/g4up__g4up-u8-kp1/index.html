钟（拿杯子倒水）= 7分钟。验算：$6+1=7$ ✓。\"},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"煮一个鸡蛋需要8分钟，一个锅一次最多可以煮10个。煮10个鸡蛋最快需要多少分钟？\",\"options\":[\"8\",\"80\",\"18\",\"40\"],\"answer\":\"8\",\"explanation\":\"10个鸡蛋可以同时放在锅里煮，时间重合。只需8分钟。验算：$8 \\\\times 1 = 8$ ✓。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"洗衣机洗衣服20分钟，拖地10分钟，擦桌子5分钟，晾衣服3分钟。做完这些事最少耗时多少分钟？\",\"options\":[\"38\",\"23\",\"35\",\"20\"],\"answer\":\"23\",\"explanation\":\"洗衣服时（20分钟）可以拖地和擦桌子。洗完后晾衣服3分钟必须单独做。$20+3=23$分钟。验算：$23 \u003e 20$且包含晾衣时间 ✓。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"李阿姨要烧水做饭。洗锅1分钟，烧开水10分钟，择菜5分钟，洗菜5分钟，煮饭20分钟。如果你是李阿姨，你会如何安排最节省时间？\",\"options\":[\"先煮饭再烧水\",\"洗锅后煮饭同时烧水\",\"洗锅烧水同时择洗菜\",\"先择洗菜再点火\"],\"answer\":\"洗锅烧水同时择洗菜\",\"explanation\":\"烧水或煮饭是耗时最长且人可离开的，洗锅后利用烧水或煮饭的等待时间择洗菜最快。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"扫地5分钟，烧水10分钟，听广播10分钟。至少需要多少分钟？\",\"options\":[\"25\",\"15\",\"10\",\"5\"],\"answer\":\"10\",\"explanation\":\"烧水时可以扫地工作，同时听广播。总时间由最长的任务决定。$10$分钟。验算：$10 \u003e 5$ ✓。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"小明要为客人沏茶。烧水8分钟，洗茶杯2分钟，找茶叶1分钟。沏茶最少需要 ___ 分钟。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"烧水时可以洗茶杯和找茶叶。最长的一项是烧水8分钟。验算：$2+1 \u003c 8$，所以总长8分钟 ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"计算：$15 + 20 - 15 = ?$\",\"options\":[],\"answer\":\"20\",\"explanation\":\"$$15 + 20 = 35$, $35 - 15 = 20$。验算：$20 + 15 = 35$ ✓。\"}],\"knowledge\":{\"point\":\"沏茶问题（时间安排）\",\"core_concept\":\"沏茶问题的核心是‘安排’。即在处理多项任务时，要分析哪些任务必须先后做，哪些任务可以同时做。通过流程图，将不冲突的任务进行‘合并’，找出耗时最长的关键路径，从而求得最短总时间。\",\"key_formula\":\"最短时间 = 顺序执行的任务时间 + 同时进行的任务中最长的时间\",\"common_mistakes\":[\"将所有任务的时间简单相加，没有考虑并行工作的可能。\",\
