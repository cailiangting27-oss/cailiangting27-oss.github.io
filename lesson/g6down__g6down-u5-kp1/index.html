e7346b7c8cc744b66fa3f36635f4f.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/18/1876d7a7055565f2d6428c1fa6718617c58328d8.edge-e022da55dcbd.mp3\"}}],\"knowledge\":{\"point\":\"鸽巢原理基础应用\",\"core_concept\":\"如果把 $n+1$ 个物体放入 $n$ 个抽屉，不管怎么放，总有一个抽屉里至少有 2 个物体。这是一种必然发生的逻辑。我们可以把这些物体看作‘鸽子’，抽屉看作‘巢’。当物体数量超过抽屉数量时，重复是必然的。这种原理不仅适用于物体分配，也适用于生日相同判定、姓氏判断等常见情境。\",\"key_formula\":\"物体数 \u003e 抽屉数，则至少数 = 2\",\"common_mistakes\":[\"混淆抽屉和物体：不知道该把哪个量看作抽屉（巢），例如把12个月份当成物体。\",\"分不清‘至少’的含义：误以为是固定在某一个特定的抽屉里有2个。\"],\"tips\":\"首先确定什么是‘抽屉’，通常情况下，题目问什么（比如月份、花色、颜色），什么就是抽屉。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/1c/1cef599524c1188388b10920e5e862f00e7f4cb7.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/6b/6badfa5502575952374c132e2f87fc2533b94650.edge-0afbdab63670.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/e3/e38e2daeb5416bed5732fca6332d5c27af23e3c4.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/1f/1fb53e79d202e0a7dee27c4769e60e13e7a290de.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/4c/4caaa8f3aac9d36aa67a61a5f34269b57a43fc96.mp3\",\"https://api.clthuanxie.cn/cc-audio/e1/e10c5d5b71bd4665b1e9a6d74327bf2944bc36a1.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
