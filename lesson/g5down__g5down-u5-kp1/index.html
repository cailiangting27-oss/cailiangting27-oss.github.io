的旋转过程，不需要考虑下面哪个因素？\",\"options\":[\"旋转中心\",\"旋转频率\",\"旋转方向\",\"旋转角度\"],\"answer\":\"旋转频率\",\"explanation\":\"旋转的三要素是：中心、方向、角度。频率与图形运动过程的描述无关。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/3c/3ccdb94bcc3b0558eb3ddf66c4931772d18f9c77.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/c5/c519b346f76b82520f472e8ed1f50005122129df.edge-ccca17ed556f.mp3\",\"https://api.clthuanxie.cn/cc-audio/40/4021c9ea94891fe66ff87f93523d46dfe14346d0.mp3\",\"https://api.clthuanxie.cn/cc-audio/dd/dd0c03bffb3b383bce9e8ec47df5ffa3f47a72ff.edge-6d2328638e86.mp3\",\"https://api.clthuanxie.cn/cc-audio/cb/cb165f5ca1ae75744cd2e5979e65519c2dfd80c4.edge-777a7aad6f88.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/6f/6fa3e0e6d286225475913ad017d74705d1ee3c72.mp3\"}},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"指针从数字 12 开始，逆时针旋转 90 度后指向哪个数字？\",\"options\":[\"3\",\"6\",\"9\",\"12\"],\"answer\":\"9\",\"explanation\":\"顺时针 90 度指向 3，逆时针 90 度指向 9。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/9a/9a4dab15db1e3c5a8711ebcefe7d8092526f4a28.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/77/77de68daecd823babbb58edb1c8e14d7106e83bb.mp3\",\"https://api.clthuanxie.cn/cc-audio/c1/c1dfd96eea8cc2b62785275bca38ac261256e278.mp3\",\"https://api.clthuanxie.cn/cc-audio/0a/0ade7c2cf97f75d009975f4d720d1fa6c19f4897.mp3\",\"https://api.clthuanxie.cn/cc-audio/7b/7b52009b64fd0a2a49e6d8a939753077792b0554.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f5/f5836c1a73ab91581e55864abc1b142dd0518dc5.mp3\"}},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"如果从当前位置顺时针旋转 90 度能回到原位，说明该图形之前是？\",\"options\":[\"顺时针转了 90 度\",\"逆时针转了 90 度\",\"顺时针转了 180 度\",\"逆时针转了 180 度\"],\"answer\":\"逆时针转了 90 度\",\"explanation\":\"逆时针旋转 90 度的还原方式是顺时针旋转 90 度。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/65/6548a89b5abbbf65a6e1130217ea06752292574c.mp3\ .mp3\",\"https://api.clthuanxie.cn/cc-audio/ec/ec7f1f65067126f3b2bd1037de8a18d0db2ec84b.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/53/532d8aec53792d24ed0900fef6704434ef83ab5c.edge-e17c185b7007.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"分针从数字 12 到 6 顺时针旋转了半圈，这个角度是多少？\",\"options\":[\"90\",\"180\",\"270\",\"360\"],\"answer\":\"180\",\"explanation\":\"半圈即 $360 \\times \\frac{1}{2} = 180$ 度。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/06/0668f24144838adef34d1ecb210ddf15094e2b07.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/2d/2d0c8af807ef45ac17cafb2973d866ba8f38caa9.mp3\",\"https://api.clthuanxie.cn/cc-audio/ec/ec7f1f65067126f3b2bd1037de8a18d0db2ec84b.mp3\",\"https://api.clthuanxie.cn/cc-audio/29/29350804a152f35fbef4117a6a434deee760dee9.mp3\",\"https://api.clthuanxie.cn/cc-audio/a1/a1773d62a609dd09e98ea1aebeddbd949b78bf83.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/a0/a048888acda8e6b68d316f9fe916207cc53ae876.edge-d853bee8516c.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"一个正方形有几个顶点？它可以绕其中任意一个顶点旋转。\",\"options\":[],\"answer\":\"4\",\"explanation\":\"正方形有 4 条边，就有 4 个顶点。验算：$1 \\times 4 = 4$✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/7b/7bd576e64d6cc7e1e631a394022aa58bdb0c5878.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/02/02be17dd3decc3dc7654fa636d05ab48ff4eea5e.edge-9d1f5f930099.mp3\"}},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"钟面上的时针每小时旋转 ___ 度。\",\"options\":[],\"answer\":\"30\",\"explanation\":\"钟面共 360 度，分为 12 大格。$360 \\times 12 = 30$（度）。验算：$30 \\times 12 = 360$✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/c2/c2ee0c1bb5bdfc284113478f44ce0e94a2f8f2d9.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/77/77706a0e080b8e10a1d895023430c9a00dfbc0ab.edge-d6004d3941af.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"计算：$90 + 90 + 90 = ?$\",\"options\":[],\"answer\":\"270\",\"explanation\":\"$$90 \\times 3 = 270$。三次 90 度旋转等于一次 270 度旋转。验算：$270 - 90 - 90 = 90$✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/e3/e3ab2f7c8875f5bdcc1394377f0ff6c0ba54658c.edge-fa072f669c9a.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/50/503e66ba85e1d28bc8ff1f74fcd15e1ffab7e2f7.edge-c28eb9e36aa5.mp3\"}},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"旋转的三要素辨析\",\"question\":\"计算：$360 - 90 = ?$\",\"options\":[],\"answer\":\"270\",\"explanation\":\"$$360 - 90 = 270$。由此可知顺时针 90 度等效于逆时针 270 度。验算：$270 + 90 = 360$✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/33/3324099fd6b711654e669d239f6960b072bf6a97.edge-70653081b1f1.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/38/3815e25c5fe941f46c0aecfd0b0cd874ff5b08dc.edge-ab3de3d5bfa0.mp3\"}}],\"knowledge\":{\"point\":\"旋转的三要素辨析\",\"core_concept\":\"旋转是指图形绕定点（旋转中心）按一定方向（顺时针或逆时针）转动一定角度的运动。旋转不改变图形的形状和大小，只改变其位置和指向。必须同时具备中心、方向、角度三个条件才能唯一确定旋转结果。\",\"key_formula\":\"图形旋转前后对应的线段相等，对应的角相等，对应点到旋转中心的距离相等。\",\"common_mistakes\":[\"混淆顺时针和逆时针的方向，导致旋转位置画错。\",\"描述旋转时漏写旋转中心或旋转角度。\"],\"tips\":\"想象自己握着圆规的一脚固定在旋转中心，另一脚带着图形划过圆弧。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/a1/a1371d536a8a41e4249df51b6cfe5b3b80334216.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ba/baefe1438c40bda275feb42a146e6dc9dfad7145.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/bf/bfdd3c06b681efe8acd7df8f51fa01ee10822f98.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/43/43335b1855cb70ad03550d4d03b643165fa50155.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/5b/5bd1614271c36ce933357fd5fb5e2d385cd63899.mp3\",\"https://api.clthuanxie.cn/cc-audio/80/808367d07ae62ddd42a452c71a2b399a01c9f3b9.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
