圆锥的体积\",\"question\":\"等底等高的圆柱体积比圆锥体积多2倍。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"圆柱是3份，圆锥是1份，3比1多2，即多2倍。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"圆柱的表面积\",\"question\":\"一个圆柱底面直径是2厘米，高是3厘米，它的底面积是多少平方厘米？（PI=3.14）\",\"options\":[\"3.14\",\"6.28\",\"12.56\",\"9.42\"],\"answer\":\"3.14\",\"explanation\":\"半径为1，$3.14 \\times 1^2 = 3.14$。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"圆柱的体积与容积\",\"question\":\"把一个圆柱形钢材铸造成一个等底的圆锥，圆锥的高是原来圆柱高的多少倍？\",\"options\":[\"1倍\",\"2倍\",\"3倍\",\"9倍\"],\"answer\":\"3倍\",\"explanation\":\"体积不变，底面积不变，圆锥的高必须是圆柱高的3倍。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"圆锥的体积\",\"question\":\"一个圆锥形沙堆，底面积是12平方米，高是1.5米，体积是多少立方米？\",\"options\":[\"18\",\"6\",\"9\",\"3\"],\"answer\":\"6\",\"explanation\":\"$$\\frac{1}{3} \\times 12 \\times 1.5 = 6$。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"圆柱与圆锥的特征\",\"question\":\"将一个圆柱的侧面展开得到一个长方形，若长方形的长正好等于底面直径，这种情况存在吗？\",\"options\":[\"存在\",\"不存在\",\"无法确定\",\"有时存在\"],\"answer\":\"不存在\",\"explanation\":\"侧面展开的长必须等于底面周长 $PI \\times d$，$PI$ 约等于3.14，必大于直径。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"圆锥的体积\",\"question\":\"一个圆柱和一个圆锥等底等高，体积之和是48立方分米，圆锥的体积是多少？\",\"options\":[\"12\",\"16\",\"24\",\"36\"],\"answer\":\"12\",\"explanation\":\"圆柱是3份，圆锥是1份，共4份。$48 \\times \\frac{1}{4} = 12$。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"圆柱的表面积\",\"question\":\"把一个圆柱侧面展开得到一个正方形，这个圆柱的底面直径与高的比是多少？\",\"options\":[\"1:PI\",\"PI:1\",\"1:1\",\"1:2\"],\"answer\":\"1:PI\",\"explanation\":\"周长=$PI \\times d = h$，所以 $d:h = 1:PI$。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"圆柱的体积与容积\",\"question\":\"体积相等的圆柱和圆锥，圆锥的高是圆柱高的2倍，那么圆柱底面积是圆锥底面积的多少倍？\",\"options\":[\"2/3\",\"3/2\",\"3\",\"6\"],\"answer\":\"2/3\",\"explanation\":\"$$S_1h_1 = \\frac{1}{3}S_2(2h_1) \\rightarrow S_1 = \\frac{2}{3}S_2$。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"圆柱的表面积\",\"question\":\"把三个完全一样的圆柱拼接成一个大圆柱，表面积减少了几个底面积？\",\"options\":[\"2个\",\"3个\",\"4个\",\"6个\"],\"answer\":\"4个\",\"explanation\":\"每次拼接减少2个面，两次拼接减少4个。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"圆柱的体积与容积\",\"question\":\"一个圆柱的底面积是15，高是4，体积是 ___ 。\",\"options\":[],\"answer\":\"60\",\"explanation\":\"$$15 \\times 4 = 60$。验算：$60 \\times \\frac{1}{4} = 15$。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"圆锥的体积\",\"question\":\"一个圆锥的体积是12，底面积是6，高是 ___ 。\",\"options\":[],\"answer\":\"6\",\"explanation\":\"$$h = V \\times 3 \\times \\frac{1}{S} = 12 \\times 3 \\times \\frac{1}{6} = 6$。验算：$\\frac{1}{3} \\times 6 \\times 6 = 12$。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"圆柱的体积与容积\",\"question\":\"计算：$20 \\times 20 \\times 10 = ?$\",\"options\":[],\"answer\":\"4000\",\"explanation\":\"$$20 \\times 20 = 400$，$400 \\times 10 = 4000$。验算：$4000 \\times \\frac{1}{10} = 400$。\"}],\"knowledge\":null},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
