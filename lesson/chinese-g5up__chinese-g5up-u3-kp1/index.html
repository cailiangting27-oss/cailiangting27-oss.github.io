lty\":1,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"民间故事通常具有情节离奇的特点，下列哪个情节体现了这一点？\",\"options\":[\"老牛开口说话了\",\"牛郎每天去下地干活\",\"哥哥嫂子分给牛郎一辆破车\",\"牛郎给老牛刷身子\"],\"answer\":\"老牛开口说话了\",\"explanation\":\"动物说话是民间故事幻想色彩的体现。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"关于《牛郎织女》和《猎人海力布》，下列说法正确的是：\",\"options\":[\"都是现代作家写的散文\",\"结局都是大团圆\",\"都含有神奇的力量或物品\",\"都发生在同一个朝代\"],\"answer\":\"都含有神奇的力量或物品\",\"explanation\":\"《牛郎织女》有老牛皮，《海力布》有宝石。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"民间故事在流传过程中产生了很多版本，这体现了它的什么特点？\",\"options\":[\"书面性\",\"真实性\",\"单一性\",\"变异性\"],\"answer\":\"变异性\",\"explanation\":\"流传过程中人们会根据自己的想象增补，导致多版本。\"},{\"id\":17,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"《孟姜女哭长城》是我国四大民间故事之一，另外三个是《白蛇传》《牛郎织女》和《________》。\",\"options\":[],\"answer\":\"梁山伯与祝英台\",\"explanation\":\"考察中国四大民间故事常识。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"请将下列故事与其对应的典型故事情节连接起来。\",\"options\":[\"《猎人海力布》\",\"《牛郎织女》\",\"《孟姜女》\",\"《白蛇传》\",\"鹊桥相会\",\"哭倒长城\",\"救下小龙女\",\"断桥相会\"],\"answer\":\"A-3,B-1,C-2,D-4\",\"explanation\":\"考察学生对经典民间故事核心内容的了解。\"},{\"id\":23,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"民间故事的特点辨析\",\"question\":\"按故事发展的逻辑，排列织女的心境变化：\",\"options\":[\"渴望自由\",\"向往人间\",\"天上寂寞\",\"勇敢下凡\"],\"answer\":\"天上寂寞,向往人间,渴望自由,勇敢下凡\",\"explanation\":\"考察学生对《牛郎织女》一课人物心理脉络的理解。\"}],\"knowledge\":{\"point\":\"民间故事的特点辨析\",\"core_concept\":\"民间故事是广大劳动人民自发创作并在口头流传的文学形式。其核心特征包括：具有神奇、离奇的情节（如动物报恩、法宝），采用口语化的叙述（如“从前……”开头），结构通常是重复性的。最重要的是，这类故事往往寄托了劳动人民对平等、良善、勤劳和美好爱情的追求，通常会有一个惩恶扬善、正义终将战胜邪恶的圆满或凄美结局。\",\"key_formula\":\"幻想情节 + 口头语言 + 群众心愿 = 民间故事\",\"common_mistakes\":[\"混淆民间故事与神话故事的概念（神话侧重解释自然，民间故事侧重社会生活）\",\"忽视民间故事在流传过程中的变异性，认为所有故事版本必须完全一样\"],\"tips\":\"可以通过总结不同故事的共有‘套路’（如报恩、历险、婚变）来快速识别民间故事的类别。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
