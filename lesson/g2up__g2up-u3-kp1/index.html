48ed17c990d0c96f62aab3f273f.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/a8/a8bf2aa80dae192268c856edf0b5cb5c07398b28.mp3\"}},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"角的认识与特征\",\"question\":\"下面图形中，哪个是角？\",\"options\":[\"有1个顶点和2条直边的图形\",\"有1个顶点和一条弧线的图形\",\"没有顶点只有直线的图形\",\"有2个顶点和1条边的图形\"],\"answer\":\"有1个顶点和2条直边的图形\",\"explanation\":\"角必须具备“一尖（顶点）两直（直边）”的特征。其他选项不符合角的组成结构。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/5d/5d38be513046296eebfed03c43ee0402ed63efd6.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/7e/7e413b4f9310a02029727d128268bbf3e0e3fd31.mp3\",\"https://api.clthuanxie.cn/cc-audio/46/46bec95c30155c1ede5fdf5690c8615e385c6ffc.mp3\",\"https://api.clthuanxie.cn/cc-audio/91/91ef67e91c2edaf2e932ea63ef7323336689824e.mp3\",\"https://api.clthuanxie.cn/cc-audio/69/69fe01e38c9ddaf8bd7ff791d3a25a6f19649a35.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/bc/bc13475ae8dd6d82f03cc275bf5d3261b3c3081e.mp3\"}},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"角的认识与特征\",\"question\":\"一个正方形有几个角？\",\"options\":[\"2个\",\"3个\",\"4个\",\"5个\"],\"answer\":\"4个\",\"explanation\":\"正方形有四个顶点，每个顶点处都有一个角，且四个角都是直角。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/9b/9b8c40741a3542737122adb7a6f13c1c19077691.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/df/df6125300823711d7502ea7501c0ee660855c7c9.mp3\",\"https://api.clthuanxie.cn/cc-audio/f1/f1ffe4166e57e63bb4469906335e6cbb7c2e222d.mp3\",\"https://api.clthuanxie.cn/cc-audio/75/758a56d5716f4d8e1d861502cfcd16dbc25804fd.mp3\",\"https://api.clthuanxie.cn/cc-audio/ff/ffa8b6b6fde3469aa0ae682cbe6d6da438d2df6b.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/8e/8ec8950f6d85fb04ff255f182dbd00534066bf77.mp3\"}},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"角的认识与特征\",\"question\":\"把一个角放在放大镜下看，这个角的大小会怎样？\",\"options\":[\"变大\",\"变小\",\"不变\",\"无法判断\"],\"answer\" 84625db7035f1d.edge-b07f9403a30c.mp3\",\"https://api.clthuanxie.cn/cc-audio/e9/e9d89bc6c8ea7bba1a97f48e83f7f4aa011406af.edge-c26827c6ee45.mp3\",\"https://api.clthuanxie.cn/cc-audio/08/08d896cb288a98e2362cf5fae5bd2283a4161d4f.edge-0c444259d23f.mp3\",\"https://api.clthuanxie.cn/cc-audio/32/329b024b333df18ba53c7d1e7915f2d8cc7788ac.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/e7/e74772ec4c7a93bbee73a0c166abe2effb53d3cb.mp3\"}},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"角的认识与特征\",\"question\":\"一个五角星上一共有 ___ 个尖尖的角。\",\"options\":[],\"answer\":\"5\",\"explanation\":\"五角星有五个突出的部分，每个部分都有一个角，总共 5 个。验算：1、2...5，正确。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/7d/7d03a8c8fc68e9519a86fee6cd2e7c6bca62d927.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/e2/e25f5439a66baf5f19e0866e4d9b6b6b4f52f6eb.mp3\"}}],\"knowledge\":{\"point\":\"角的认识与特征\",\"core_concept\":\"角是由一个共同的中心点（叫做顶点）引出的两条直直的线（叫做边）所形成的图形。角的大小与两条边张开的程度有关：开口越大，角就越大；开口越小，角就越小。特别要注意，角的大小和边的长短一点关系都没有。\",\"key_formula\":\"角 = 1个顶点 + 2条直边\",\"common_mistakes\":[\"认为边越长角就越大\",\"把有曲线的图形（如半圆）也当成角\"],\"tips\":\"记口诀：小小角，真简单，一个顶点两条边；想知角的大小，只看开口不看边。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/e3/e3716e928b57a2661b071ec7870f2b7a832c651d.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/cc/ccf68ec1ec698c47d8e426d0ecdd687f6c8ce84b.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/e1/e1d5cc825cab1520538fe0ca3bc42c4f705f984c.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/08/0886b4b4789348141dbb5b2c090571ff243330fe.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/40/4030bc6a8f96d10ca732e6ecd8aa814d743d02e9.mp3\",\"https://api.clthuanxie.cn/cc-audio/30/3064d273b6d47d0963c709954280e3d601f37f56.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
