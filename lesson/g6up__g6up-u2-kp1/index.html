n\":\"直角为 90 度。北偏东 30 度即 $90 - 30 = 60$ 度，即东偏北 60 度。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"某潜水艇在雷达扫描图上的位置是北偏西 40 度，距离 500 米。如果要在图上画出来，主要需要哪两个工具？\",\"options\":[\"量角器和直尺\",\"圆规和直尺\",\"量角器和三角板\",\"放大镜和直尺\"],\"answer\":\"量角器和直尺\",\"explanation\":\"量角器用于确定 40 度角的方向，直尺用于根据比例尺确定 500 米的图上距离。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"气象台观测到一颗气象卫星在气象台的东偏南 20 度偏向。请问这颗卫星相对于气象台的角度如果是从正南起算，应描述为：\",\"options\":[\"南偏西 20 度\",\"南偏东 20 度\",\"南偏东 70 度\",\"南偏西 70 度\"],\"answer\":\"南偏东 70 度\",\"explanation\":\"东偏南 20 度与南偏东的角度互余。$90 - 20 = 70$ 度，所以是南偏东 70 度。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"在平面图上，通常用哪种方式表示实际距离？\",\"options\":[\"分度盘\",\"长度单位\",\"比例尺\",\"指南针\"],\"answer\":\"比例尺\",\"explanation\":\"比例尺是表示图上距离比实际距离缩小的程度。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"如果 1 厘米代表 100 米。要在图上表示 400 米的实际距离，应画多少厘米？\",\"options\":[\"1 \",\"2 \",\"4 \",\"40 \"],\"answer\":\"4 \",\"explanation\":\"$$400 \\\\div 100 = 4$（厘米）。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"地图通常按照什么规律绘制？\",\"options\":[\"上南下北\",\"上西下东\",\"上北下南\",\"左东右西\"],\"answer\":\"上北下南\",\"explanation\":\"地图上的标准方向通常是上北、下南、左西、右东。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"A 在 B 的北偏东 45 度方向。那么也可以说 A 在 B 的：\",\"options\":[\"正北方向\",\"正东方向\",\"东北方向\",\"西北方向\"],\"answer\":\"东北方向\",\"explanation\":\"北偏东 45 度所在的射线恰好平分北和东的夹角，即东北方向。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"在一张地图上，用 2 厘米表示实际距离 10 千米。那么 1 厘米表示 ___ 千米。\",\"options\":[],\"answer\":\"5\",\"explanation\":\"列式：$10 \\\\div 2 = 5$（千米）。验算：$5 \\\\times 2 = 10$ ✓。\"},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"计算：$180 - 60 = ?$\",\"options\":[],\"answer\":\"120\",\"explanation\":\"$$180 - 60 = 120$。这个计算常用于补角计算。验算：$120 + 60 = 180$ ✓。\"}],\"knowledge\":{\"point\":\"根据方向和距离确定位置\",\"core_concept\":\"利用方向和距离这两个量可以确定物体在平面上的准确位置。描述时先确定观测点（中心点），再指出物体在观测点的哪个方位角（如北偏东多少度）以及距离中心点多远。这就像给每个点一个‘坐标’。\",\"key_formula\":\"$$方向 + 角度 + 距离 = 位置$\",\"common_mistakes\":[\"混淆起始边：例如将‘北偏东 30 度’画成‘东偏北 30 度’。\",\"忽略比例尺：在图上标注位置时直接标注实际公里数而不是转换后的厘米数。\"],\"tips\":\"量角时，把量角器的中心对准观测点，0刻度线对准起始方向（如正北或正东）。\"}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
