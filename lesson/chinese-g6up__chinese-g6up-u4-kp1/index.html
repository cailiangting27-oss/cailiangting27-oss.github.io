":5,\"difficulty\":2,\"knowledge_point\":\"小说环境描写的作用\",\"question\":\"‘地扫得干净，炉子里的火还没有熄。’描写的是：\",\"options\":[\"渔夫很勤快\",\"邻居家很富裕\",\"桑娜勤劳持家\",\"天气很冷\"],\"answer\":\"桑娜勤劳持家\",\"explanation\":\"环境描写体现了主人的生活态度，表现桑娜的贤惠。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/1d/1d009a476540ec57db8d497634feac10627aae89.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/63/6351300d61fff882bc727c444bc378a9389b30f2.mp3\",\"https://api.clthuanxie.cn/cc-audio/74/7435af1dadeac59ef0e53871ffae837ae19d4367.mp3\",\"https://api.clthuanxie.cn/cc-audio/6d/6de17a3835da845e4be88a2fc5e123809c0d8e08.mp3\",\"https://api.clthuanxie.cn/cc-audio/fc/fc86c40ac6fe44ea4576c69454f97c6707ddcc52.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/eb/eb230c60d2c31abf5fb931a1f50f10a48df11461.mp3\"}}],\"knowledge\":{\"point\":\"小说环境描写的作用\",\"core_concept\":\"小说中的环境分为自然环境和社会环境。自然环境指人物活动的地点、季节、气候及景物。在统编版六年级小说中，环境描写主要起到三层作用：一是交代背景，营造氛围（如《桥》中洪水的凶猛）；二是烘托人物心情或映衬人物形象（如桑娜在寒风中等待丈夫）；三是推动情节发展，成为冲突的媒介。\",\"key_formula\":\"环境描写 = 渲染氛围 + 衬托人物 + 推动情节\",\"common_mistakes\":[\"学生容易将单纯的景物描写误认为环境描写，忽视其对人物内心及情节的关联。\",\"答题思路单一，只会写‘衬托心情’，忽略了其对小说结构的作用。\"],\"tips\":\"阅读时圈出描写风、雨、天色的短句，思考：如果删掉这句，故事的紧张感是否还在？\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/db/dba14e8a62b7384927d1ebf5f173dff373e08c92.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/df/df425ea7ee584243df7c77c0a8475d4e5bbedd77.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/51/5167917dad3ee3deef50f489acc3040f25c03e70.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/72/72a49024772a29a72c88b610460400ec0e8ba683.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/68/68394ee45eafe4571e731ee6789af7ffbe337b40.mp3\",\"https://api.clthuanxie.cn/cc-audio/ef/ef701b82c3bd20a638f8baf0628a6dca75f6a6ce.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
