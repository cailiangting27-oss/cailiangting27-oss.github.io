":{\"question\":\"https://api.clthuanxie.cn/cc-audio/95/95e95fd8cc26152b0ec39a503db0d158e4557a4d.edge-2a0f2a363add.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/76/761b2ebbc213374f95683c241936ed305b6f619d.mp3\",\"https://api.clthuanxie.cn/cc-audio/69/6966f965dfa8904bc312575d8facb921a620d84b.mp3\",\"https://api.clthuanxie.cn/cc-audio/d1/d17c7c5e7c759de38db5cb6577a9a60e8ef9456a.mp3\",\"https://api.clthuanxie.cn/cc-audio/e0/e05fdc0a8d06b68cbaf40ed7dd2a04704eb325c2.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/9a/9a026657ae55a74f6ef22ff86c1dca71d4bf17fd.mp3\"}},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"正方形 ABCD 的顶点 A $(1, 1)$, B $(1, 3)$, C $(3, 3)$，那么顶点 D 的位置是：\",\"options\":[\"(3, 1)\",\"(1, 3)\",\"(3, 3)\",\"(2, 2)\"],\"answer\":\"(3, 1)\",\"explanation\":\"正方形边长为 2。A 到 B 是向上移动 2。C 应向下移动 2 到达 D，即 $(3, 3-2) = (3, 1)$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/60/608548e776a7ccc673b840bc91447ba3474c20be.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/69/6966f965dfa8904bc312575d8facb921a620d84b.mp3\",\"https://api.clthuanxie.cn/cc-audio/a6/a629cc0cd1f2e1302fae777bd2ff0b485bd081ba.mp3\",\"https://api.clthuanxie.cn/cc-audio/b1/b1de2ab3ef09d19dcfd47ff38d33986a106768b6.mp3\",\"https://api.clthuanxie.cn/cc-audio/a0/a0975468caa87203bf270355e1a6c54c2f724db7.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/a0/a03fc73e4738171d8914adbf6f85f2db6a08a9fd.mp3\"}},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"一个点 $(x, y)$ 向下平移 2 格后再向右平移 3 格，得到的新坐标是：\",\"options\":[\"(x+3, y-2)\",\"(x-3, y+2)\",\"(x+2, y-3)\",\"(x-2, y+3)\"],\"answer\":\"(x+3, y-2)\",\"explanation\":\"向右平移列加（x+3），向下平移行减（y-2）。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/13/135621a896e321a0af098ba44ff72cfaa907456e.edge-3def16b6a7fa.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/3e/3e7cfa15be5a74d568c0536a83cc249e7ff91e0e.mp3\",\"https://api.clthuanxie.cn/cc-audio/21/2197d62f01d36dcf918b64d49b9e72f50827dbf0.mp3\",\"https://api.clthuanxie.cn/cc-audio/65/65f7fde7113fc9836962e4eca621348004d9c113.mp3\",\"https://api.clthuanxie.cn/cc-audio/90/9038d09a8ae4225f3a9dd14b97df6ba7aa3ab5eb.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/e5/e57968eed6ec03a2d832433dc41a20bf170ef085.mp3\"}},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"图形平移与数对变化规律\",\"question\":\"一个点 A $(4, 5)$ 向上平移 3 格后，再向左平移 2 格，平移后的点第 1 个数字是 ___。\",\"options\":[],\"answer\":\"2\",\"explanation\":\"向左平移 2 格，列数减 2。列算式：$4 - 2 = 2$。验算：$2 + 2 = 4$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/03/034c90a968310681cd63df326353e08a1d3f75c6.edge-e1d7ffbf3d65.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/17/17935c18350a40a198098940766645922141ae54.mp3\"}}],\"knowledge\":{\"point\":\"图形平移与数对变化规律\",\"core_concept\":\"图形在方格纸上平移时，其顶点的数对会发生有规律的变化。向右平移，列数（第一个数）增加；向左平移，列数减小。向上平移，行数（第二个数）增加；向下平移，行数减小。图形的大小和形状在平移前后不发生改变。\",\"key_formula\":\"右加左减（x轴），上加下减（y轴）\",\"common_mistakes\":[\"平移方向与加减运算对应错误，如向左平移却误用了加法。\",\"平移时只改变了其中一个顶点的坐标，而忽略了图形所有顶点都要同步移动。\"],\"tips\":\"平移规律总结：左右移，变一数；上下移，变二数。平移几格就加减几。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/3a/3a210946c03df34e71018d67d37d9444298e9a3a.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/35/3571cb749ee1e3643e20d108bb4467606a791147.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/85/858e71836c6d8120cb2b468fdf83a0e236a4c693.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/2f/2fea7956785b03403c815f3bbafd0bab239e2439.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/09/0981708231aeb0eec31ae2b19eb1d6677179348d.mp3\",\"https://api.clthuanxie.cn/cc-audio/68/6819a113a8d913f0f10dabcf1b7fccd6cd2d0685.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
