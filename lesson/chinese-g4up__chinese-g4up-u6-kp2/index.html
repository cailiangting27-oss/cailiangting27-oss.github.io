{\"question\":\"https://api.clthuanxie.cn/cc-audio/01/016c8cc5976451665b0a8d44837f29b480553f06.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/32/3299c2f856bcc4785e26938c01dbe9605c0db6b8.mp3\"}},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物心理活动的揣摩\",\"question\":\"“他的脸一下子红到了耳根，低着头，不敢看老师的眼睛。”这段话描写的情绪是：\",\"options\":[\"愤怒\",\"惭愧\",\"兴奋\",\"惊讶\"],\"answer\":\"惭愧\",\"explanation\":\"“红到耳根”和“低着头不敢看”是典型不好意思、惭愧的表现。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/2d/2d259b3d1260a4ae9e9731fd4663572b9e6f8f7c.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/af/afa04bf5847221f526265f5da885911f3b2977d9.mp3\",\"https://api.clthuanxie.cn/cc-audio/a6/a68f7e5e93b35c0be6cab485c02c13f3e52ec445.mp3\",\"https://api.clthuanxie.cn/cc-audio/09/09f81f62fd857fc4e9ec192abc102deb8d226284.mp3\",\"https://api.clthuanxie.cn/cc-audio/bd/bd6bd4738cba9106238e616a5b0d16a4287bb658.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/bd/bd4a6da81d3fab2b1ea4c4927459cf325fd2a7fc.mp3\"}},{\"id\":18,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物心理活动的揣摩\",\"question\":\"《一只窝囊的大老虎》中，我登台表演时的心情用一个字形容是：（___）\",\"options\":[],\"answer\":\"怕\",\"explanation\":\"内心非常紧张害怕，形容这种心理状态最准确的一个字是“怕”。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/d6/d66af34c3f8352ffa371686b03c568ac836d94c8.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/cd/cda0f029d08e153a0456d8225f0854dfe309f9c8.mp3\"}}],\"knowledge\":{\"point\":\"人物心理活动的揣摩\",\"core_concept\":\"心理活动是人物性格的灵魂。除了直接刻画（如：我想……），作者更多地通过动作描写（手心出汗）、神态描写（俏脸通红）或环境描写（风阴冷地吹）来侧面烘托人物的内心世界。学生需要学会从这些表象中“读懂”人物到底是害怕、兴奋还是惭愧。\",\"key_formula\":\"动作/神态/语言 + 生活经验 = 人物内心。\",\"common_mistakes\":[\"容易把动作描写和心理描写混为一谈。\",\"推断人物心理不结合语境，导致情感推导偏差。\"],\"tips\":\"尝试把自己置换到文中情境，问自己：如果是我，这时候在想什么？\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/9a/9a2621bcf60305c11464cfd42721781c4ae27fea.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/6b/6bf2e3fa
