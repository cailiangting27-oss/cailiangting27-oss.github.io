n/cc-audio/d9/d92836b0d9bfe741156c6a84b320f58522a68baa.mp3\",\"https://api.clthuanxie.cn/cc-audio/02/020ff479d2df7b0e8cc73de2df59c89fcb28d04c.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/39/39075184ed33b914e62d17a6aa981b2c3ef13043.mp3\"}}],\"knowledge\":{\"point\":\"会意字构字特征分析\",\"core_concept\":\"会意字是由两个或两个以上的独体字根据意义之间的关系组合而成的新字。通过观察字形各部分的意义，可以推测出整个字的含义。例如，“明”由日和月组成，意为光亮；“尖”由小和大组成，意为末端细小。这种构字法体现了中国古人通过具象思维表达抽象概念的智慧。\",\"key_formula\":\"部件A的意义 + 部件B的意义 = 新字的逻辑意义\",\"common_mistakes\":[\"将“尖”的上部分误记为“少”。\",\"死记硬背字形而不理解“人+木=休”这种逻辑联系。\"],\"tips\":\"学习时可以采用“拆字游戏法”，把汉字想象成积木，拼在一起讲个小故事来帮助记忆。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/f5/f5c08560f87b1e206f6dce51214ebc495d1ea604.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/7d/7da4678434f4815a9cde960aee202d8f1fb4224c.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/69/69d570ec61f2920e523264e39c65f5b39e7ba239.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/2f/2f6b48a1e39d412e001f823baa1293f6e315c5a5.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/af/af0aa78779ea6b7d46eefe0395a071f5a6e867e9.mp3\",\"https://api.clthuanxie.cn/cc-audio/aa/aae7dc6abde10a1a21f1256a05dffcd2b3043c31.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
