iculty\":3,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"如果从 A 到 B 先向北走 100 米，再向东走 100 米。那么从 B 到 A 直接走直线，应该向南偏西 45 度走。\",\"options\":[],\"answer\":\"对\",\"explanation\":\"A 在 B 的西偏南 45 度（或南偏西 45 度）。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"已知图书馆在学校的东偏北 35 度方向，则图书馆与正北方向的夹角是：\",\"options\":[\"35度\",\"45度\",\"55度\",\"65度\"],\"answer\":\"55度\",\"explanation\":\"$$90 - 35 = 55$ 度。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"学校在公园的正南方向 500 米，超市在公园的正北方向 300 米，超市在学校的：\",\"options\":[\"正北 800 米\",\"正南 800 米\",\"正北 200 米\",\"正南 200 米\"],\"answer\":\"正北 800 米\",\"explanation\":\"以公园为 0 点，超市在 +300，学校在 -500。距离为 $300 - (-500) = 800$ 米，方向是北方。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"有一幅比例尺为 1:200000 的地图，图上 5 厘米代表实际距离多少千米？\",\"options\":[\"1\",\"5\",\"10\",\"100\"],\"answer\":\"10\",\"explanation\":\"$$5 \\\\times 200000 = 1000000$ 厘米 $= 10$ 千米。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"某人先向东走 40 米，再向南走 30 米。他离起点的距离是：\",\"options\":[\"70 米\",\"50 米\",\"10 米\",\"40 米\"],\"answer\":\"50 米\",\"explanation\":\"勾股定理：$30^2 + 40^2 = 50^2$。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"一辆车向北偏东 45 度方向行驶了 10 公里。若要回到原点，应该：\",\"options\":[\"南偏西 45 度走 10 公里\",\"北偏西 45 度走 10 公里\",\"南偏东 45 度走 10 公里\",\"正西走 10 公里\"],\"answer\":\"南偏西 45 度走 10 公里\",\"explanation\":\"返回原点需走相反方向。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"根据方向和距离确定位置\",\"question\":\"在描述一个位置时，为了更精确，通常把角度控制在多少度以内？\",\"options\":[\"30\",\"45\",\"60\",\"90\"],\"answer\":\"45\",\"explanation\":\"通常使用较小的角（0-45度）来描述，如东偏北 30 度而不是北偏东 60 度，但这只是习惯。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"描述简单的行走路线\",\"question\":\"
