迅先生。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/84/84ebfc2859750acb05e8a2ea1a5c24d5d2a3c3ae.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/8a/8a770158ebf4b7388e47e5ccdd7f74f7cf176026.mp3\"}},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"“紫色的圆脸，头戴一顶小毡帽，颈上套一个明晃晃的银项圈。”这段文字描写的是少年闰土的：\",\"options\":[\"动作描写\",\"神态描写\",\"外貌描写\",\"心理描写\"],\"answer\":\"外貌描写\",\"explanation\":\"通过颜色、衣着、配饰展示人物形态，属于典型外貌描写。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/5e/5eaa59b9c2457faeccdf85fef48f954aa636225e.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/2b/2bb13a1b46e021d92f8d4490214df8a1e8ec4fd3.mp3\",\"https://api.clthuanxie.cn/cc-audio/43/435fff592203fffed176e42d8a37eeac32493404.mp3\",\"https://api.clthuanxie.cn/cc-audio/c7/c7fcc659c1963839dba0a4b902f6535eff51e808.mp3\",\"https://api.clthuanxie.cn/cc-audio/ff/ff3d568abdf402a96861ccf53684618a13dbbba4.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/34/34300f08d87a2bf0f9aaf9df53b3be88c60223dd.mp3\"}},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"《有的人》一诗中，“骑在人民头上：‘呵，我多伟大！’”这句话运用的修辞手法是：\",\"options\":[\"比喻\",\"排比\",\"拟人\",\"讽刺\"],\"answer\":\"讽刺\",\"explanation\":\"通过夸张和反语描写，辛辣地讽刺了反动统治者的虚伪与丑恶。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/88/8810bb01ed7c8d9c3a8d579e8b511b2178a01100.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/86/86485979096949656e745f85f8e53a781ffc90c0.mp3\",\"https://api.clthuanxie.cn/cc-audio/b7/b7758e2a861cb519fac716d4230ac424134c621c.mp3\",\"https://api.clthuanxie.cn/cc-audio/73/73f520d9a1fffcf8eb81d945fca3cd2715921a50.mp3\",\"https://api.clthuanxie.cn/cc-audio/cc/ccdbb28e7aa439a0b87f57cdb7bde89fcfba5354.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/ab/ab7a821a6a63f9ec2a52f8b7a904044ab88692d9.mp3\"}},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"“哪怕给当差的垫垫苦也好”这里的“垫垫苦”表现了鲁迅先生：\",\"options\":[\"喜欢省吃俭用\",\"生活习惯特殊\",\"对劳动人民的关心疼爱\",\"对当差的不满意\"],\"answer\":\"对劳动人民的关心疼爱\",\"explanation\":\"通过生活小事体现鲁迅从细节上尊重和关心普通劳动者。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/29/29a1223556a8c71990aaad46468daea7b183a09f.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/0a/0af8591f8af8751305e4f943496cb1f0fdc0671e.mp3\",\"https://api.clthuanxie.cn/cc-audio/cf/cf32bdadb420c51c4bc7b7ac59f15e923869f2ac.mp3\",\"https://api.clthuanxie.cn/cc-audio/b0/b0e20273b2af7e670004af3857f25d75386ee70a.mp3\",\"https://api.clthuanxie.cn/cc-audio/80/80ca0514e9ffbdbb4113dff2c65394df5726e8f0.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/95/953f927ebe1c1e3c8d5f81a898d72baa3a58dff4.mp3\"}},{\"id\":17,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"《少年闰土》一文选自鲁迅的小说《（___）》。\",\"options\":[],\"answer\":\"故乡\",\"explanation\":\"课文截取自鲁迅小说名篇《故乡》中关于少年生活的部分。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/b2/b2074340a3cda548e7761af2a238a7b11f2cd24a.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/97/97585968dc15b30d1737e2762956f88bbcd66dc6.mp3\"}},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"请将描写方法与其对应的句子连线。\",\"options\":[\"外貌描写\",\"语言描写\",\"动作描写\",\"神态描写\",\"你想，四周围黑洞洞的\",\"他正在厨房里劈柴\",\"脸上现出悲悯的神色\",\"高大、消瘦、黄发\"],\"answer\":\"A-4,B-1,C-2,D-3\",\"explanation\":\"A外貌对应4高大消瘦；B语言对应1四周围黑洞洞的；C动作对应2劈柴；D神态对应3悲悯的神色。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/1c/1c27904400c249e5f1d764ae8a42e3d811ec3702.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/c7/c7fcc659c1963839dba0a4b902f6535eff51e808.mp3\",\"https://api.clthuanxie.cn/cc-audio/d8/d8d9683681dad026da33c97e6cff8617132bd972.mp3\",\"https://api.clthuanxie.cn/cc-audio/2b/2bb13a1b46e021d92f8d4490214df8a1e8ec4fd3.mp3\",\"https://api.clthuanxie.cn/cc-audio/43/435fff592203fffed176e42d8a37eeac32493404.mp3\",\"https://api.clthuanxie.cn/cc-audio/f0/f0df275f630df0a062b9096f524c39dbd554f991.mp3\",\"https://api.clthuanxie.cn/cc-audio/87/87dd9da0f5cbf66638d34768195b3704dae6a111.mp3\",\"https://api.clthuanxie.cn/cc-audio/98/9824754fd8b3d4ae001a2ecf17ae985cadf5a83b.mp3\",\"https://api.clthuanxie.cn/cc-audio/e7/e7dff1e6bb2a613a5f7d5304167e6ea15de7be2e.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/dc/dce0fa6b23d950f8a04bd68286a75ce50a2ebbf9.mp3\"}},{\"id\":23,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"根据课文内容，排列出鲁迅对待苦难劳工的态度：\",\"options\":[\"鲁迅\",\"俯下身子\",\"耐心地\",\"为黄包车夫\",\"包扎伤口\"],\"answer\":\"鲁迅,俯下身子,耐心地,为黄包车夫,包扎伤口\",\"explanation\":\"按照人物、动作、副词、对象、行为的逻辑顺序排列。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/89/8915b586be637f88a5472ee4179a0da53354b317.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/8e/8e1cb5824f6555813992d62b82d2866134a97d67.mp3\",\"https://api.clthuanxie.cn/cc-audio/a6/a6359101b94145481a30d5a779c000bd95146d49.mp3\",\"https://api.clthuanxie.cn/cc-audio/38/389939886ed199c5de5dd1f2790f6b20e14e076f.mp3\",\"https://api.clthuanxie.cn/cc-audio/9d/9de4ee8294b41ac57c132e58d5c643e203fa38f5.mp3\",\"https://api.clthuanxie.cn/cc-audio/95/9584c5438acac819fe20c85c9686eb1a44bb49cb.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/9c/9c092780b8ee2b3b5c138e3f87e93fc1808d5f99.mp3\"}}],\"knowledge\":{\"point\":\"人物刻画的侧面描写与对比\",\"core_concept\":\"人物刻画不止直接的外貌描写和对话，还包括通过环境烘托（如蓝天圆月）、他人反应（如“我”的敬佩）以及最核心的“对比”法。在《有的人》中，通过“生”与“死”、“骑”与“伏”的对比，鲜明地突出了两种截然不同的人格及其历史命运。\",\"key_formula\":\"刻画规则：对比显优劣，细节见真情。\",\"common_mistakes\":[\"分辨不清文中哪部分属于“我”的心理描写，哪部分是客观的人物描写。\",\"忽略环境描写对人物性格的衬托作用。\"],\"tips\":\"寻找文中两个相反的动词或形容词（如“死”和“活”），对应分析各自代表的人群。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/64/64b0b02105a26b2960359518931650e134fc25b4.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/59/5952eff083ebfb2c7b434330c53dc64e07681b36.mp3\",\"key_formula\":\"
