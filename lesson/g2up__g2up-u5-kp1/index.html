后面\",\"侧面\",\"上面\"],\"answer\":\"后面\",\"explanation\":\"树在车后面，小猫在树后面，所以看到的是车或人的后部。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/10/108a463a24c3928bb43f29bf0a36ed581b7163a6.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/9c/9c61cc16a8e08a58fd0118190b8bb9d3066c40c6.edge-b135684b5beb.mp3\",\"https://api.clthuanxie.cn/cc-audio/67/67404b82a681410683b73d366d9fd0f4c96a5bc0.edge-c0227d9c8025.mp3\",\"https://api.clthuanxie.cn/cc-audio/70/70aa1101d805f0bd92d99eb59bc4be6fe5b83fec.edge-7f4510fadb61.mp3\",\"https://api.clthuanxie.cn/cc-audio/ea/ea8f9dc2e69564ad62aa0afff1d0d1320734e5a5.edge-67704ef33b25.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/5e/5e4b1170ff044074668077ada945589eb5adb60c.mp3\"}}],\"knowledge\":{\"point\":\"从不同位置观察物体\",\"core_concept\":\"人站在不同的位置观察同一个物体，看到的物体的部位是不一样的，所以看到的物体的形状也可能是不一样的。通常我们从正面、后面、左侧面、右侧面和上面五个主要角度来辨认。\",\"key_formula\":\"观察位置不同 $\\rightarrow$ 看到的形状可能不同\",\"common_mistakes\":[\"混淆左、右侧面看到的形状，尤其是带有方向性的物体（如车头朝向）\",\"认为同一个物体无论从哪看形状都应该一样\"],\"tips\":\"观察时要通过‘身临其境’的想象，把自己假想成站在那个位置的人，看物体的特征部位在哪里。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/cd/cdd56de4bcfe84f096994f1fb6a2d8f4a736b728.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/ac/acce493550eeb161aa7c4362780c8418d69b70db.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/c4/c4bcf69a79bace425a4eba52b913dcfaa9491902.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/40/40dd6d246506a2c8bd498e40f9e406bf276f1828.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/33/33cc661a4059f1b222a928be022963db342b6945.mp3\",\"https://api.clthuanxie.cn/cc-audio/4c/4c8f52a7cd894b72832deaac9d93aa53edd02e5c.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
