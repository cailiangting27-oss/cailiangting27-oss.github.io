planation\":\"https://api.clthuanxie.cn/cc-audio/79/795c9451d23eb918f2868c20aa74c00d4dc4619b.mp3\"}}],\"knowledge\":{\"point\":\"田园古诗词鉴赏\",\"core_concept\":\"本单元选取了《宿新市徐公店》、《四时田园杂兴》、《清平乐·村居》三首古诗词。重点在于通过‘梅子’‘麦花’‘儿童’‘溪上’等具体意象，重构乡村恬静、勤劳又富有生命力的画面。学习时需体会词牌名（如清平乐）与题目的区别，理解古今异义词，如‘走’在古文中多指奔跑。\",\"key_formula\":\"画面想象三步法：看意象、思颜色、悟情感。\",\"common_mistakes\":[\"把‘急走追黄蝶’中的‘走’理解为‘散步’或‘慢走’\",\"混淆词牌名和题目，如认为‘清平乐’就是这首诗的唯一题目\"],\"tips\":\"背诵时可以闭上眼神，在大脑里画一幅画，把诗句里的景物一一‘摆放’进去。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/8e/8e34d1fdb94259f4dcddcbcaf0da380f9688cdbc.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/3c/3c3e0b7f27527b4f44bb6a35352a315f99d1e26f.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/3f/3f5076f40a606ac672464181d565510b34488eb0.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/ae/aedfed03bf76d23b6afdb414ed02df18fc555208.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/79/79937c9312414e5c5fa976ec58d25d49c9fd0bfe.mp3\",\"https://api.clthuanxie.cn/cc-audio/96/96c24f6c88f32be4b61f1114bbfaeff515a842af.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
