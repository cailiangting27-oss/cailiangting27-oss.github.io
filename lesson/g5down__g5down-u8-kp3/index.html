 4 次。\",\"options\":[],\"answer\":\"错\",\"explanation\":\"$$3 \\times 3 \\times 3 = 27$，即 $3^3 = 27$。对于 27 个物体，通过三分法只需要 3 次就能保证找到。4 次不是最少保证次数。验算：$3^3=27$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/97/97cbb15915272e93a395c2c759033b7dabe5066d.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/f6/f6687d76a08b60576bf906e6f6b3d15e6d464c3b.edge-ebcdb5254972.mp3\"}},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"有 12 瓶水，其中 1 瓶被添加了食盐稍微重一点，至少称几次能保证找出这瓶盐水？\",\"options\":[\"2 次\",\"3 次\",\"4 次\",\"5 次\"],\"answer\":\"3 次\",\"explanation\":\"因为 $3^2=9 \u003c 12 \u003c 3^3=27$，所以至少需要 3 次。验算：(4,4,4) -\u003e (1,1,2) -\u003e (1,1,0) 共3次。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/3d/3d9e9e3e42abcdcbf660a325cffb18356fed6982.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/e5/e5b0d41cefdec876fe5fa75ea1a3f0f2c6d1cc33.mp3\",\"https://api.clthuanxie.cn/cc-audio/04/04b7aad9650cb3562bc0e84ffa7381a9996bd833.mp3\",\"https://api.clthuanxie.cn/cc-audio/b6/b6350c687bd070d040073c2eebe980ba3ee7e070.mp3\",\"https://api.clthuanxie.cn/cc-audio/79/79143054c9c3b220109449dd45f7f850b7931ec3.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/8e/8efdc47dc56aec9ee2f018dfc2214ccac64a3799.edge-dd875e13ba19.mp3\"}},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"称量 2 次最多可以在多少个零件中保证找出 1 个较轻的次品？\",\"options\":[\"3 个\",\"6 个\",\"9 个\",\"12 个\"],\"answer\":\"9 个\",\"explanation\":\"利用公式 $3^n$，当 $n=2$ 时，$3^2 = 9$。验算：(3,3,3) -\u003e (1,1,1)。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/9e/9e6e557e70c5142c341387bd52fd7ce49e71ad08.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/d1/d18c930a9938a623f4738035a41cd554bf50ded6.mp3\",\"https://api.clthuanxie.cn/cc-audio/b5/b5828578513a90d219c3ea8a70db83b7137da671.mp3\",\"https://api.clthuanxie.cn/cc-audio/b1/b15988bb52519a59218877097a1b3441313af51a.mp3\" ac62a5844d6e5e.edge-6d03e98ab29b.mp3\"}},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"有 100 个零件，至少称几次能保证找出其中的一个次品？\",\"options\":[\"3 次\",\"4 次\",\"5 次\",\"6 次\"],\"answer\":\"5 次\",\"explanation\":\"因为 $3^4=81$，$3^5=243$，100 在 81 到 243 之间，所以需要 5 次。验算：$3^4 \u003c 100 \\times 3^5$。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/86/865845d891118c276232a0b58d5ab8692946ed3f.mp3\",\"options\":[\"https://api.clthuanxie.cn/cc-audio/04/04b7aad9650cb3562bc0e84ffa7381a9996bd833.mp3\",\"https://api.clthuanxie.cn/cc-audio/b6/b6350c687bd070d040073c2eebe980ba3ee7e070.mp3\",\"https://api.clthuanxie.cn/cc-audio/79/79143054c9c3b220109449dd45f7f850b7931ec3.mp3\",\"https://api.clthuanxie.cn/cc-audio/99/99e775d1de1330fb16cdb9fd6ff2ab92199c5c44.mp3\"],\"explanation\":\"https://api.clthuanxie.cn/cc-audio/0d/0d459942ccfcfcbbb36f7d9ab065f3344e22babd.edge-4d51e6811241.mp3\"}},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"通过 4 次称量，最多可以在 ___ 个零件中保证找出 1 个较轻的次品。\",\"options\":[],\"answer\":\"81\",\"explanation\":\"公式 $3^n$，当 $n=4$ 时，$3 \\times 3 \\times 3 \\times 3 = 81$。验算：$3^4 = 81$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/bd/bd2019fc33bed3e7121ef36ef80ac24f3da11c54.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/cb/cbc82fdf650dc12628e81614d12f5aaa4588dbd1.edge-b0a66400a846.mp3\"}},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"计算：$3 \\times 3 \\times 3 = ?$\",\"options\":[],\"answer\":\"27\",\"explanation\":\"$$3 \\times 3 \\times 3 = 9 \\times 3 = 27$。验算：$27 \\times 3 = 9$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/15/15ca889585e23bf0ec4d8df9cfd3141901e96c32.edge-776cc83a8478.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/1a/1a88f191a82dcc896ad381ed8de14f00d288ba46.edge-9ca45f075bf4.mp3\"}},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"称量次数与物体数量的规律总结\",\"question\":\"计算：$3 + 3 + 3 + 3 = ?$\",\"options\":[],\"answer\":\"12\",\"explanation\":\"$$3+3+3+3 = 12$。验算：$3 \\times 4 = 12$ ✓。\",\"audio\":{\"question\":\"https://api.clthuanxie.cn/cc-audio/5c/5cbf81fa4378e99ec2e0e55290794260eeec0023.edge-2b9b913ab2b5.mp3\",\"explanation\":\"https://api.clthuanxie.cn/cc-audio/e1/e1787615ef5de4256e5324e9030de704d9dbe637.edge-92d444c5dc64.mp3\"}}],\"knowledge\":{\"point\":\"称量次数与物体数量的规律总结\",\"core_concept\":\"物体总数 $n$ 与保证找出次品的最少次数 $k$ 之间满足：$3^{k-1} \u003c n \\times 3^k$。即：3个以内1次，9个以内2次，27个以内3次，以此类推。\",\"key_formula\":\"$$3^{k}$ 规律\",\"common_mistakes\":[\"记混幂运算结果，例如把 $3^3$ 算成 9 而不是 27。\",\"无法准确判断数量所在的区间，如认为 10 个只需要 2 次（实际要 3 次）。\"],\"tips\":\"背熟 3 的前 5 次幂：3, 9, 27, 81, 243，考试时直接对号入座找区间。\",\"audio\":{\"point\":\"https://api.clthuanxie.cn/cc-audio/88/88fb666cd5023d964f257bc3680cbaa3dfa210db.mp3\",\"core_concept\":\"https://api.clthuanxie.cn/cc-audio/97/9782547de01307a6a19a6307fdc3627c578e6eac.edge-c59178926ff0.mp3\",\"key_formula\":\"https://api.clthuanxie.cn/cc-audio/18/185dd1784041997f67d3ec1ebadee4cf621f0995.edge-2eab4ec843d6.mp3\",\"tips\":\"https://api.clthuanxie.cn/cc-audio/d2/d20d7a52f4c481af4eaf6dfb1fd2b684ef3fcccf.mp3\",\"common_mistakes\":[\"https://api.clthuanxie.cn/cc-audio/06/0602598867eeb7fc678431f9a36c794db4e40b1a.edge-3e634bab75f9.mp3\",\"https://api.clthuanxie.cn/cc-audio/c1/c1c58110e93d4e69c741165b033e4337eb8469a4.mp3\"]}}},\"chestSlot\":null,\"requiredPriorLessons\":[]}]}]\n"])</script></body></html>
